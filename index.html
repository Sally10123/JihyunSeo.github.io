lyse pas de données pour identifier des facteurs d'amélioration.","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"Comment j'utilise le contenu de formation du HQ dans ma filiale ?","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"J'utilise tel quel le contenu en anglais fourni par le HQ.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"Je conserve la structure et le contenu du HQ, traduis le texte en langue locale et l'applique rapidement en formation.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"Je modifie le contenu et la formulation de certaines diapositives selon la situation et les cas de ma filiale.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"À partir du contenu du HQ, je développe mon propre contenu adapté à la filiale et au profil des apprenants.","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"Quand je crée un PPT, comment j'organise l'ordre et l'enchaînement des diapositives ?","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"J'écris le contenu sur les diapositives dans l'ordre où il me vient à l'esprit.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"Je répartis le contenu par grands thèmes et organise les diapositives en conséquence.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"J'enchaîne les diapositives selon une logique de cause à effet : problème → analyse des causes → solution.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"Avec une structure qui présente d'abord la conclusion, j'organise le PPT pour que le message clé forme un seul fil conducteur.","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"Comment je réagis face à un apprenant qui exprime des difficultés ou des avis négatifs sur le contenu ou l'orientation de la formation ?","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"J'explique calmement, par principe, que le contenu doit être respecté pour garantir des standards et des résultats cohérents.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"Je compatis brièvement à ses difficultés concrètes et propose rapidement un compromis simple applicable immédiatement.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"J'écoute jusqu'au bout sa frustration et ses réticences, je fais preuve d'empathie, puis nous cherchons ensemble des solutions pratiques concrètes.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"Je partage mes propres expériences pour montrer mon empathie et le convaincre, à son niveau, de l'utilité de cette formation.","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"Comment je réagis quand mes collègues restent silencieux après une question en réunion ?","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"Si le silence dure, je passe rapidement au point suivant pour ne pas perdre de temps.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"Pour briser le silence, je demande directement à un collègue précis de répondre.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"Au lieu d'une question ouverte difficile, je propose quelques options au choix pour stimuler la réflexion.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"Je laisse naturellement 1 à 2 minutes à chacun pour organiser ses idées et échanger sereinement.","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"Comment je réagis quand un gros effort ne donne aucun résultat ni changement ?","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"Je me sens impuissant et fatigué, et je perds la motivation de faire évoluer la situation.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"Je maîtrise mes émotions pour ne pas sombrer dans la frustration et me concentre sur la formation et le coaching prévus plutôt que d'analyser les causes.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"Je cherche ce que j'ai pu manquer et examine attentivement données et terrain pour trouver comment surmonter la situation.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"Sans me laisser ébranler, je cherche dans les données des possibilités de changement et des preuves d'amélioration, et je poursuis la formation et le coaching MOT.","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"Comment je gère un stress intense ou un conflit ?","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"Je me retiens fort pour ne pas exploser, mais cela se voit un peu sur mon visage.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"Je coupe mes émotions pour ne plus penser à la source de stress et me plonge dans ce que je dois faire maintenant.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"Je change d'humeur par une conversation légère ou de l'humour, ou je me confie franchement à des collègues pour évacuer le stress.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"Je retrouve vite mon calme grâce à mes propres moyens de décompresser ou à des loisirs, et je fais de cette épreuve une occasion d'apprendre.","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"En formation, je pense que transmettre le support tel qu'il est écrit inspire davantage confiance qu'ajouter des exemples de terrain ou des analogies.","매우 그렇다":"Tout à fait d'accord","그렇다":"D'accord","그렇지 않다":"Pas d'accord","전혀 그렇지 않다":"Pas du tout d'accord","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"Quels sont globalement mon débit et mon ton pendant une formation ?","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"J'explique sur un ton constant pour transmettre l'information de façon fiable.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"J'adapte mon débit général pour que les SE comprennent le contenu.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Tout en adaptant mon débit, j'élève la voix ou le ton aux étapes clés pour bien insister.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"J'adapte débit et intensité selon la situation et marque une courte pause aux points clés.","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"Comment je donne un feedback après un RP ou un coaching terrain 1:1 ?","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"Je parle de façon détendue, surtout avec des compliments et des encouragements, pour que le SE ne se sente ni intimidé ni stressé.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"Dès que je constate un écart par rapport au standard du manuel MOT, j'interviens immédiatement pour corriger.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"Je passe en revue de façon structurée tout ce qui a été bien fait et tous les points à améliorer.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"Dans un feedback global, je cite la plus grande force et transmets clairement un comportement prioritaire à améliorer sur le terrain.","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"En formation, faire relire le manuel à voix haute de façon répétée pour apprendre vite est plus important que faire échanger les apprenants par la discussion.","매우 그렇지 않다":"Pas du tout d'accord","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"Quand les scores T-NPS sont bas, comment j'analyse les causes ?","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"Je considère d'abord qu'un manque d'amabilité ou d'esprit de service du SE est la cause principale.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"J'identifie la cause en comparant le taux d'étapes du manuel omises ou non appliquées sur le terrain.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"En examinant aussi les avis clients, je classe les causes de réclamation : accueil individuel, problème produit, environnement de service, etc.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"En excluant les facteurs environnementaux que le SE ne maîtrise pas, je dégage concrètement ce qui peut être amélioré dans l'accueil individuel.","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"En raison des conditions de ma filiale, je ne classe pas les causes des réclamations.","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"Comment je vérifie si une formation ou un coaching a réellement contribué à améliorer des indicateurs comme le T-NPS ?","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"Je vérifie si, après la formation, le T-NPS global de la filiale a augmenté par rapport au mois précédent.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"Je compare l'évolution du T-NPS global de la filiale avant et après la formation pour évaluer le niveau d'amélioration.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"Je compare le T-NPS des SE formés un mois avant et un mois après la formation.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"Je suis le T-NPS des apprenants pendant 2 à 3 mois pour vérifier si l'amélioration se maintient.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"En raison des conditions de ma filiale, je ne fais pas de suivi spécifique du T-NPS des apprenants après la formation.","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"Comment je conçois mes diapositives pour favoriser la compréhension et la participation ?","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"Je construis le support principalement autour d'une lecture collective à voix haute.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"J'insère en cours de route des textes à trous ou des quiz pour vérifier que les points clés sont retenus.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"Je crée des diapositives participatives où les apprenants corrigent eux-mêmes des comportements ou phrases erronés et vérifient la réponse grâce au feedback du formateur.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"Je crée des diapositives où les solutions émergent d'une discussion et où le feedback du formateur résume la bonne direction.","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"Comment je visualise des consignes ou des informations textuelles complexes sur une diapositive ?","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"Je remplis la diapositive surtout de puces soignées et de texte continu.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"Pour plus de lisibilité, je mets les longs textes ou les données chiffrées dans des tableaux ou graphiques simples.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"Pour montrer l'ordre ou les liens entre concepts, je structure le contenu avec des flèches ou des formes de diagramme.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"Dans un contenu schématisé en formes ou tableaux, je change la taille et la couleur des expressions ou mots à mettre en valeur.","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"Quand un imprévu survient lors d'une collaboration, si ma partie ne pose pas de problème, j'ai tendance à me concentrer sur d'autres tâches pour optimiser mon temps.","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"Comment je réagis quand un apprenant soulève des plaintes hors sujet qui plombent l'ambiance ?","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"Je dis que cela ne correspond pas au thème actuel et poursuis la formation prévue.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"Je reconnais que c'est un avis important mais clos le sujet en proposant d'en parler individuellement à la pause ou après la formation.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"Sans casser le rythme de la formation, j'écoute et je comprends la frustration et le sentiment d'injustice de l'apprenant.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"Je reconnais la cause de la plainte, mais je propose des astuces d'accueil réalistes applicables dans cette situation.","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"Comment je communique avec une personne peu motivée qui reste en retrait ou se trouve isolée ?","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"Je me concentre sur le planning et l'avancement du support plutôt que sur la participation individuelle.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"Pour qu'il ne décroche pas complètement, je le mets en binôme avec un collègue compétent assis à côté pour qu'il suive la pratique naturellement.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"Je circule dans l'espace de pratique, l'aborde simplement en 1:1, lui demande si quelque chose est difficile et donne un feedback léger.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"Je l'oriente vers un rôle ou une réponse simple qu'il peut réussir facilement, je réagis positivement et renforce sa confiance pour participer.","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"Comment je réagis quand un autre service ou un collègue demande un soutien urgent ou déraisonnable difficile à assurer tout de suite ?","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"J'explique fermement que je suis occupé et refuse clairement en indiquant que je ne peux pas aider.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"Pour éviter des relations tendues, j'accepte et traite la demande même si cela surcharge mon planning.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"J'explique calmement mes priorités et contraintes et dis, sans froisser, que c'est difficile pour le moment.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"Même si je ne peux pas accepter tout de suite, je propose une alternative ajustable comme « je peux le faire d'ici demain après-midi, ou vous aider autrement ».","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"Comment je réagis face à quelqu'un qui critique négativement mon avis ?","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"Si la critique ne correspond pas aux faits objectifs ou est déformée, je la réfute fermement.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"J'évite d'être blessé par les émotions négatives et ne retiens que les informations utiles de la critique.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"Plutôt que d'être vexé par le ton sec, je prends la remarque comme une occasion de me remettre en question et je l'accepte.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"Je remercie pour le conseil et en fais une occasion d'apprendre et de progresser.","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"Comment je réagis quand un problème survient dans une partie de la collaboration qui ne relève pas de moi ?","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"Je me concentre sur l'exécution rigoureuse et sans la moindre erreur des tâches de mon périmètre.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"J'identifie la cause pour que le problème ne s'aggrave pas et fais établir des mesures par chacun dans son domaine.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"Même si ce n'est pas mon périmètre, j'essaie de résoudre le problème ensemble pour atteindre l'objectif commun.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Plutôt que de chercher des coupables, j'agis avec un sens des responsabilités en portant jusqu'au bout le résultat de la tâche commune.","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"Quand la participation est faible, je pense qu'il vaut mieux observer sans mettre de pression que d'inciter à participer.","매우 그렇지 않다.":"Pas du tout d'accord","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"Quand je dois expliquer à quelqu'un un travail dont je m'occupais, quel est mon style d'explication ?","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"Je lis calmement les documents de travail du début à la fin pour ne rien oublier.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"Plutôt que de tout lire, j'organise et explique les points essentiels.","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"En plus d'un résumé des points clés, je donne des exemples tirés de mon expérience réelle pour faciliter la compréhension.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"Au-delà de mon expérience, j'explique aussi le contexte concret du travail et des astuces utiles immédiatement applicables.","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"Quel est mon style habituel quand je donne mon avis ou présente un projet devant des collègues ou supérieurs ?","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"Pour tout transmettre calmement, je garde un débit et un ton constants, sans variation émotionnelle.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"J'observe les visages pour voir si l'on me suit et j'ajuste mon débit général.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Tout en adaptant mon débit, j'élève la voix ou le ton aux étapes clés pour bien insister.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"J'adapte débit et intensité, et marque une courte pause juste avant le point clé que je veux souligner.","T-NPS를 확인할 때 어디까지 살펴보는가?":"Jusqu'où je regarde quand je consulte le T-NPS ?","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"Je compare surtout les régions faibles ou les groupes de produits de réparation dont les scores sont particulièrement bas.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"Je rapproche un par un les scores individuels de chaque SE et leurs écarts détaillés.","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"Plutôt que de laisser la personne réfléchir seule, indiquer rapidement l'erreur et la solution est un feedback plus efficace.","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"Quand je mets en forme des informations textuelles complexes dans un PPT, comment je structure généralement ?","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"J'explique calmement mes priorités et contraintes et refuse sur un ton délicat pour ne pas froisser.","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"Quel est mon style habituel quand je dois donner un feedback sur le travail d'un collègue ou d'un junior ?","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"J'indique clairement ce qui doit être corrigé et explique franchement les points à améliorer pour être bien compris.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"Je fais d'abord un petit compliment pour ne pas mettre la personne mal à l'aise, puis j'aborde ce qui doit être corrigé.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"Après un petit compliment, en signalant les erreurs, je fournis des exemples ou références pour bien corriger.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"Plutôt que de dire tout de suite quoi corriger, je pose des questions pour que la personne réfléchisse et prenne conscience de ses erreurs.","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"Comment je réagis quand un gros effort ne donne aucun résultat ni changement ?","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"Je mets mes émotions de côté pour ne pas sombrer dans la frustration et me consacre à la formation et au coaching prévus.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"Sans me laisser affecter par une stagnation ou un échec temporaires, je reste convaincu qu'en poursuivant la formation MOT avec persévérance, le comportement des SE et le T-NPS finiront par progresser.","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"Quand j'explique un travail ou autre chose à un collègue, comment je vérifie qu'il comprend ?","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"Je me concentre sur l'explication de ce que j'ai préparé plutôt que sur ses expressions ou réactions.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"Pendant l'explication, j'observe si la personne hoche la tête.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"Quand la personne écoute en silence, je demande directement : « Y a-t-il quelque chose de pas clair ou que tu veux savoir ? »","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"Même si elle dit avoir compris, je remarque une hésitation ou une expression crispée et je reformule spontanément plus simplement.","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"Que fais-je quand la personne ne comprend pas mon explication ou la trouve difficile ?","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"Je répète lentement ce que j'ai expliqué en insistant.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"Je réexplique en me concentrant sur les parties difficiles ou j'apporte des informations complémentaires.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"J'identifie ce qui lui pose problème et réexplique avec une autre approche ou un autre exemple.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"Je cherche où et pourquoi elle n'a pas compris et j'adapte mon explication à son niveau.","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"Quand les scores T-NPS sont bas, comment je classe les causes ?","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"En classant les causes, je lis aussi les avis clients pour voir si la réclamation est un problème individuel ou liée à d'autres facteurs.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"En tenant compte des contraintes environnementales que le SE ne maîtrise pas, je sépare et n'examine que ce qui relève purement de l'accueil individuel.","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"Comment je vérifie si une formation ou un coaching mené par la filiale a réellement contribué à améliorer des indicateurs comme le T-NPS ?","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"Je compare les écarts mensuels de T-NPS entre les centres formés intensivement et les autres.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"Pour les SE formés, je vérifie directement si leur T-NPS un mois après la formation est supérieur à celui d'avant.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"Je suis le T-NPS des apprenants sur le long terme, même 2 à 3 mois après.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"En raison des conditions de ma filiale, je ne fais pas de suivi du T-NPS ni de feedback post-formation (F/UP).","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"Qu'est-ce que j'utilise principalement pour améliorer la lisibilité et l'impact visuel des diapositives ?","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"Je limite les éléments graphiques et rédige de façon simple, centrée sur le texte, sur fond blanc.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"J'utilise des modèles PPT de base de l'entreprise ou d'internet et dispose le texte proprement.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"Je place judicieusement des icônes, illustrations ou photos métier liées aux mots-clés que je veux expliquer.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"Tout en plaçant judicieusement icônes ou photos, j'utilise bien des éléments visuels comme des cadres épais ou des surlignages.","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"Quand je crée des supports ou documents sous PPT, qu'est-ce qui se rapproche le plus de ma façon habituelle de travailler ?","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"J'ajuste une à une la taille et l'espacement des formes à la souris et avance pas à pas avec les fonctions de base, ce qui prend un peu de temps.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"Je gagne du temps avec des raccourcis de base connus de tous, comme copier (Ctrl+C) et coller (Ctrl+V).","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"J'utilise avec aisance Reproduire la mise en forme, la barre d'outils Accès rapide (QAT) et les raccourcis d'alignement/répartition pour gagner beaucoup de temps.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"Pour les mises en page récurrentes, je crée mes propres masques ou modèles afin de travailler vite tout en gardant un document cohérent.","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"Quand j'explique à un collègue, transmettre tel quel le guide officiel est la façon la plus sûre et la plus efficace d'expliquer.","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"Comment je réagis quand un collègue aborde un sujet sans rapport avec la conversation ?","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"Je réagis peu à la remarque inattendue et ramène discrètement la conversation au sujet précédent.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"Je signale que le fil a été rompu pour qu'il s'en rende compte, puis je reviens rapidement au sujet initial.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"Je réponds par quelques mots pour éviter le malaise, puis je reviens naturellement au sujet initial.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"Je trouve un lien entre son propos et le sujet initial pour y revenir sans couper le fil de la conversation.","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"Comment je réagis quand, dans un projet ou une collaboration, un membre ne participe pas activement et reste en retrait ?","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"Je me concentre sur mon propre rôle plutôt que sur la participation des autres.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"Plutôt que d'intervenir moi-même, j'informe discrètement le chef d'équipe ou le responsable pour qu'il règle la situation.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"Je l'aborde simplement en tant que collègue et lui demande discrètement s'il rencontre des difficultés.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"Je partage simplement le document en cours et lui demande naturellement son avis : « Tu pourrais jeter un œil à cette partie ? »","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"Pour concevoir un PPT, il est plus efficace de transmettre clairement le texte seul, sans fioritures, que d'ajouter des éléments visuels.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"Plutôt que d'être vexé par le ton sec, je prends la remarque comme une occasion de me remettre en question et l'accepte volontiers.","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"Comment je réagis quand un problème inattendu survient pendant une collaboration ?","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Plutôt que de chercher des coupables, j'agis avec un sens des responsabilités en portant jusqu'au bout le résultat de la tâche.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"En raison des conditions de ma filiale, je ne fais pas de suivi du T-NPS ni de feedback des apprenants après la formation.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"Je réexplique en me concentrant sur les parties difficiles.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"Je change d'humeur par une conversation légère ou de l'humour, ou je me confie franchement à des collègues pour évacuer le stress.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"Je retrouve vite mon calme grâce à mes propres moyens de décompresser ou à des loisirs, et je fais de cette épreuve une occasion d'apprendre.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"Même si elle dit avoir compris, je remarque une hésitation ou une expression crispée et je reformule spontanément plus simplement."},"ja":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"スライドの主な講義内容を受講者に説明するときの私の方法は？","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"重要な部分が漏れないよう、スライドのテキストを丁寧に読み上げる。","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"スライドの文章を要点中心にまとめて説明する。","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"わかりやすいよう、現場の状況に合った具体的な比喩や事例を挙げて説明する。","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"比喩や事例を挙げながら、必要に応じて実際の現場の応対行動やセリフを軽く再現して見せる。","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"講義中の私の視線と体の動きは？","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"教材の内容を見落とさないよう、主にスクリーンやモニター画面を見る。","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"受講者と目が合うのが少し気まずく、主に教室の後方などを見ながら決まった位置にいる。","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"受講者と均等に目を合わせつつ、主に反応や相づちが良い人を中心に視線を向ける。","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"体の動きを適度に調整し、取り残される受講者がいないよう視線を均等に配る。","T-NPS를 확인할 때 나의 방식은?":"T-NPSを確認するときの私の方法は？","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"法人全体の平均点と増減の推移を中心に把握する。","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"法人内のセンター別平均点を比較し、低いセンターを中心に確認する。","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"点数が低い地域や特定の修理製品群のT-NPSを分析し、主な弱点と強みを把握する。","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"センター別の弱点要因と所属SEの個別点数・ばらつきを詳細に比較・分析し、具体的な強みと改善が必要な領域を導き出す。","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"法人の状況により、T-NPSを確認する業務は行っていない。","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"データをもとに法人の具体的な改善要因を導き出す私の方法は？","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"法人全体のT-NPS点数の増減推移と全体的な動向そのものを法人の主要な改善方向とする。","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"提供される項目別の数値を確認し、最も点数が低い主要な不満カテゴリーを改善要因として選ぶ。","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"SEの点数と顧客が残した不満コメントを丁寧に読み、実質的な改善要因を導き出す。","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"T-NPS、顧客コメント、SEの過去の指標を組み合わせ、不満が繰り返し起こる理由を確認する。","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"法人の状況により、データを分析して改善要因を導き出す業務は行っていない。","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"HQの教育コンテンツを法人で活用する方法は？","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"HQが提供する英語コンテンツをそのまま活用する。","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"HQコンテンツの構成と内容を維持し、テキストを現地語に変えてすぐに講義に適用する。","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"法人の状況や事例に合わせて、個々のスライドの内容と表現を修正する。","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"HQのコンテンツをもとに、法人の状況と受講者の特性に合ったコンテンツを独自に開発する。","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"PPTを作成するとき、スライド全体の順序と流れを構成する方法は？","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"伝えたい内容を思い浮かんだ順にスライドに書き込む。","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"大まかなテーマごとに領域を分け、そのテーマに合わせてスライドを配置する。","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"問題提起→原因分析→解決方向のように、スライド間に論理的な因果の流れができるようにつなげる。","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"結論を先に示す構成をもとに、PPTの主要メッセージが一つの流れでつながるように構成する。","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"私が伝える教育内容や方向性について、苦情や否定的な意見を言う受講者に会ったときの対応は？","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"一貫した基準の遵守と成果のため、教育内容を必ず守るべきことを原則として落ち着いて諭す。","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"受講者が直面する現実的な困難に軽く共感した後、すぐに実行できる簡単な妥協案を素早く提示する。","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"受講者のもどかしさや抵抗感を最後まで傾聴・共感した後、それを解消できる具体的な実務上の代案を一緒に探して提示する。","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"自分の実体験を共有して共感し、この教育がなぜ必要かを受講者の目線に合わせて説得する。","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"会議中に質問しても同僚が何も意見を言わず沈黙しているときの対応は？","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"沈黙が長引く場合、無駄な時間を減らすため素早く次の議題に移る。","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"沈黙を破るため、特定の同僚を直接指名して回答を求める。","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"答えにくい自由回答の質問ではなく、いくつかの選択肢を示して選ばせるなどして考えを促す。","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"各自1〜2分間考えを整理する時間を自然に設け、気楽に話し合えるよう導く。","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"多くの努力を注いだことで成果が出ない、または何の変化もないときの私の反応は？","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"無力感と疲労感を感じ、状況を変える意欲を失ってしまう。","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"挫折感に深く沈まないよう感情を調整し、原因分析よりも決められた教育とコーチングを忠実に行うことに集中する。","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"自分が見落としている点がないか振り返り、データと現場の状況を丁寧に確認して克服する方法を探す。","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"状況に揺らがず、データに基づいて変化の可能性と改善の根拠を見つけ、MOT教育とコーチングを継続していく。","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"強いストレスや対立の状況での私の対処法は？","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"感情が爆発しないよう必死に抑えようとするが、表情にそれとなく出てしまう。","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"ストレス要因にこれ以上気を取られないよう感情を遮断し、今集中すべきことに没頭する。","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"軽い会話やユーモアで気分を切り替えたり、同僚に率直に打ち明けたりしてストレスを解消する。","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"自分なりの確実な解消法や余暇活動で感情を素早く整え、この試練を学びの機会にする。","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"講義をするとき、現場の事例や比喩を加えるよりも、教材に書かれた内容をそのまま伝えることが最も信頼感を与えると思う。","매우 그렇다":"とてもそう思う","그렇다":"そう思う","그렇지 않다":"そう思わない","전혀 그렇지 않다":"まったくそう思わない","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"講義中の私の全体的な話す速さと口調は？","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"情報伝達の信頼感を与えるため、一定のトーンで説明する。","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"SEが内容を理解できるよう、全体的な話す速さを調整しながら説明する。","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"話す速さを調整しながら、重要な場面では声の大きさやトーンを上げてしっかり強調する。","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"状況に応じて話す速さと強弱を調整し、要点では少し間を置く。","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"RPや1:1同行コーチング後の私のフィードバック方法は？","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"SEが萎縮したりストレスを感じたりしないよう、称賛と励まし中心に気楽に話す。","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"MOTマニュアルの基準から外れた部分を見つけたら、すぐに介入して修正する。","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"良かった点と改善が必要なすべての要素を体系的に分けて、すべて伝える。","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"総合フィードバックで最も優れた強みを伝え、現場で優先的に改善すべき行動を1つ選んで明確に伝える。","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"教育では、討論を通じて互いの意見を共有させるよりも、素早い習得のためにマニュアルを繰り返し読み上げさせる方が重要だ。","매우 그렇지 않다":"まったくそう思わない","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"T-NPSの点数が低いとき、原因を分析する私の方法は？","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"基本的に点数が低いのは、SE個人の親切さやサービスマインドの不足が最大の原因だと捉える。","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"現場で決められたマニュアルを抜かして実行しなかった割合を照らし合わせ、問題の原因を把握する。","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"顧客の意見も確認しながら、不満の原因を個人の応対、製品の問題、サービス環境などに分類する。","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"SEがコントロールしにくい環境要因を除き、個人の応対で改善できる要因を具体的に導き出す。","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"法人の状況により、不満の原因を分類する業務は行っていない。","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"教育やコーチングが実際にT-NPSなどの指標改善に貢献したかを確認する方法は？","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"教育後、法人全体のT-NPS点数が前月比で上がったかを確認する。","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"教育前後の法人全体のT-NPSの増減幅を比較し、改善レベルを把握する。","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"教育を修了したSEの教育前後1か月のT-NPS点数を比較する。","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"受講者のT-NPS点数を2〜3か月追跡し、改善効果が持続しているかを確認する。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"法人の状況により、教育後の受講者のT-NPS点数のフォローアップは別途行っていない。","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"受講者の理解と参加を助けるための私のスライド構成方法は？","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"受講者全員で声に出して読み上げることを中心に教材を構成する。","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"要点をよく覚えているか確認するため、穴埋めやクイズを途中に入れる。","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"受講者が誤った行動やセリフを自ら修正し、講師のフィードバックで正解を確認する参加型スライドを構成する。","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"討論を通じて解決策を導き出し、講師のフィードバックで正しい方向をまとめるスライドを構成する。","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"スライド内のガイドラインや複雑なテキスト情報を視覚化する方法は？","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"スライドに整った箇条書きと文章中心で書き込む。","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"読みやすくするため、長い文章や数値データを基本的な表やグラフに入れる。","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"概念間の順序や関係を示すため、矢印や図形を活用して内容を構造化する。","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"図形や表で図式化した内容のうち、強調すべき特定の語句や単語は大きさや色を変える。","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"協業中に突発的な状況が起きたとき、自分の役割に問題がなければ他の業務に集中して時間を効率的に使う方だ。","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"受講者がテーマと関係のない不満を持ち出して雰囲気を乱すときの対応は？","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"現在の教育テーマに合わないことを伝え、準備した教育を進める。","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"重要な意見であることは認めつつ、休憩時間や教育終了後に個別に話すことにしてその場を収める。","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"講義の流れを妨げない範囲で、受講者が感じたもどかしさや悔しさを聞いて共感する。","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"不満の原因は認めつつ、その状況の中で適用できる現実的な応対のコツを提示する。","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"参加意欲が低く、それとなく浮いていたり取り残されたりしている人に会ったときのコミュニケーション方法は？","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"個々の参加度よりも、決められた教育日程と準備した教材の進行に集中する。","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"学習から完全に取り残されないよう、隣の優秀な同僚とペアにして自然に実習についていけるよう助ける。","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"実習スペースを回りながら気軽に1:1で近づき、理解しにくい点がないか尋ねて軽くフィードバックする。","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"受講者の目線に合わせて簡単に成功できる役割や回答を促し、それに前向きに応えて参加への自信を高める。","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"関連部署や同僚から、すぐには対応しにくい急ぎの、または無理な業務支援を頼まれたときの対応は？","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"今自分の業務が忙しいことをはっきり説明し、支援できないことを明確に伝えて断る。","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"関係がぎくしゃくするのを避けるため、自分の業務日程に無理が生じても、まず依頼を受け入れて対応する。","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"自分の優先順位と制約を落ち着いて説明し、気分を害さないよう今すぐは難しいと伝える。","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"すぐには受け入れられなくても、「代わりに明日の午後までに対応するか、別の方法で手伝います」と調整可能な代案を示す。","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"自分の意見に否定的なフィードバックをする人に向き合ったときの対応は？","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"相手の批判が客観的な事実に合わなかったり歪んでいたりすれば、はっきりと反論する。","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"否定的な感情に深く流されて傷つかないようにし、批判の中から自分に役立つ情報だけを選んで受け入れる。","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"相手のきつい口調に傷つくよりも、その指摘を自分を振り返るきっかけとして受け入れる。","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"相手の助言に感謝を伝え、自分をさらに一段成長させる学びと改善の機会にする。","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"協業中、自分の担当ではない部分で問題が起きたときの対応は？","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"自分が明確に担当する領域の仕事を、一切ミスなく誠実に処理することに集中する。","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"問題が大きくならないよう原因を把握し、各自の領域で対策を立てるようにする。","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"自分の業務領域でなくても、共通の目標達成のために一緒に問題を解決しようと努める。","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"過程の是非を問うよりも、共同課題の達成結果を自分が最後まで責任を持つというオーナーシップを持って取り組む。","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"受講者の参加が低いときは、参加を促すよりも負担をかけずに見守る方が良いと思う。","매우 그렇지 않다.":"まったくそう思わない","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"自分がこれまで担当していた業務を誰かに説明しなければならないとき、私の説明スタイルは？","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"漏れがないよう、関連業務の文書を最初から最後まで落ち着いて読み上げながら説明する。","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"文書を最初から最後まで読むよりも、核心となる主要事項を中心に整理して説明する。","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"相手が理解しやすいよう、要点のまとめと一緒に実際の業務経験を例に挙げて説明する。","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"実体験を話すだけでなく、業務の具体的な背景や実務ですぐ使える役立つコツも一緒に説明する。","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"同僚や上司の前で意見を述べたり企画案を報告したりするときの普段の話し方は？","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"内容をすべて落ち着いて伝えるため、感情の変化なく一定の速さとトーンを保って説明する。","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"聞き手が話についてきているか表情を見ながら、全体的な話す速さを調整する。","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"話す速さを調整しながら、重要な場面では声の大きさやトーンを上げてしっかり強調する。","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"話す速さと強弱を調整し、強調したい要点の直前で少し間を置く。","T-NPS를 확인할 때 어디까지 살펴보는가?":"T-NPSを確認するとき、どこまで見るか？","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"特に点数が低い弱点地域や特定の修理製品群を中心に比較する。","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"各SEの個別点数と詳細な個人別のばらつきまで一つひとつ照らし合わせて比較する。","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"自分で考えさせるよりも、誤った部分と解決策を素早く伝える方が効率的なフィードバック方法だ。","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"複雑なテキスト情報をPPTにまとめるとき、私が主に行う構成方法は？","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"自分の優先順位と制約を落ち着いて説明し、気分を害さないよう婉曲な口調で断りの意思を伝える。","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"同僚・後輩の業務成果物にフィードバックをするとき、私の普段のスタイルは？","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"修正が必要な部分を明確に指摘し、改善すべき点が伝わるよう率直に説明する。","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"相手が気まずくならないよう、まず軽く褒めてから直すべき点を話す。","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"軽く褒めた後に誤りを伝えるとき、正しく修正できるよう例や参考情報を提供する。","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"すぐに直す点を伝えるよりも、相手が自ら誤りを考えて気づけるよう質問を投げかける。","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"多くの努力を注いだことで成果が出ない、または何の変化もないときの私の反応は？","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"挫折感に深く沈まないよう感情を切り離し、決められた教育とコーチングに専念する。","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"一時的な停滞や失敗に心を痛めず、MOT教育を粘り強く続ければSEの行動とT-NPSは必ず上がるという確信を持ち続ける。","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"同僚に業務などを説明するとき、相手が理解しているかを確認する方法は？","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"相手の表情や反応を見るよりも、自分が準備したことを説明することに集中する。","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"説明しながら、相手がうなずいているかなどに注目する。","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"相手が黙って聞いているとき、「わかりにくいところや他に気になることはありますか？」と直接尋ねる。","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"相手が口では理解したと言っても、ためらいやこわばった表情に気づき、先にもっとわかりやすく言い換えて説明する。","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"相手が私の説明を理解できなかったり難しがったりするときの私の方法は？","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"先に説明した内容をもう一度ゆっくり話して強調する。","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"相手が理解しにくい部分を中心に再度説明したり、追加情報を提供したりする。","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"相手が難しいと感じる部分を把握し、説明の仕方や例を変えて再度説明する。","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"相手がどこで、なぜ理解できなかったのか原因を把握し、相手の目線に合わせて説明方法を修正する。","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"T-NPSの点数が低いとき、原因を分類する私の方法は？","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"原因を分類するとき顧客の意見も読み、不満が個人の問題か、他の要因が絡んでいるかを分類する。","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"SE個人がコントロールできない環境的な制約要因を考慮し、純粋に個人の応対に関するものだけを分けて確認する。","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"法人で行った教育やコーチングが実際にT-NPSなどの指標改善に貢献したかを確認する方法は？","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"教育を集中的に行ったセンターとそうでないセンターの月別T-NPS点数の差を比較する。","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"教育を修了したSEについて、教育1か月後のT-NPS点数が教育前より上がったかを直接比較する。","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"受講者のT-NPS点数を2〜3か月後も長期的に追跡する。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"法人の状況により、教育後の受講者のT-NPS点数の追跡や事後フィードバック（F/UP）は別途行っていない。","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"スライドの読みやすさと視覚的な説得力を高めるため、私が主に使う方法は？","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"デザイン要素を最小限にし、白い背景にテキスト中心のシンプルな形で作成する。","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"会社やインターネットで提供される基本的なPPTレイアウトを使い、テキストを整然と配置する。","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"説明したいキーワードに関連するアイコン、イラスト、または業務関連の写真を適切に配置する。","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"アイコンや写真を適切に配置しつつ、太枠やハイライトなどの視覚要素もうまく活用する。","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"PPTで教材や文書を作るとき、普段の作成方法に最も近いものは？","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"図形の大きさや間隔を一つずつマウスで合わせ、基本機能中心にこつこつ作業するため、やや時間がかかる方だ。","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"コピー（Ctrl+C）、貼り付け（Ctrl+V）など誰もが知る基本的なショートカットを使って作業時間を短縮する。","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"書式のコピー、クイックアクセスツールバー（QAT）、図形の配置・整列ショートカットなどを使いこなし、作業時間を大幅に短縮する。","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"繰り返し使うスライドレイアウトはマスターやテンプレートを自作し、文書全体の統一感を保ちながら素早く作業する。","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"同僚に説明するとき、公式ガイド文書をそのまま伝えるのが最も安全で効果的な説明方法だ。","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"会話中、同僚が話の流れと関係のない話をしたときの対応は？","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"唐突な話にあまり反応せず、元の話題に静かに戻す。","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"話の流れが途切れたことを相手がわかるよう指摘した後、元の話題に素早く戻す。","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"相手が急に持ち出した話に気まずくならないよう少し相づちを打ち、自然に元の話に戻る。","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"相手の話の中から元のテーマにつながる接点を見つけ、会話の流れが途切れないよう元の話につなげる。","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"チームプロジェクトや協業中、積極的に参加せずそれとなく浮いているメンバーがいるときの対応は？","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"他のメンバーの参加状況を気にするよりも、自分に与えられた役割に集中する。","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"自分が直接介入するよりも、チーム長やリーダーに静かに状況を共有して解決を任せる。","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"同僚として気軽に近づき、業務で困っていることや悩みがないかそっと尋ねる。","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"進行中の資料や文書を軽く共有し、「この部分だけ一度目を通してもらえますか？」と自然に相手の意見を聞く。","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"PPTをデザインするときは、視覚的要素を入れるよりも、無駄なくテキストそのものを明確に伝える方が効果的だ。","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"相手のきつい口調に傷つくよりも、その指摘を自分を振り返るきっかけとし、快く受け入れる。","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"協業中に予期せぬ問題が起きたときの対応は？","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"過程の是非を問うよりも、課題達成の結果を自分が最後まで責任を持つというオーナーシップを持って取り組む。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"法人の状況により、教育後の受講者のT-NPS点数の追跡やフィードバックは別途行っていない。","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"相手が理解しにくい部分を中心に再度説明する。","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"軽い会話やユーモアで気分を切り替えたり、同僚に率直に打ち明けたりしてストレスを解消する。","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"自分なりの確実な解消法や余暇活動で感情を素早く整え、この試練を学びの機会にする。","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"相手が口では理解したと言っても、ためらいやこわばった表情に気づき、先にもっとわかりやすく言い換えて説明する。"},"zh":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"向学员讲解幻灯片主要内容时，我的方式是？","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"为避免遗漏重要内容，我会逐字阅读幻灯片上的文字。","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"我会围绕重点概括幻灯片内容进行讲解。","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"为便于理解，我会举出符合现场情况的具体比喻或案例进行讲解。","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"在用比喻或案例讲解的同时，必要时会简单再现现场的接待动作或话术。","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"授课过程中，我的视线和肢体动作是？","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"为了不遗漏教案内容，我主要看屏幕或显示器。","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"与学员对视让我有些不自在，所以我主要看教室后方，并站在固定位置。","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"我会与学员均匀进行眼神交流，但主要关注反应和互动较好的学员。","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"我会适度调整肢体动作，并均匀分配视线，不让任何学员被冷落。","T-NPS를 확인할 때 나의 방식은?":"查看T-NPS时，我的方式是？","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"主要了解法人整体的平均分及其增减趋势。","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"比较法人内各中心的平均分，重点查看得分较低的中心。","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"分析得分较低的地区或特定维修产品类别的T-NPS，找出主要弱点和优势。","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"详细比较分析各中心的薄弱因素及所属SE的个人得分和偏差，得出具体的优势和需改进的领域。","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"由于法人的条件和情况，我不负责查看T-NPS。","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"基于数据找出法人具体改进因素时，我的方式是？","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"将法人整体T-NPS得分的增减趋势和总体动向本身作为法人的主要改进方向。","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"查看各项目的数据，选出得分最低的核心不满类别作为改进因素。","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"仔细阅读SE的得分和客户留下的不满评论，找出切实的改进因素。","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"将T-NPS、客户评论与SE的历史指标结合起来，找出不满反复发生的原因。","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"由于法人的条件和情况，我不负责通过数据分析找出法人的改进因素。","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"在法人中使用HQ培训内容的方式是？","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"直接使用HQ提供的英文内容。","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"保持HQ内容的结构和内容，将文字翻译成当地语言后迅速用于授课。","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"根据法人的情况和案例，修改个别幻灯片的内容和表达。","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"以HQ内容为基础，自主开发符合法人情况和学员特点的内容。","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"制作PPT时，组织整体幻灯片顺序和流程的方式是？","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"按照脑海中想到的顺序把内容写到幻灯片上。","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"按大致主题划分板块，并据此安排幻灯片。","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"按照“提出问题→分析原因→解决方向”的方式，使幻灯片之间形成逻辑上的因果关系。","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"以结论先行的结构为基础，让PPT的核心信息贯穿成一条主线。","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"当学员对我传达的培训内容或方向表达难处和负面意见时，我的应对方式是？","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"为了遵守统一标准、确保成果，我会按原则平静地说明必须遵守培训内容。","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"简单共情学员面临的现实困难后，迅速提出可立即执行的简单折中方案。","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"耐心倾听并理解学员的郁闷和抵触情绪后，一起找出并提出能够解决问题的具体实务方案。","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"分享自己的真实经历来表达共情，并站在学员的角度说服他们这项培训为何必要。","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"会议中提问后同事们都沉默不语时，我的应对方式是？","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"如果沉默持续，为避免浪费时间，我会迅速进入下一个议题。","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"为打破沉默，我会直接点名某位同事回答。","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"不提难以回答的开放式问题，而是给出几个选项供大家选择，引导思考。","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"自然地给每个人1～2分钟整理思路，引导大家轻松地交流。","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"在投入大量努力的事情上没有成果或毫无变化时，我的反应是？","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"感到无力和疲惫，失去改变现状的动力。","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"调节情绪以免陷入挫败感，比起另行分析原因，更专注于认真完成既定的培训和辅导。","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"回顾自己是否有遗漏之处，仔细查看数据和现场情况，寻找克服的方法。","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"不为情况所动摇，基于数据寻找变化的可能性和改进依据，持续开展MOT培训和辅导。","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"面对强烈压力或冲突时，我的应对方式是？","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"努力压住情绪不让它爆发，但脸上还是会隐约表现出来。","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"切断情绪，不再在意压力源，专注于眼下需要做的事情。","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"通过轻松的聊天或幽默转换心情，或与同事坦诚倾诉来缓解压力。","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"用自己行之有效的减压方法或休闲活动迅速平复情绪，并把这次考验当作学习的机会。","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"授课时，比起补充现场案例或比喻，照着教案内容原样讲解最能让人信赖。","매우 그렇다":"非常同意","그렇다":"同意","그렇지 않다":"不同意","전혀 그렇지 않다":"完全不同意","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"授课时，我整体的语速和语气是？","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"为了让信息传达更可信，我会用平稳的语调讲解。","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"为了让SE理解内容，我会调整整体语速进行讲解。","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"在调整语速的同时，在重要环节会提高音量或语调加以强调。","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"根据情况调整语速和轻重，在关键点会稍作停顿。","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"RP或1:1随行辅导后，我的反馈方式是？","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"为了不让SE感到畏缩或有压力，我会以表扬和情感鼓励为主轻松交流。","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"一旦发现与MOT手册标准不符的地方，立即介入纠正。","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"把做得好的地方和需要改进的所有要素系统地分开，全部告诉对方。","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"通过综合反馈说出最突出的优势，并选定一项在工作中应优先改进的行为，明确传达。","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"培训时，比起通过讨论让大家分享想法，为了快速掌握而让学员反复跟读手册更重要。","매우 그렇지 않다":"完全不同意","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"T-NPS得分较低时，我分析原因的方式是？","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"基本上认为得分低的最大原因是SE个人的亲切度或服务意识不足。","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"对比现场遗漏、未执行既定手册的比例来找出问题原因。","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"同时查看客户意见，将不满原因分为个人接待、产品问题、服务环境等。","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"排除SE难以控制的环境因素，具体找出个人接待中可以改进的因素。","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"由于法人的条件和情况，我不负责对不满原因进行分类。","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"确认培训或辅导是否真正有助于提升T-NPS等指标的方式是？","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"确认培训后法人整体T-NPS得分是否比上月有所提升。","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"比较培训前后法人整体T-NPS的增减幅度，了解改进程度。","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"比较完成培训的SE在培训前后1个月的T-NPS得分。","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"追踪学员2～3个月的T-NPS得分，确认改进效果是否持续。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"由于法人的条件和情况，培训后不另行跟进学员的T-NPS得分。","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"为帮助学员理解和参与，我的幻灯片设计方式是？","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"以学员一起大声跟读为主来设计教案。","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"为确认学员是否记住了要点，在中途插入填空或小测验。","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"设计参与式幻灯片，让学员亲自纠正错误的行为或话术，并通过讲师反馈确认正确答案。","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"设计通过讨论得出解决方案、再由讲师反馈总结正确方向的幻灯片。","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"将幻灯片中的指南或复杂文字信息可视化的方式是？","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"在幻灯片上以整齐的项目符号和段落文字为主进行填充。","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"为提高可读性，将长段文字或数字数据放进基本的表格或图表中。","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"为展示概念之间的顺序或关系，使用箭头或图示形状来结构化内容。","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"在用图形或表格图示化的内容中，对需要强调的特定语句或词语使用不同的大小和颜色。","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"协作中发生突发情况时，如果我负责的部分没有问题，我倾向于专注其他工作，有效利用时间。","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"学员提出与主题无关的不满、影响课堂气氛时，我的应对方式是？","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"说明这与当前培训主题不符，继续进行准备好的培训。","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"承认这是重要的意见，但约定在休息时间或培训结束后单独沟通，先把事情告一段落。","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"在不影响授课节奏的前提下，倾听并理解学员所经历的郁闷和委屈。","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"承认不满的原因，同时提出在这种情况下可以运用的现实应对技巧。","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"遇到缺乏参与意愿、悄悄游离或被冷落的人时，我的沟通方式是？","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"比起个人的参与度，更专注于按既定培训日程和准备好的教案进度推进。","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"为了不让学员完全掉队，安排他与旁边优秀的同事结对，让其自然地跟上实操。","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"在实操区域巡视时轻松地一对一接近，询问是否有难以理解的地方，并给予简单反馈。","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"根据学员的水平引导其完成容易成功的简单角色或回答，并积极回应，提升其参与的信心。","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"相关部门或同事提出紧急或难以立即处理的不合理工作支援请求时，我的应对方式是？","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"坚决说明自己目前工作繁忙，明确表示无法支援并拒绝。","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"为了避免关系变得尴尬，即使会打乱自己的工作安排，也先接受请求并处理。","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"平静地说明自己的优先事项和限制条件，委婉地表示现在暂时难以处理。","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"即使无法立即接受，也会提出可调整的替代方案，如“我可以明天下午前处理，或用其他方式帮忙”。","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"面对对我的意见给出负面反馈的人时，我的应对方式是？","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"如果对方的批评不符合客观事实或有歪曲之处，我会坚决反驳。","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"避免被负面情绪深深卷入而受伤，只从对方的批评中筛选对我有用的信息加以接受。","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"比起因对方尖锐的语气而难过，我会把这些指正当作反省自己的契机并接受。","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"感谢对方的建议，并把它当作让自己更上一层楼的学习和改进机会。","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"协作中，不是我负责的部分出现问题时，我的应对方式是？","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"专注于认真、零失误地完成我明确负责的领域的工作。","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"找出原因以免问题扩大，并让各自在自己的领域制定对策。","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"即使不是我的工作范围，也会为实现共同目标而努力一起解决问题。","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"比起追究过程中的对错，我会以对共同任务的结果负责到底的主人翁意识去面对。","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"学员参与度低时，我认为比起引导参与，不施加压力、在旁观察更好。","매우 그렇지 않다.":"完全不同意","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"需要向别人说明我原来负责的工作时，我的说明风格是？","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"为了不遗漏内容，从头到尾平静地读相关工作文件并进行说明。","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"比起从头到尾读文件，更会整理出核心要点进行说明。","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"为便于对方理解，在核心总结之外，以实际工作经历为例进行说明。","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"不仅分享经历，还会说明工作的具体背景以及在实际中可以马上使用的实用技巧。","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"在同事或上级面前表达意见或汇报方案时，我平时的说话风格是？","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"为了平静地传达所有内容，不带情绪变化，保持一定的语速和语调进行说明。","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"观察听众的表情看他们是否跟得上，调整整体语速。","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"在调整语速的同时，在重要环节会提高音量或语调加以强调。","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"调整语速和轻重，在想要强调的要点之前稍作停顿。","T-NPS를 확인할 때 어디까지 살펴보는가?":"查看T-NPS时，会看到什么程度？","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"主要对比得分特别低的薄弱地区或特定维修产品类别。","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"逐一对照比较每位SE的个人得分和详细的个人偏差。","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"比起让对方自己思考，迅速指出错误和解决办法是更高效的反馈方式。","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"将复杂的文字信息整理成PPT时，我主要的组织方式是？","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"平静地说明自己的优先事项和限制条件，用委婉的语气表达拒绝，避免让对方不快。","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"需要对同事或后辈的工作成果给出反馈时，我平时的风格是？","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"明确指出需要修改的地方，直截了当地说明需要改进的点，让对方能听懂。","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"为了不让对方难堪，先给予轻松的表扬，再说需要改正的地方。","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"轻松表扬后指出问题时，提供示例或参考资料，帮助对方正确修改。","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"比起直接告诉对方要改什么，会提出问题让对方自己思考并意识到错误。","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"在投入大量努力的事情上没有成果或毫无变化时，我的反应是？","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"将情绪分离开来以免陷入挫败感，专注于既定的培训和辅导。","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"不因暂时的停滞和失败而受伤，坚信只要坚持开展MOT培训，SE的行为和T-NPS终将提升。","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"向同事说明工作或其他事项时，确认对方是否理解的方式是？","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"比起观察对方的表情或反应，更专注于讲解自己准备的内容。","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"边讲解边留意对方是否点头等。","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"对方静静听着时，直接询问：“有没有不明白或者还想了解的地方？”","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"即使对方嘴上说理解了，也能察觉到其犹豫或僵硬的细微表情，主动换一种更简单的方式说明。","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"对方不理解我的说明或觉得困难时，我的方式是？","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"把之前讲过的内容再慢慢讲一遍并加以强调。","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"围绕对方难以理解的部分再次说明，或提供补充信息。","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"了解对方觉得困难的部分，换一种说明方式或例子再次讲解。","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"找出对方在哪里、为什么没有理解，并根据对方的水平调整说明方式。","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"T-NPS得分较低时，我对原因进行分类的方式是？","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"分类原因时也会阅读客户意见，区分不满是个人问题还是与其他因素有关。","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"考虑到SE个人无法控制的环境限制因素，只把纯粹与个人接待相关的部分单独分离出来查看。","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"确认法人开展的培训或辅导是否真正有助于提升T-NPS等指标的方式是？","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"比较集中开展培训的中心与未开展培训的中心之间每月T-NPS得分的差异。","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"针对完成培训的SE，直接比较其培训1个月后的T-NPS得分是否高于培训前。","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"在2～3个月后仍长期追踪学员的T-NPS得分。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"由于法人的条件和情况，培训后不另行追踪学员的T-NPS得分或进行事后反馈（F/UP）。","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"为提高幻灯片的可读性和视觉说服力，我主要使用的方法是？","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"尽量减少设计元素，在白色背景上以文字为主做成简单的形式。","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"使用公司或网上提供的基本PPT版式模板，整齐地排列文字。","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"恰当放置与要说明的关键词相关的图标、插图或工作相关照片。","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"在恰当放置图标或照片的同时，也善用粗框、高亮等视觉元素。","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"用PPT制作教案和文件时，最接近我平时制作方式的是？","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"用鼠标逐一调整图形的大小和间距，以基本功能为主一步步操作，所以通常比较耗时。","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"使用复制（Ctrl+C）、粘贴（Ctrl+V）等人人都会的基础快捷键来缩短工作时间。","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"熟练使用格式刷、快速访问工具栏（QAT）、图形对齐/分布快捷键等，大幅缩短工作时间。","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"对于反复使用的幻灯片版式，亲自制作母版或模板，在保持整个文件统一性的同时快速完成工作。","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"向同事说明时，原样转交官方指南文件是最稳妥、最有效的说明方式。","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"谈话中同事说了与话题无关的内容时，我的应对方式是？","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"对突如其来的话题不做太多回应，悄悄把话题转回之前的主题。","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"指出谈话的思路被打断，让对方意识到，然后迅速把话题拉回原来的内容。","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"对对方突然提起的话题附和几句以免尴尬，然后自然地回到原来的话题。","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"从对方提起的话题中找到与原主题的连接点，让谈话不中断地回到原来的内容。","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"团队项目或协作中，有成员不积极参与、悄悄游离时，我的应对方式是？","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"比起在意其他成员是否参与，更专注于自己被分配的角色。","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"比起亲自介入，会悄悄把情况告知组长或负责人，交由他们解决。","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"以同事身份轻松地接近对方，悄悄询问工作上是否有困难或烦恼。","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"轻松地分享正在进行的资料或文件，并自然地征求对方意见：“能帮忙看一下这部分吗？”","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"设计PPT时，比起加入视觉元素，简洁明了地只传达文字本身更有效。","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"比起因对方尖锐的语气而难过，我会把这些指正当作反省自己的契机，并乐于接受。","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"协作中发生意外问题时，我的应对方式是？","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"比起追究过程中的对错，我会以对任务结果负责到底的主人翁意识去面对。","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"由于法人的条件和情况，培训后不另行追踪学员的T-NPS得分或提供反馈。","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"围绕对方难以理解的部分再次说明。","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"通过轻松的聊天或幽默转换心情，或与同事坦诚倾诉来缓解压力。","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"用自己行之有效的减压方法或休闲活动迅速平复情绪，并把这次考验当作学习的机会。","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"即使对方嘴上说理解了，也能察觉到其犹豫或僵硬的细微表情，主动换一种更简单的方式说明。"}};
const tx=s=>{if(!s||L==='ko')return s;const k=s.replace(/\s+/g,' ').trim();return (QT[L]&&QT[L][k])||s};
let L='ko',mode,Q,idx=0,ans=[],RES=null;
const $=id=>document.getElementById(id);
const tr=k=>T[L][k];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setLang(l){
  L=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.title=tr('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=tr(e.dataset.ph));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if($('err').textContent)$('err').textContent=tr('err');
  if(Q&&!$('quiz').classList.contains('hide'))render();
  if(RES)showResult();
}
$('lang').innerHTML=LANGS.map(([k,v])=>`<button data-l="${k}" onclick="setLang('${k}')">${v}</button>`).join('');
setLang('ko');

function begin(m){
  if(!$('corp').value.trim()||!$('uname').value.trim()){$('err').textContent=tr('err');return}
  $('err').textContent='';mode=m;
  Q=DATA[m].map(q=>({...q,order:q.rel?[0,1,2,3]:shuffle([0,1,2,3])}));
  ans=Q.map(()=>({lv:null,ex:false}));
  idx=0;$('start').classList.add('hide');$('quiz').classList.remove('hide');
    render();
}
function render(){
  const q=Q[idx],a=ans[idx];
  $('who').textContent=$('corp').value.trim()+' · '+$('uname').value.trim()+' · '+(mode==='yes'?tr('expY'):tr('expN'));
  $('cnt').textContent=(idx+1)+' / '+Q.length;
  $('prog').style.width=((idx+1)/Q.length*100)+'%';
  $('qno').textContent='Q'+(idx+1);
  $('qtext').textContent=tx(q.q);
  const box=$('opts');box.innerHTML='';
  box.className='opts'+(q.rel?' rel':'')+(a.ex?' dis':'');
  q.order.forEach((k,p)=>{
    const d=document.createElement('div');d.className='opt'+(a.lv===k+1?' sel':'');d.textContent=tx(q.opts[k]);
    d.onclick=()=>{a.lv=k+1;a.pos=p;a.ex=false;render();if(idx<Q.length-1)setTimeout(()=>{idx++;render()},220)};
    box.appendChild(d);
  });
  if(q.ex){$('extra').classList.remove('hide');$('extxt').textContent=tx(q.ex);$('exchk').checked=a.ex;}
  else $('extra').classList.add('hide');
  const last=idx===Q.length-1;$('nextBtn').textContent=last?'✔ '+tr('submit'):tr('next');$('qnav').classList.toggle('last',last);$('lastTag').textContent=tr('lastQ')+' 🎉';
  $('nextBtn').disabled=!(a.lv||a.ex);
}
$('exchk').onchange=e=>{const a=ans[idx];a.ex=e.target.checked;if(a.ex){a.lv=null;a.pos=null}render()};
function prev(){if(idx>0){idx--;render()}else{$('quiz').classList.add('hide');$('start').classList.remove('hide')}}
function next(){const a=ans[idx];if(!(a.lv||a.ex))return;if(idx<Q.length-1){idx++;render()}else if(biased())openModal();else showResult()}
function biased(){
  const ps=ans.filter(a=>!a.ex&&a.pos!=null).map(a=>a.pos);if(ps.length<5)return false;
  const left=ps.filter(p=>p===0).length/ps.length, right=ps.filter(p=>p===3).length/ps.length;
  return left>=0.8||right>=0.8;
}
function openModal(){$('mTitle').textContent=tr('mT');$('mBody').textContent=tr('mB');$('mRe').textContent=tr('mRe');$('mGo').textContent=tr('mGo');$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
function reviewAgain(){closeModal();idx=0;render();window.scrollTo({top:0,behavior:'smooth'})}
function submitAnyway(){closeModal();showResult()}

function showResult(){
  $('quiz').classList.add('hide');$('result').classList.remove('hide');
  $('rwho').innerHTML=[$('corp').value.trim(),$('uname').value.trim(),mode==='yes'?tr('expY'):tr('expN')].map(x=>`<span>${x.replace(/</g,'&lt;')}</span>`).join('');
  RES=AREAS[mode].map(n=>{
    const s=[];Q.forEach((q,i)=>{if(q.area===n&&!q.rel&&!ans[i].ex&&ans[i].lv)s.push(ans[i].lv)});
    return {n,avg:s.length?s.reduce((x,y)=>x+y,0)/s.length:null,c:s.length}});
  const max=Math.max(...RES.map(r=>r.avg??-1));
  const tops=RES.filter(r=>r.avg!==null&&r.avg===max);
  const nm=n=>tr('A')[n];
  const valid=RES.filter(r=>r.avg!==null),min=Math.min(...valid.map(r=>r.avg));
  const lows=valid.filter(r=>r.avg===min&&!tops.includes(r));
  let fh=`<div class="fbc s"><h4>${tr('sH')}</h4>`+tops.map(r=>`<p><b>${nm(r.n)}</b> — ${tr('S')[r.n]}</p>`).join('')+`</div>`;
  fh+=`<div class="fbc w"><h4>${tr('wH')}</h4>`+(lows.length?lows.map(r=>`<p><b>${nm(r.n)}</b> — ${tr('W')[r.n]}</p>`).join(''):`<p>${tr('bal')}</p>`)+`</div>`;
  $('fb').innerHTML=fh;
  $('best').innerHTML=tops.length?tops.map(t=>`<img src="${IMGS[IMAP[t.n]]}" alt="${nm(t.n)}"><div class="tag">${tr('best')} : ${nm(t.n)}</div><div class="sc">${tr('avg')} ${t.avg.toFixed(2)}${tr('pt')}</div>`).join('<br>'):'<div class="sc">-</div>';
  drawRadar(RES,nm);
  saveRecord();
  document.querySelector('#result h1').textContent=tr(mode==='no'?'rtitleN':'rtitle');
  $('reveal').innerHTML=tops.length?'✨ '+tr(mode==='no'?'rvN':'rv').replace('{x}','<b>'+tops.map(r=>tr('TY')[r.n]).join(' · ')+'</b>'):'';
  const c=$('result');c.classList.remove('anim');void c.offsetWidth;c.classList.add('anim');
  if(!window._cf){window._cf=1;confetti()}
}
function confetti(){
  const cv=$('confetti'),x=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const col=['#A50034','#D6164F','#F05A7E','#FFC2D1','#FFD700','#ffffff'];
  const P=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,w:6+Math.random()*6,h:8+Math.random()*8,c:col[Math.random()*col.length|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4}));
  const t0=performance.now();
  (function f(n){const el=n-t0;x.clearRect(0,0,W,H);x.globalAlpha=el>1600?Math.max(0,1-(el-1600)/600):1;
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});

function drawRadar(res,nm){
  const svgEl = $('radar');
  if (svgEl) svgEl.style.fontFamily = "'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif";
  const cx=220,cy=225,R=140,n=res.length,svg=$('radar');let h='';
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  for(let l=4;l>=1;l--){h+=`<polygon points="${res.map((_,i)=>pt(i,R*l/4).join(',')).join(' ')}" fill="${l%2?'#FDF3F6':'#fff'}" stroke="#E7C9D2"/>`}
  for(let l=1;l<=4;l++)h+=`<text x="${cx+4}" y="${cy-R*l/4+4}" font-size="10" fill="#999">${l}</text>`;
  res.forEach((r,i)=>{const [x,y]=pt(i,R);h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E7C9D2"/>`;
    const [lx,ly]=pt(i,R+38);h+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="13" font-weight="700" fill="#A50034">${nm(r.n)}</text><text x="${lx}" y="${ly+16}" text-anchor="middle" font-size="12" fill="#555">${r.avg===null?'-':r.avg.toFixed(2)}</text>`});
  const ps=res.map((r,i)=>pt(i,R*(r.avg||0)/4));
  h+=`<polygon points="${ps.map(p=>p.join(',')).join(' ')}" fill="rgba(165,0,52,.28)" stroke="#A50034" stroke-width="2.5"/>`;
  ps.forEach(p=>h+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#A50034"/>`);
  svg.innerHTML=h;
}

  const kst = new Date(dateObj.getTime() + (9 * 60 + dateObj.getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  return `${kst.getFullYear()}-${p(kst.getMonth()+1)}-${p(kst.getDate())}T${p(kst.getHours())}:${p(kst.getMinutes())}:${p(kst.getSeconds())}+09:00`;
}
function formatKst(d, withTime = true) {
  if (!d) return '';
  const dateObj = typeof d === 'string' ? new Date(d) : d;
  if (isNaN(dateObj.getTime())) return String(d);
  const kst = new Date(dateObj.getTime() + (9 * 60 + dateObj.getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  const ymd = `${kst.getFullYear()}-${p(kst.getMonth()+1)}-${p(kst.getDate())}`;
  if (!withTime) return ymd;
  return `${ymd} ${p(kst.getHours())}:${p(kst.getMinutes())}`;
}
function stamp(){
  const kst = new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  return `${kst.getFullYear()}${p(kst.getMonth()+1)}${p(kst.getDate())}_${p(kst.getHours())}${p(kst.getMinutes())}`;
}
const colL=i=>{let s='';while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-1-m)/26|0}return s};
const colI=s=>s.split('').reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
function fillSheet(doc,m,list){
  const NS=doc.documentElement.namespaceURI,sd=doc.getElementsByTagName('sheetData')[0];
  const rows=()=>Array.from(sd.getElementsByTagName('row'));
  const N=list.length,k=Math.max(0,N-26),S=m==='yes'?20:11;
  if(k){
    rows().forEach(r=>{const n=+r.getAttribute('r');if(n>=29){r.setAttribute('r',n+k);
      Array.from(r.getElementsByTagName('c')).forEach(c=>c.setAttribute('r',c.getAttribute('r').replace(/\d+$/,'')+(n+k)))}});
    let after=rows().find(r=>r.getAttribute('r')==='28');
    for(let i=1;i<=k;i++){const nr=after.cloneNode(true);nr.setAttribute('r',28+i);sd.insertBefore(nr,after.nextSibling);after=nr}
  }
  const getRow=n=>{const rs=rows();let r=rs.find(x=>+x.getAttribute('r')===n);if(r)return r;
    r=doc.createElementNS(NS,'row');r.setAttribute('r',n);sd.insertBefore(r,rs.find(x=>+x.getAttribute('r')>n)||null);return r};
  const set=(n,ci,val,s,f)=>{const row=getRow(n);row.removeAttribute('spans');const ref=colL(ci)+n,cs=Array.from(row.getElementsByTagName('c'));
    let c=cs.find(x=>x.getAttribute('r')===ref);
    if(!c){c=doc.createElementNS(NS,'c');c.setAttribute('r',ref);row.insertBefore(c,cs.find(x=>colI(x.getAttribute('r').replace(/\d+/,''))>ci)||null)}
    while(c.firstChild)c.removeChild(c.firstChild);c.removeAttribute('t');if(s!=null)c.setAttribute('s',s);
    if(val==null||val==='')return;
    if(f){const e=doc.createElementNS(NS,'f');e.textContent=val;c.appendChild(e)}
    else if(typeof val==='number'){const e=doc.createElementNS(NS,'v');e.textContent=val;c.appendChild(e)}
    else{c.setAttribute('t','inlineStr');const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');t.textContent=val;is.appendChild(t);c.appendChild(is)}};
  const areas=AREAS[m];
  list.forEach((r,i)=>{const n=3+i;
    set(n,2,r.name,16);set(n,3,r.corp,16);set(n,4,m==='yes'?'O':'X',16);
    areas.forEach((a,j)=>set(n,5+j,r.avg[a]==null?'-':r.avg[a],16));
    set(n,10,r.rel,16);
  });
  if(N){
    list.forEach((r,j)=>{const ci=S+j;
      set(30+k,ci,formatKst(r.ts,false),15);
      set(31+k,ci,(j+1)+'. '+r.name+' ('+r.corp+')',1);
      Object.entries(ROWMAP[m]).forEach(([key,row])=>{
        let v=r.ans[key];
        if(key.endsWith('|R')) v = (v === -1 ? -1 : 0);
        set(row+k,ci,v==null?'':v,16);
      });
    });
    Object.entries(ROWMAP[m]).forEach(([key,row])=>{
      set(row+k,4,'IFERROR(ROUND(AVERAGE('+colL(S)+(row+k)+':'+colL(S+N-1)+(row+k)+'),2),"")',16,true);
    });
    const cols=doc.getElementsByTagName('cols')[0],col=doc.createElementNS(NS,'col');
    col.setAttribute('min',S);col.setAttribute('max',S+N-1);col.setAttribute('width','24');col.setAttribute('customWidth','1');cols.appendChild(col);
  }
  const dim=doc.getElementsByTagName('dimension')[0];
  if(dim)dim.setAttribute('ref','B1:'+colL(Math.max(m==='yes'?18:10,N?S+N-1:0))+(57+k));
}
function updateAppXml(appXml, newSheetNames){
  const totalSheets = 2 + newSheetNames.length;
  appXml = appXml.replace(/<vt:i4>\d+<\/vt:i4>/, '<vt:i4>' + totalSheets + '</vt:i4>');
  const titlesPartRegex = /<TitlesOfParts><vt:vector size="\d+" baseType="lpstr">([\s\S]*?)<\/vt:vector><\/TitlesOfParts>/;
  const match = appXml.match(titlesPartRegex);
  if(match){
    let inner = match[1];
    for(const name of newSheetNames){
      inner += '<vt:lpstr>' + name + '</vt:lpstr>';
    }
    const replacement = '<TitlesOfParts><vt:vector size="' + totalSheets + '" baseType="lpstr">' + inner + '</vt:vector></TitlesOfParts>';
    appXml = appXml.replace(titlesPartRegex, replacement);
  }
  return appXml;
}

function generateUid(){
  return '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
  }) + '}';
}

async function exportXlsx(isAuto, targetRecs){
  const allRecs=loadRecs();
  const recs=(targetRecs && targetRecs.length)?targetRecs:allRecs;
  if(!recs.length){if(!isAuto)alert('저장된 응답이 없습니다.');return}
  const zip=await JSZip.loadAsync(TPL_XLSX,{base64:true});
  
  // 1. 원본 템플릿 XML을 미리 백업 (개별 시트 복제용)
  const rawTpl = {
    no: await zip.file('xl/worksheets/sheet1.xml').async('string'),
    yes: await zip.file('xl/worksheets/sheet2.xml').async('string')
  };
  
  // 2. 기본 누적 시트 채우기 (전체 응답자 누적 마스터 시트 2개 유지)
  const SH={no:'xl/worksheets/sheet1.xml',yes:'xl/worksheets/sheet2.xml'};
  for(const m of ['yes','no']){
    const list=recs.filter(r=>r.mode===m).sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
    const doc=new DOMParser().parseFromString(rawTpl[m],'application/xml');
    fillSheet(doc,m,list);
    zip.file(SH[m],new XMLSerializer().serializeToString(doc));
  }
  
  // 3. 개별 응답자별 전용 시트 추가 생성 (1인 1시트: 예: 강의 유경험자 평가표_법인_이름)
  const usedNames = new Set(['강의 무경험자 평가표', '강의 유경험자 평가표']);
  const escXml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  
  const sortedRecs = recs.slice().sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
  const newSheetInfos = [];
  let nextSheetNum = 3;
  let nextSheetId = 11;
  
  sortedRecs.forEach(r => {
    const m = r.mode === 'yes' ? 'yes' : 'no';
    const baseTitle = m === 'yes' ? '강의 유경험자 평가표' : '강의 무경험자 평가표';
    const cName = (r.corp || '소속').trim();
    const uName = (r.name || '응답자').trim();
    
    // 시트 이름 구성 (금지 특수문자 제거 및 31자 제한)
    let rawSheetName = (baseTitle + '_' + cName + '_' + uName).replace(/[\/?*[\]:]/g, '_').trim();
    if(rawSheetName.length > 31){
      const shortPrefix = m === 'yes' ? '유경험' : '무경험';
      rawSheetName = (shortPrefix + '_' + cName + '_' + uName).replace(/[\/?*[\]:]/g, '_').trim();
      if(rawSheetName.length > 31) rawSheetName = rawSheetName.slice(0, 31);
    }
    
    // 중복 시트명 방지
    let sheetName = rawSheetName;
    let counter = 2;
    while(usedNames.has(sheetName)){
      const suffix = '(' + (counter++) + ')';
      sheetName = rawSheetName.slice(0, 31 - suffix.length) + suffix;
    }
    usedNames.add(sheetName);
    
    const sheetFileName = 'xl/worksheets/sheet' + nextSheetNum + '.xml';
    const singleDoc = new DOMParser().parseFromString(rawTpl[m], 'application/xml');
    fillSheet(singleDoc, m, [r]);
    
    let sXml = new XMLSerializer().serializeToString(singleDoc);
    sXml = sXml.replace(/xr:uid="[^"]*"/, 'xr:uid="' + generateUid() + '"');
    sXml = sXml.replace(/tabSelected="1"/, '');
    zip.file(sheetFileName, sXml);
    
    newSheetInfos.push({
      sheetNum: nextSheetNum,
      sheetId: nextSheetId,
      sheetName: sheetName
    });
    
    nextSheetNum++;
    nextSheetId++;
  });
  
  if(newSheetInfos.length > 0){
    // 4. [Content_Types].xml 갱신
    let ct = await zip.file('[Content_Types].xml').async('string');
    for(const info of newSheetInfos){
      const entry = '<Override PartName="/xl/worksheets/sheet' + info.sheetNum + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      ct = ct.replace('</Types>', entry + '</Types>');
    }
    zip.file('[Content_Types].xml', ct);
    
    // 5. xl/_rels/workbook.xml.rels 완전 재구성 (정확한 rId 순서 및 OpenXML 2006 스키마 규격 준수)
    const totalSheets = 2 + newSheetInfos.length;
    let relsEntries = [
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>',
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>'
    ];
    
    newSheetInfos.forEach((info, idx) => {
      const rId = 'rId' + (idx + 3);
      info.rId = rId;
      relsEntries.push('<Relationship Id="' + rId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + info.sheetNum + '.xml"/>');
    });
    
    relsEntries.push('<Relationship Id="rId' + (totalSheets + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>');
    relsEntries.push('<Relationship Id="' + 'rId' + (totalSheets + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>');
    relsEntries.push('<Relationship Id="' + 'rId' + (totalSheets + 3) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>');
    
    const relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + relsEntries.join('') + '</Relationships>';
    zip.file('xl/_rels/workbook.xml.rels', relsXml);
    
    // 6. xl/workbook.xml 갱신
    let wb = await zip.file('xl/workbook.xml').async('string');
    let sheetEntries = '';
    for(const info of newSheetInfos){
      sheetEntries += '<sheet name="' + escXml(info.sheetName) + '" sheetId="' + info.sheetId + '" r:id="' + info.rId + '"/>';
    }
    wb = wb.replace('</sheets>', sheetEntries + '</sheets>');
    wb = wb.replace(/<calcPr[^>]*\/>/, '<calcPr calcId="191029" fullCalcOnLoad="1"/>');
    zip.file('xl/workbook.xml', wb);
    
    // 7. docProps/app.xml 갱신 (시트 수 및 시트 목록 동기화)
    let app = await zip.file('docProps/app.xml').async('string');
    app = updateAppXml(app, newSheetInfos.map(s => s.sheetName));
    zip.file('docProps/app.xml', app);
  }
  
  // 8. 엑셀 파일 생성 및 다운로드
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression:'DEFLATE'});
  const isSelected = targetRecs && targetRecs.length && targetRecs.length < allRecs.length;
  const fileName = isSelected 
    ? 'MOT_강사역량_진단결과_선택_' + recs.length + '명_' + stamp() + '.xlsx'
    : '결과_누적_시트_' + stamp() + '.xlsx';
  dl(blob, fileName);
  if(!isAuto) showToast('✅ ' + (isSelected ? '선택한 ' + recs.length + '명의' : '누적') + ' 엑셀 파일이 다운로드되었습니다.');
}

function importJson(files){

function populateResultView(rec) {
  const m = rec.mode || 'yes';
  const l = rec.lang || 'ko';
  const areas = AREAS[m];
  
  $('rwho').innerHTML = [rec.corp, rec.name, m === 'yes' ? T[l].expY : T[l].expN]
    .map(x => `<span>${String(x || '').replace(/</g, '&lt;')}</span>`).join('');
    
  const rRes = areas.map(n => ({
    n,
    avg: rec.avg && rec.avg[n] != null ? rec.avg[n] : null
  }));
  
  const max = Math.max(...rRes.map(r => r.avg ?? -1));
  const tops = rRes.filter(r => r.avg !== null && r.avg === max);
  const nm = n => (T[l] && T[l].A && T[l].A[n]) || n;
  const valid = rRes.filter(r => r.avg !== null);

  let fh = `<div class="fbc s"><h4>${T[l].sH}</h4>` + tops.map(r => `<p><b>${nm(r.n)}</b> — ${T[l].S[r.n] || ''}</p>`).join('') + `</div>`;
