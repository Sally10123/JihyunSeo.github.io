}
function renderAdmin(){
  const recs=loadRecs(),y=recs.filter(r=>r.mode==='yes').length;
  $('admCnt').innerHTML='총 <b>'+recs.length+'</b>명 (강의 경험 있음 <b>'+y+'</b>명 · 없음 <b>'+(recs.length-y)+'</b>명)';
  const chkAll = $('chkAll');
  if(chkAll){ chkAll.checked = false; chkAll.indeterminate = false; }
  const selCnt = $('selCnt');
  if(selCnt) selCnt.textContent = '0';
  
  if(!recs.length){
    $('admList').innerHTML = '<p class="admEmpty">아직 저장된 응답이 없습니다.</p>';
    return;
  }
  
  let h = '<table><thead><tr>' +
    '<th class="chkCell"><input type="checkbox" id="chkAll" onchange="toggleSelectAll(this.checked)" title="전체 선택"></th>' +
    '<th>#</th>' +
    '<th>제출일시(KST)</th>' +
    '<th>법인</th>' +
    '<th>이름</th>' +
    '<th>구분</th>' +
    '<th>신뢰성 검증</th>' +
    '<th style="text-align:center;">다운로드 / 관리</th>' +
    '</tr></thead><tbody>';
    
  h += recs.map((r, i) => {
    const areas = r.mode === 'yes' ? ['강의 역량','콘텐츠 제작 역량','커뮤니케이션 역량','마인드셋 역량'] : ['설명 역량','시각적 구조화 역량','커뮤니케이션 역량','마인드셋 역량'];
    const deds = areas.filter(a => r.ans && r.ans[a+'|R'] === -1);
    let relHtml = '';
    if (deds.length === 0) {
      relHtml = '<span style="color:#2b8a3e;font-weight:600;">0점 (정상)</span>';
    } else {
      const details = deds.map(a => a.replace(' 역량','') + ': -1점').join(', ');
      relHtml = '<span style="color:#c92a2a;font-weight:700;">' + r.rel + '점</span> <div style="font-size:11px;color:#868e96;margin-top:2px;">(' + details + ')</div>';
    }
    
    return '<tr>' +
      '<td class="chkCell"><input type="checkbox" class="admChk" value="' + r.id + '" onchange="updateSelectedCount()"></td>' +
      '<td>' + (i + 1) + '</td>' +
      '<td style="white-space:nowrap;font-size:12px;color:#555;">' + formatKst(r.ts) + '</td>' +
      '<td>' + esc(r.corp) + '</td>' +
      '<td><b>' + esc(r.name) + '</b></td>' +
      '<td>' + (r.mode === 'yes' ? '경험 있음' : '경험 없음') + '</td>' +
      '<td>' + relHtml + '</td>' +
      '<td style="white-space:nowrap;text-align:center;">' +
        '<button class="admBtn dl" onclick="downloadSingleResultPng(\'' + r.id + '\')" title="해당 응답자의 결과 페이지를 PNG 이미지로 다운로드">🖼️ 결과 PNG</button> ' +
        '<button class="admBtn view" onclick="viewSingleResult(\'' + r.id + '\')" title="결과 페이지 화면 보기">👁️ 보기</button> ' +
        '<button class="admDel" onclick="delRec(\'' + r.id + '\')" title="응답 삭제">삭제</button>' +
      '</td>' +
    '</tr>';
  }).join('');
  
  h += '</tbody></table>';
  $('admList').innerHTML = h;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showToast(msg){
  let t = document.getElementById('saveToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'saveToast';
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#A50034;color:#fff;padding:16px 28px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(165,0,52,0.35);z-index:9999;transition:all .3s ease;display:flex;align-items:center;gap:10px;';
    document.body.appendChild(t);
  }
  t.innerHTML = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(()=>{
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 4000);
}


const ADMIN_PW = '!lge54321';

function openAdminWithPw(){
  if(window._isAdmin){
    openAdmin();
    return;
  }
  const pw = prompt('관리자 비밀번호를 입력해 주세요:');
  if(pw === null) return;
  if(pw === ADMIN_PW){
    window._isAdmin = true;
    openAdmin();
  } else {
    alert('비밀번호가 올바르지 않습니다.');
  }
}


const FILE_PREFIX = {
  ko: 'MOT_강사역량_스타일 진단',
  en: 'MOT_Trainer_Style_Diagnosis',
  vi: 'MOT_Phong_cach_giang_vien',
  ar: 'MOT_تشخيص_أسلوب_المدرب',
  es: 'MOT_Estilo_del_instructor',
  fr: 'MOT_Style_du_formateur',
  ja: 'MOT_講師力量スタイル診断',
  zh: 'MOT_讲师能力风格诊断'
};

async function captureResultCanvas(target) {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch(e){}
  }
  return await html2canvas(target, {
    scale: 3,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#ffffff',
    logging: false,
    imageTimeout: 0,
    scrollX: 0,
    scrollY: 0,
    windowWidth: 1200,
    onclone: (clonedDoc) => {
      const clonedResult = clonedDoc.getElementById('result');
      if (clonedResult) {
        clonedResult.classList.remove('anim');
        clonedResult.classList.remove('hide');
        clonedResult.style.boxShadow = 'none';
        clonedResult.style.borderRadius = '24px';
        clonedResult.style.backgroundColor = '#ffffff';
        clonedResult.style.width = '880px';
        clonedResult.style.maxWidth = '880px';
        clonedResult.style.margin = '0 auto';
        clonedResult.style.padding = '44px 48px';
        clonedResult.style.transform = 'none';
        clonedResult.style.opacity = '1';
        
        const nav = clonedResult.querySelector('.nav');
        if (nav) nav.style.display = 'none';
        
        const rhero = clonedResult.querySelector('.rhero');
        if (rhero) {
          rhero.style.margin = '-44px -48px 0';
          rhero.style.borderRadius = '24px 24px 0 0';
          rhero.style.transform = 'none';
          rhero.style.opacity = '1';
        }
      }
      
      const cf = clonedDoc.getElementById('confetti');
      if (cf) cf.remove();
      
      const style = clonedDoc.createElement('style');
      style.textContent = `
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
          -webkit-animation: none !important;
          -webkit-transition: none !important;
        }
        .rhero, .radar, .best, .fb, .fbc, .reveal, .chips {
          transform: none !important;
          opacity: 1 !important;
        }
        .radar text {
          font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif !important;
        }
      `;
      clonedDoc.head.appendChild(style);
      
      const clonedRadar = clonedDoc.getElementById('radar');
      if (clonedRadar) {
        clonedRadar.setAttribute('width', '440');
        clonedRadar.setAttribute('height', '440');
        clonedRadar.style.width = '440px';
        clonedRadar.style.maxWidth = '100%';
        clonedRadar.style.display = 'block';
        clonedRadar.style.margin = '0 auto';
        clonedRadar.style.transform = 'none';
        clonedRadar.style.opacity = '1';
      }
    }
  });
}

async function downloadResultPng(){
  const target = $('result');
  if(!target) return;
  
  const curL = (typeof L !== 'undefined' && L) ? L : 'ko';
  const getT = k => (T[curL] && T[curL][k]) || (T.ko && T.ko[k]) || '';
  
  try {
    showToast(getT('dlGen') || '🖼️ 고화질 결과 이미지를 생성하고 있습니다...');
    const canvas = await captureResultCanvas(target);
    
    canvas.toBlob(blob => {
      let uName = ($('uname') && $('uname').value ? $('uname').value.trim() : '');
      let cName = ($('corp') && $('corp').value ? $('corp').value.trim() : '');
      if(!uName){
        const chips = document.querySelectorAll('#rwho span');
        if(chips && chips.length >= 2){
          cName = chips[0].textContent.trim();
          uName = chips[1].textContent.trim();
        }
      }
      uName = uName || (curL === 'ko' ? '결과' : 'Result');
      const prefix = FILE_PREFIX[curL] || FILE_PREFIX.ko;
      const namePart = (cName ? cName + '_' : '') + uName;
      dl(blob, prefix + '_' + namePart + '_' + stamp() + '.png');
      showToast(getT('dlSuccess') || '✅ 선명한 고화질 결과 이미지가 저장되었습니다.');
    }, 'image/png');
  } catch(err) {
    console.error(err);
    alert((getT('dlErr') || '이미지 저장 중 오류가 발생했습니다: ') + err.message);
  }
}

function openAdmin(){renderAdmin();$('admin').classList.remove('hide')}

if(location.hash==='#admin')openAdminWithPw();
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdminWithPw()});
