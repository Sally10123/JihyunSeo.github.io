 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"Tôi lắng nghe và đồng cảm trọn vẹn với sự bức xúc, phản kháng của học viên rồi cùng tìm và đưa ra phương án thực tế cụ thể để giải quyết.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"Tôi chia sẻ trải nghiệm thực tế của mình để đồng cảm và thuyết phục học viên, theo góc nhìn của họ, vì sao khóa đào tạo này cần thiết.","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"Khi đặt câu hỏi trong cuộc họp mà đồng nghiệp im lặng không có ý kiến, tôi xử lý thế nào?","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"Nếu im lặng kéo dài, tôi nhanh chóng chuyển sang nội dung tiếp theo để tránh mất thời gian.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"Để phá vỡ sự im lặng, tôi chỉ định trực tiếp một đồng nghiệp trả lời.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"Thay vì câu hỏi mở khó trả lời, tôi đưa ra vài lựa chọn để mọi người chọn, nhằm gợi mở suy nghĩ.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"Tôi tự nhiên dành cho mỗi người 1–2 phút sắp xếp suy nghĩ để mọi người thoải mái trao đổi.","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"Khi đã nỗ lực rất nhiều mà không có kết quả hoặc không có thay đổi gì, phản ứng của tôi là?","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"Tôi cảm thấy bất lực, mệt mỏi và mất động lực thay đổi tình hình.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"Tôi kiểm soát cảm xúc để không chìm sâu vào thất vọng, và tập trung thực hiện tốt việc đào tạo, coaching đã định thay vì phân tích nguyên nhân.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"Tôi xem lại xem mình có bỏ sót điều gì không, xem xét kỹ dữ liệu và tình hình thực tế để tìm cách vượt qua.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"Không dao động trước tình huống, tôi tìm khả năng thay đổi và căn cứ cải thiện dựa trên dữ liệu để tiếp tục đào tạo và coaching MOT.","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"Cách tôi đối phó khi căng thẳng hoặc xung đột mạnh là?","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"Tôi cố kìm nén để cảm xúc không bùng nổ, nhưng nét mặt vẫn lộ ra phần nào.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"Tôi ngắt cảm xúc để không bận tâm đến tác nhân gây căng thẳng nữa và dồn sức vào việc cần làm ngay.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"Tôi thay đổi tâm trạng bằng trò chuyện nhẹ nhàng, đùa vui, hoặc chia sẻ thẳng thắn với đồng nghiệp để giải tỏa căng thẳng.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"Tôi nhanh chóng ổn định cảm xúc bằng cách giải tỏa hoặc hoạt động giải trí hiệu quả của riêng mình, và coi thử thách này là cơ hội học hỏi.","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"Khi giảng dạy, tôi nghĩ truyền đạt đúng nguyên văn bài giảng tạo được sự tin cậy nhất, hơn là thêm ví dụ thực tế hay so sánh.","매우 그렇다":"Rất đồng ý","그렇다":"Đồng ý","그렇지 않다":"Không đồng ý","전혀 그렇지 않다":"Hoàn toàn không đồng ý","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"Tốc độ và giọng nói tổng thể của tôi khi giảng dạy là?","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"Tôi giải thích bằng giọng đều đặn để tạo sự tin cậy khi truyền đạt thông tin.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"Tôi điều chỉnh tốc độ nói tổng thể để SE có thể hiểu nội dung.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Vừa điều chỉnh tốc độ, ở các bước quan trọng tôi nâng âm lượng hoặc giọng để nhấn mạnh rõ ràng.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"Tôi điều chỉnh tốc độ và nhấn nhá tùy tình huống, và dừng lại một chút ở điểm then chốt.","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"Cách tôi phản hồi sau RP hoặc coaching kèm cặp 1:1 là?","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"Tôi nói chuyện thoải mái, chủ yếu khen ngợi và động viên để SE không bị nản hay căng thẳng.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"Khi phát hiện điểm sai lệch so với tiêu chuẩn sổ tay MOT, tôi can thiệp và sửa ngay.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"Tôi chia một cách có hệ thống và nói hết mọi điều, cả điểm làm tốt lẫn tất cả điểm cần cải thiện.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"Qua phản hồi tổng hợp, tôi nêu điểm mạnh nổi bật nhất và chọn một hành vi cần ưu tiên cải thiện trong công việc để truyền đạt rõ ràng.","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"Khi đào tạo, việc cho học viên đọc theo sổ tay nhiều lần để nắm nhanh quan trọng hơn việc cho họ chia sẻ ý kiến qua thảo luận.","매우 그렇지 않다":"Hoàn toàn không đồng ý","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"Khi điểm T-NPS thấp, cách tôi phân tích nguyên nhân là?","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"Về cơ bản, tôi cho rằng nguyên nhân lớn nhất của điểm thấp là SE thiếu sự thân thiện hoặc tinh thần phục vụ.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"Tôi đối chiếu tỷ lệ bỏ sót, không thực hiện các bước trong sổ tay tại hiện trường để tìm nguyên nhân.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"Tôi xem cả ý kiến khách hàng và phân loại nguyên nhân khiếu nại thành ứng xử cá nhân, vấn đề sản phẩm, môi trường dịch vụ, v.v.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"Loại trừ các yếu tố môi trường SE khó kiểm soát, tôi rút ra cụ thể những gì có thể cải thiện trong ứng xử cá nhân.","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không thực hiện việc phân loại nguyên nhân khiếu nại.","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"Cách tôi kiểm tra đào tạo hoặc coaching có thực sự góp phần cải thiện các chỉ số như T-NPS hay không là?","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"Tôi kiểm tra xem sau đào tạo, điểm T-NPS toàn pháp nhân có tăng so với tháng trước không.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"Tôi so sánh mức tăng giảm T-NPS toàn pháp nhân trước và sau đào tạo để đánh giá mức cải thiện.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"Tôi so sánh điểm T-NPS của SE đã hoàn thành đào tạo trong 1 tháng trước và sau đào tạo.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"Tôi theo dõi điểm T-NPS của học viên trong 2–3 tháng để xem hiệu quả cải thiện có duy trì không.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không theo dõi riêng điểm T-NPS của học viên sau đào tạo.","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"Cách tôi thiết kế slide để giúp học viên hiểu và tham gia là?","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"Tôi xây dựng bài giảng chủ yếu xoay quanh việc học viên cùng đọc to theo.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"Tôi chèn bài điền vào chỗ trống hoặc câu đố giữa chừng để kiểm tra học viên có nhớ ý chính không.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"Tôi thiết kế slide tương tác để học viên tự sửa hành động hoặc câu nói sai, rồi xác nhận đáp án qua phản hồi của giảng viên.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"Tôi thiết kế slide để học viên thảo luận tìm giải pháp, sau đó giảng viên phản hồi và tổng kết hướng đúng.","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"Cách tôi trực quan hóa hướng dẫn hoặc thông tin văn bản phức tạp trên slide là?","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"Tôi điền slide chủ yếu bằng gạch đầu dòng gọn gàng và đoạn văn.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"Để dễ đọc hơn, tôi đưa đoạn văn dài hoặc dữ liệu số vào bảng hoặc biểu đồ cơ bản.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"Để thể hiện thứ tự hoặc mối quan hệ giữa các khái niệm, tôi dùng mũi tên hoặc hình sơ đồ để cấu trúc nội dung.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"Trong nội dung đã sơ đồ hóa bằng hình hoặc bảng, tôi thay đổi kích cỡ và màu sắc của cụm từ hoặc từ cần nhấn mạnh.","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"Khi có tình huống bất ngờ trong lúc phối hợp, nếu phần việc của tôi không có vấn đề, tôi thường tập trung vào việc khác để dùng thời gian hiệu quả.","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"Khi học viên nêu bất mãn không liên quan đến chủ đề và làm ảnh hưởng không khí lớp, tôi xử lý thế nào?","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"Tôi nói rằng điều đó không phù hợp với chủ đề đào tạo hiện tại và tiếp tục nội dung đã chuẩn bị.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"Tôi thừa nhận đó là ý kiến quan trọng, nhưng hẹn trao đổi riêng vào giờ nghỉ hoặc sau buổi học để tạm khép lại.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"Trong phạm vi không làm gián đoạn bài giảng, tôi lắng nghe và đồng cảm với sự bức xúc, oan ức của học viên.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"Tôi thừa nhận nguyên nhân bất mãn, nhưng đưa ra mẹo ứng xử thực tế có thể áp dụng trong tình huống đó.","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"Khi gặp người thiếu ý chí tham gia, lặng lẽ lạc lõng hoặc bị bỏ rơi, cách giao tiếp của tôi là?","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"Tôi tập trung theo lịch đào tạo và tiến độ bài giảng đã chuẩn bị hơn là mức độ tham gia của từng người.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"Để học viên không bị tụt lại hoàn toàn, tôi ghép cặp họ với đồng nghiệp giỏi ngồi bên cạnh để họ tự nhiên theo kịp phần thực hành.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"Tôi đi quanh khu thực hành, nhẹ nhàng tiếp cận 1:1, hỏi xem có phần nào khó hiểu không và đưa phản hồi nhẹ.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"Tôi gợi ý vai trò hoặc câu trả lời đơn giản, dễ thành công theo trình độ của học viên, rồi hưởng ứng tích cực để nâng cao sự tự tin tham gia.","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"Khi bộ phận liên quan hoặc đồng nghiệp yêu cầu hỗ trợ gấp hoặc quá sức mà khó xử lý ngay, tôi xử lý thế nào?","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"Tôi kiên quyết giải thích rằng công việc của mình đang bận và từ chối rõ ràng rằng không thể hỗ trợ.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"Để tránh quan hệ trở nên khó xử, tôi cứ nhận lời và xử lý dù lịch làm việc của mình bị quá tải.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"Tôi bình tĩnh giải thích ưu tiên và giới hạn của mình, và nói khéo rằng hiện tại chưa thể làm ngay.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"Dù chưa thể nhận ngay, tôi đưa ra phương án có thể điều chỉnh như \"Thay vào đó tôi sẽ xử lý trước chiều mai hoặc hỗ trợ theo cách khác\".","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"Khi đối diện người phản hồi tiêu cực về ý kiến của tôi, tôi xử lý thế nào?","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"Nếu lời phê bình không đúng sự thật khách quan hoặc bị bóp méo, tôi phản bác dứt khoát.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"Tôi tránh bị cuốn sâu vào cảm xúc tiêu cực và tổn thương, chỉ chọn lọc tiếp nhận những thông tin hữu ích trong lời phê bình.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"Thay vì buồn vì giọng điệu gay gắt, tôi coi lời góp ý là cơ hội nhìn lại bản thân và tiếp nhận.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"Tôi cảm ơn lời khuyên và coi đó là cơ hội học hỏi, cải thiện để tiến thêm một bước.","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"Khi có vấn đề xảy ra ở phần không thuộc trách nhiệm của tôi trong lúc phối hợp, tôi xử lý thế nào?","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"Tôi tập trung xử lý thật chu đáo, không một sai sót, phần việc được giao rõ ràng cho mình.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"Tôi tìm nguyên nhân để vấn đề không lớn thêm và để mỗi người lập biện pháp trong phạm vi của mình.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"Dù không thuộc phạm vi công việc của mình, tôi vẫn cố gắng cùng giải quyết vấn đề vì mục tiêu chung.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Thay vì truy cứu đúng sai trong quá trình, tôi làm việc với tinh thần làm chủ, chịu trách nhiệm đến cùng về kết quả nhiệm vụ chung.","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"Khi học viên ít tham gia, tôi nghĩ tốt hơn là quan sát mà không gây áp lực thay vì khuyến khích họ tham gia.","매우 그렇지 않다.":"Hoàn toàn không đồng ý","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"Khi phải giải thích công việc trước đây mình phụ trách cho người khác, phong cách giải thích của tôi là?","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"Để không bỏ sót, tôi bình tĩnh đọc tài liệu công việc liên quan từ đầu đến cuối để giải thích.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"Thay vì đọc hết tài liệu, tôi tóm tắt và giải thích các điểm chính cốt lõi.","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"Để người nghe dễ hiểu, ngoài phần tóm tắt cốt lõi tôi lấy ví dụ từ kinh nghiệm làm việc thực tế.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"Không chỉ kể kinh nghiệm, tôi còn giải thích bối cảnh cụ thể của công việc và các mẹo hữu ích có thể dùng ngay trong thực tế.","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"Khi trình bày ý kiến hoặc báo cáo kế hoạch trước đồng nghiệp hay cấp trên, phong cách nói thường ngày của tôi là?","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"Để truyền đạt bình tĩnh toàn bộ nội dung, tôi giữ tốc độ và giọng nói đều, không thay đổi cảm xúc.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"Tôi quan sát nét mặt người nghe xem họ có theo kịp không và điều chỉnh tốc độ nói tổng thể.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Vừa điều chỉnh tốc độ, ở các bước quan trọng tôi nâng âm lượng hoặc giọng để nhấn mạnh rõ ràng.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"Tôi điều chỉnh tốc độ và nhấn nhá, và dừng lại một chút ngay trước ý chính muốn nhấn mạnh.","T-NPS를 확인할 때 어디까지 살펴보는가?":"Khi xem T-NPS, tôi xem đến mức độ nào?","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"Tôi chủ yếu đối chiếu các khu vực yếu hoặc nhóm sản phẩm sửa chữa cụ thể có điểm đặc biệt thấp.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"Tôi đối chiếu từng điểm cá nhân của mỗi SE và cả độ chênh lệch chi tiết giữa các cá nhân.","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"Thay vì để người khác tự suy nghĩ, chỉ ra nhanh chỗ sai và cách giải quyết là cách phản hồi hiệu quả hơn.","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"Khi sắp xếp thông tin văn bản phức tạp thành PPT, tôi thường xây dựng thế nào?","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"Tôi bình tĩnh giải thích ưu tiên và giới hạn của mình, từ chối bằng giọng nhẹ nhàng để không làm người khác phật lòng.","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"Khi phải phản hồi về kết quả công việc của đồng nghiệp/cấp dưới, phong cách thường ngày của tôi là?","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"Tôi chỉ rõ phần cần sửa và giải thích thẳng thắn điểm cần cải thiện để họ hiểu.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"Để người kia không ngại, tôi khen nhẹ trước rồi mới nói điểm cần sửa.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"Sau lời khen nhẹ, khi chỉ ra chỗ sai, tôi đưa ví dụ hoặc tài liệu tham khảo để họ sửa đúng.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"Thay vì nói ngay chỗ cần sửa, tôi đặt câu hỏi để họ tự suy nghĩ và nhận ra chỗ sai.","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"Khi đã nỗ lực rất nhiều mà không có kết quả hoặc không có thay đổi gì, phản ứng của tôi là?","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"Tôi tách cảm xúc ra để không chìm vào thất vọng và dồn sức cho việc đào tạo, coaching đã định.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"Không tổn thương vì trì trệ hay thất bại tạm thời, tôi giữ vững niềm tin rằng nếu kiên trì đào tạo MOT, hành vi của SE và T-NPS cuối cùng sẽ tăng.","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"Khi giải thích công việc hay vấn đề khác cho đồng nghiệp, cách tôi kiểm tra họ có hiểu không là?","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"Tôi tập trung giải thích những gì đã chuẩn bị hơn là quan sát nét mặt hay phản ứng của người nghe.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"Trong khi giải thích, tôi chú ý xem người nghe có gật đầu hay không.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"Khi người nghe chỉ im lặng lắng nghe, tôi hỏi trực tiếp: \"Có chỗ nào chưa hiểu hoặc muốn hỏi thêm không?\"","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"Dù người nghe nói đã hiểu, tôi vẫn nhận ra sự ngập ngừng hay nét mặt căng cứng tinh tế và chủ động giải thích lại dễ hiểu hơn.","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"Khi người nghe không hiểu hoặc thấy khó với lời giải thích của tôi, tôi làm thế nào?","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"Tôi nói lại chậm rãi nội dung đã giải thích và nhấn mạnh.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"Tôi giải thích lại tập trung vào phần họ khó hiểu hoặc cung cấp thêm thông tin.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"Tôi xác định phần họ thấy khó và giải thích lại bằng cách hoặc ví dụ khác.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"Tôi tìm ra họ không hiểu ở đâu và vì sao, rồi điều chỉnh cách giải thích theo trình độ của họ.","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"Khi điểm T-NPS thấp, cách tôi phân loại nguyên nhân là?","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"Khi phân loại nguyên nhân, tôi đọc cả ý kiến khách hàng để xác định khiếu nại là vấn đề cá nhân hay liên quan đến yếu tố khác.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"Xét đến các hạn chế môi trường SE không thể kiểm soát, tôi tách riêng và chỉ xem những gì thuần túy liên quan đến ứng xử cá nhân.","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"Cách tôi kiểm tra đào tạo hoặc coaching do pháp nhân thực hiện có thực sự góp phần cải thiện các chỉ số như T-NPS hay không là?","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"Tôi so sánh chênh lệch điểm T-NPS hằng tháng giữa trung tâm được đào tạo tập trung và trung tâm không được đào tạo.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"Với SE đã hoàn thành đào tạo, tôi trực tiếp đối chiếu xem điểm T-NPS 1 tháng sau đào tạo có cao hơn trước đào tạo không.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"Tôi theo dõi dài hạn điểm T-NPS của học viên cả sau 2–3 tháng.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không theo dõi riêng điểm T-NPS hay phản hồi sau đào tạo (F/UP) cho học viên.","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"Để tăng khả năng dễ đọc và sức thuyết phục trực quan của slide, tôi chủ yếu dùng cách nào?","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"Tôi giảm tối đa yếu tố thiết kế, làm đơn giản trên nền trắng với chủ yếu là chữ.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"Tôi dùng mẫu bố cục PPT cơ bản của công ty hoặc trên mạng và sắp xếp chữ gọn gàng.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"Tôi bố trí hợp lý biểu tượng, hình minh họa hoặc ảnh thực tế liên quan đến từ khóa muốn giải thích.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"Vừa bố trí hợp lý biểu tượng hoặc ảnh, tôi còn khéo léo dùng các yếu tố trực quan như khung đậm hoặc làm nổi bật.","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"Khi làm bài giảng, tài liệu bằng PPT, điều gần nhất với cách làm thường ngày của tôi là?","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"Tôi chỉnh từng kích thước, khoảng cách hình bằng chuột và làm từng bước với chức năng cơ bản nên khá tốn thời gian.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"Tôi dùng các phím tắt cơ bản ai cũng biết như sao chép (Ctrl+C), dán (Ctrl+V) để rút ngắn thời gian.","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"Tôi thành thạo dùng sao chép định dạng, thanh công cụ truy cập nhanh (QAT), phím tắt căn chỉnh/sắp xếp hình để rút ngắn đáng kể thời gian.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"Với bố cục slide lặp lại, tôi tự tạo master hoặc mẫu để làm nhanh mà vẫn giữ thống nhất cho toàn bộ tài liệu.","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"Khi giải thích cho đồng nghiệp, chuyển nguyên tài liệu hướng dẫn chính thức là cách giải thích an toàn và hiệu quả nhất.","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"Khi đồng nghiệp nói chuyện không liên quan đến mạch câu chuyện, tôi xử lý thế nào?","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"Tôi không phản ứng nhiều với câu chuyện bất ngờ và lặng lẽ chuyển về chủ đề trước đó.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"Tôi chỉ ra để người kia biết mạch câu chuyện bị ngắt, rồi nhanh chóng đưa về chủ đề ban đầu.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"Tôi phụ họa vài câu để người kia không ngượng, rồi tự nhiên quay lại câu chuyện ban đầu.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"Tôi tìm điểm nối giữa câu chuyện họ nêu với chủ đề ban đầu để quay lại mà không làm đứt mạch trò chuyện.","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"Khi có thành viên không tích cực tham gia, lặng lẽ đứng ngoài trong dự án nhóm hoặc phối hợp, tôi xử lý thế nào?","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"Tôi tập trung vào vai trò của mình hơn là bận tâm thành viên khác có tham gia hay không.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"Thay vì tự can thiệp, tôi lặng lẽ chia sẻ tình hình với trưởng nhóm hoặc người phụ trách để họ giải quyết.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"Tôi thoải mái tiếp cận như một đồng nghiệp và nhẹ nhàng hỏi xem họ có gặp khó khăn gì trong công việc không.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"Tôi chia sẻ nhẹ nhàng tài liệu đang làm và tự nhiên hỏi ý kiến: \"Bạn xem giúp phần này một chút được không?\"","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"Khi thiết kế PPT, truyền đạt rõ ràng chỉ bằng chữ, không rườm rà, hiệu quả hơn là thêm yếu tố trực quan.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"Thay vì buồn vì giọng điệu gay gắt, tôi coi lời góp ý là cơ hội nhìn lại bản thân và sẵn lòng tiếp nhận.","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"Khi có vấn đề bất ngờ xảy ra trong lúc phối hợp, tôi xử lý thế nào?","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Thay vì truy cứu đúng sai trong quá trình, tôi làm việc với tinh thần làm chủ, chịu trách nhiệm đến cùng về kết quả nhiệm vụ.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không theo dõi riêng điểm T-NPS hay phản hồi cho học viên sau đào tạo.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"Tôi giải thích lại tập trung vào phần họ khó hiểu.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"Tôi thay đổi tâm trạng bằng trò chuyện nhẹ nhàng, đùa vui, hoặc chia sẻ thẳng thắn với đồng nghiệp để giải tỏa căng thẳng.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"Tôi nhanh chóng ổn định cảm xúc bằng cách giải tỏa hoặc hoạt động giải trí hiệu quả của riêng mình, và coi thử thách này là cơ hội học hỏi.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"Dù người nghe nói đã hiểu, tôi vẫn nhận ra sự ngập ngừng hay nét mặt căng cứng tinh tế và chủ động giải thích lại dễ hiểu hơn."},"ar":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"ما طريقتي في شرح المحتوى الرئيسي للشريحة للمتدربين؟","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"أقرأ نص الشريحة بعناية حتى لا يفوتني أي جزء مهم.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"ألخّص نص الشريحة مع التركيز على النقاط الأساسية.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"أستخدم تشبيهات أو أمثلة محددة تناسب الواقع الميداني لتسهيل الفهم.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"أثناء استخدام التشبيهات أو الأمثلة، أعيد تمثيل تصرفات أو عبارات حقيقية في خدمة العملاء عند الحاجة.","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"أثناء التدريب، أين أنظر وكيف أتحرك؟","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"أنظر غالبًا إلى الشاشة أو العرض حتى لا يفوتني محتوى المادة.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"أشعر ببعض الحرج من التواصل البصري مع المتدربين، لذا أنظر غالبًا إلى مؤخرة القاعة وأبقى في مكان ثابت.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"أتواصل بصريًا مع المتدربين، لكنني أركّز غالبًا على من يتفاعلون ويستجيبون جيدًا.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"أضبط حركتي بشكل مناسب وأوزّع نظري بالتساوي حتى لا يشعر أي متدرب بالإهمال.","T-NPS를 확인할 때 나의 방식은?":"ما طريقتي في متابعة T-NPS؟","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"أركّز أساسًا على المتوسط العام للشركة التابعة واتجاه ارتفاعه وانخفاضه.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"أقارن متوسطات المراكز داخل الشركة وأركّز على المراكز ذات الأداء المنخفض.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"أحلّل T-NPS للمناطق منخفضة الدرجات أو لفئات منتجات صيانة محددة لتحديد نقاط الضعف والقوة الرئيسية.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"أقارن وأحلّل بالتفصيل عوامل الضعف في كل مركز والدرجات والفروق الفردية لفنيي SE لاستخلاص نقاط قوة ومجالات تحسين محددة.","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"بسبب ظروف الشركة التابعة، لا أقوم بمهام متابعة T-NPS.","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"ما طريقتي في استخلاص عوامل تحسين محددة للشركة بناءً على البيانات؟","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"أعتبر اتجاه درجات T-NPS العام للشركة نفسه هو اتجاه التحسين الرئيسي.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"أراجع الأرقام حسب البنود وأختار فئة الشكوى الأساسية الأقل درجة كعامل للتحسين.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"أقرأ بعناية درجات SE وتعليقات شكاوى العملاء لاستخلاص عوامل تحسين عملية.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"أربط بين T-NPS وتعليقات العملاء ومؤشرات SE السابقة لمعرفة سبب تكرار الشكاوى.","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"بسبب ظروف الشركة التابعة، لا أقوم بتحليل البيانات لاستخلاص عوامل التحسين.","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"كيف أستخدم محتوى التدريب الصادر عن HQ في الشركة التابعة؟","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"أستخدم المحتوى الإنجليزي المقدم من HQ كما هو.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"أحافظ على هيكل ومحتوى مادة HQ، وأترجم النص إلى اللغة المحلية وأطبّقه بسرعة في التدريب.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"أعدّل محتوى وصياغة شرائح معينة بما يناسب ظروف الشركة وحالاتها.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"استنادًا إلى محتوى HQ، أطوّر محتوى خاصًا يناسب ظروف الشركة وخصائص المتدربين.","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"عند إعداد عرض PPT، كيف أنظّم ترتيب الشرائح وتسلسلها؟","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"أكتب المحتوى على الشرائح بالترتيب الذي يخطر ببالي.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"أقسّم المحتوى حسب موضوعات عامة وأرتّب الشرائح وفقًا لها.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"أربط الشرائح بتسلسل منطقي للسبب والنتيجة مثل: طرح المشكلة ← تحليل الأسباب ← اتجاه الحل.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"باعتماد هيكل يبدأ بالخلاصة، أنظّم العرض بحيث تتسلسل رسالته الأساسية في خط واحد.","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"كيف أتعامل مع متدرب يعبّر عن صعوبات أو آراء سلبية تجاه محتوى أو توجه التدريب الذي أقدمه؟","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"أوضح بهدوء ومن منطلق المبدأ أنه يجب الالتزام بمحتوى التدريب لضمان معايير ونتائج متسقة.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"أتعاطف باختصار مع صعوباته الواقعية ثم أقترح بسرعة حلًا وسطًا بسيطًا يمكن تطبيقه فورًا.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"أستمع حتى النهاية لإحباطه ورفضه وأتعاطف معه، ثم نبحث معًا عن بدائل عملية محددة ونطرحها.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"أتعاطف بمشاركة تجاربي الحقيقية وأقنعه بلغة تناسبه بسبب أهمية هذا التدريب.","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"كيف أتصرف عندما يصمت الزملاء بعد طرحي سؤالًا في اجتماع؟","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"إذا طال الصمت، أنتقل بسرعة إلى البند التالي لتجنب إضاعة الوقت.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"لكسر الصمت، أطلب مباشرة من زميل معيّن أن يجيب.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"بدلًا من سؤال مفتوح صعب الإجابة، أطرح بعض الخيارات للاختيار بينها لتحفيز التفكير.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"أمنح الجميع بشكل طبيعي دقيقة أو دقيقتين لترتيب أفكارهم حتى يتحدثوا براحة.","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"كيف أتفاعل عندما لا تظهر نتائج أو تغيير بعد جهد كبير؟","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"أشعر بالعجز والتعب وأفقد الدافع لتغيير الوضع.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"أتحكم في مشاعري كي لا أغرق في الإحباط، وأركّز على تنفيذ التدريب والكوتشينج المقرر بإخلاص بدلًا من تحليل الأسباب.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"أراجع ما قد يكون فاتني، وأفحص البيانات والواقع الميداني بعناية لإيجاد طريقة للتغلب على الأمر.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"دون أن أتزعزع، أبحث في البيانات عن إمكانيات التغيير وأدلة التحسين، وأواصل تدريب وكوتشينج MOT.","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"كيف أتعامل مع الضغط الشديد أو النزاع؟","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"أحاول بشدة كبت مشاعري كي لا تنفجر، لكنها تظهر قليلًا على وجهي.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"أعزل مشاعري كي لا أنشغل بمصدر الضغط، وأنغمس فيما يجب أن أركّز عليه الآن.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"أغيّر مزاجي بحديث خفيف أو دعابة، أو أخفف الضغط بالتحدث بصراحة مع الزملاء.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"أهدّئ مشاعري بسرعة بطريقتي الخاصة الفعالة أو بنشاط ترفيهي، وأعتبر هذه المحنة فرصة للتعلم.","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"أثناء التدريب، أرى أن نقل المحتوى كما هو مكتوب في المادة يمنح أكبر قدر من الثقة، بدلًا من إضافة أمثلة ميدانية أو تشبيهات.","매우 그렇다":"أوافق بشدة","그렇다":"أوافق","그렇지 않다":"لا أوافق","전혀 그렇지 않다":"لا أوافق إطلاقًا","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"ما سرعة كلامي ونبرتي بشكل عام أثناء التدريب؟","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"أشرح بنبرة ثابتة لنقل المعلومات بشكل موثوق.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"أضبط سرعة كلامي العامة حتى يتمكن SE من فهم المحتوى.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"مع ضبط السرعة، أرفع صوتي أو نبرتي في المراحل المهمة للتأكيد بوضوح.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"أضبط السرعة والشدة حسب الموقف، وأتوقف لحظة عند النقاط الأساسية.","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"ما طريقتي في تقديم الملاحظات بعد RP أو كوتشينج ميداني 1:1؟","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"أتحدث براحة مع التركيز على المديح والتشجيع العاطفي حتى لا يشعر SE بالإحباط أو الضغط.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"عندما أجد ما يخالف معيار دليل MOT، أتدخل فورًا وأصحّحه.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"أقسّم بشكل منهجي كل ما تم بشكل جيد وكل ما يحتاج إلى تحسين، وأذكر كل شيء.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"في ملاحظات شاملة، أذكر أبرز نقطة قوة وأحدد بوضوح سلوكًا واحدًا ذا أولوية للتحسين في العمل.","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"في التدريب، جعل المتدربين يكررون قراءة الدليل بصوت عالٍ للتعلم السريع أهم من تبادل الآراء عبر النقاش.","매우 그렇지 않다":"لا أوافق إطلاقًا","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"عندما تكون درجات T-NPS منخفضة، كيف أحلّل الأسباب؟","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"أرى أساسًا أن نقص لطف SE أو روح الخدمة لديه هو السبب الأكبر للدرجات المنخفضة.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"أحدد السبب بمقارنة نسبة الخطوات المحددة في الدليل التي تم إغفالها أو عدم تنفيذها ميدانيًا.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"مع مراجعة آراء العملاء، أصنّف أسباب الشكاوى إلى تعامل فردي، مشكلات المنتج، بيئة الخدمة، وغيرها.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"باستبعاد العوامل البيئية التي يصعب على SE التحكم فيها، أحدد بدقة ما يمكن تحسينه في التعامل الفردي.","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"بسبب ظروف الشركة التابعة، لا أقوم بتصنيف أسباب الشكاوى.","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"كيف أتحقق مما إذا كان التدريب أو الكوتشينج قد ساهم فعلًا في تحسين مؤشرات مثل T-NPS؟","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"أتحقق مما إذا ارتفعت درجة T-NPS العامة للشركة بعد التدريب مقارنة بالشهر السابق.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"أقارن حجم تغير T-NPS العام للشركة قبل التدريب وبعده لتقدير مستوى التحسن.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"أقارن درجات T-NPS لفنيي SE المتدربين قبل التدريب بشهر وبعده بشهر.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"أتابع درجات T-NPS للمتدربين لمدة 2–3 أشهر للتأكد من استمرار أثر التحسن.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"بسبب ظروف الشركة التابعة، لا أتابع درجات T-NPS للمتدربين بعد التدريب بشكل منفصل.","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"كيف أصمم الشرائح لدعم فهم المتدربين ومشاركتهم؟","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"أبني المادة أساسًا على القراءة الجماعية بصوت عالٍ.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"أُدرج تمارين ملء الفراغات أو اختبارات قصيرة في المنتصف للتحقق من تذكر النقاط الأساسية.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"أصمم شرائح تفاعلية يصحح فيها المتدربون السلوكيات أو العبارات الخاطئة بأنفسهم ويتحققون من الإجابة عبر ملاحظات المدرب.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"أصمم شرائح يتوصل فيها المتدربون إلى الحلول عبر النقاش ثم يلخّص المدرب الاتجاه الصحيح.","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"كيف أحوّل الإرشادات أو المعلومات النصية المعقدة في الشرائح إلى عناصر مرئية؟","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"أملأ الشريحة أساسًا بنقاط مرتبة ونص متصل.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"لتحسين سهولة القراءة، أضع النصوص الطويلة أو البيانات الرقمية في جداول أو رسوم بيانية بسيطة.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"لإظهار الترتيب أو العلاقات بين المفاهيم، أنظّم المحتوى باستخدام الأسهم أو أشكال المخططات.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"في المحتوى الممثل بالأشكال أو الجداول، أغيّر حجم ولون العبارات أو الكلمات التي يجب إبرازها.","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"عند حدوث موقف مفاجئ أثناء العمل المشترك، إذا لم تكن هناك مشكلة في دوري، أميل إلى التركيز على مهام أخرى لاستغلال الوقت بكفاءة.","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"كيف أتعامل عندما يثير متدرب شكاوى لا علاقة لها بالموضوع ويعكّر الأجواء؟","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"أوضح أن ذلك لا يناسب موضوع التدريب الحالي وأواصل التدريب المُعد.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"أعترف بأنه رأي مهم، لكنني أنهي الموقف بالاتفاق على الحديث بشكل فردي في الاستراحة أو بعد التدريب.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"دون الإخلال بسير التدريب، أستمع لإحباط المتدرب وشعوره بالظلم وأتعاطف معه.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"أعترف بسبب الشكوى، لكنني أقدم نصائح واقعية للتعامل يمكن تطبيقها في هذا الموقف.","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"كيف أتواصل مع شخص يفتقر إلى الدافع للمشاركة ويبقى على الهامش أو منعزلًا؟","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"أركّز على الالتزام بجدول التدريب وتقدم المادة المعدة أكثر من مستوى مشاركة كل فرد.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"حتى لا يتخلف تمامًا، أجعله يعمل مع زميل متميز بجانبه ليواكب التطبيق العملي بشكل طبيعي.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"أتجول في منطقة التطبيق وأقترب منه بشكل ودي 1:1، وأسأله إن كان هناك ما يصعب فهمه وأقدم ملاحظات بسيطة.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"أوجهه إلى دور أو إجابة بسيطة يسهل النجاح فيها حسب مستواه، وأتفاعل معها بإيجابية لأعزز ثقته في المشاركة.","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"كيف أتعامل عندما يطلب قسم آخر أو زميل دعمًا عاجلًا أو غير معقول يصعب تلبيته فورًا؟","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"أوضح بحزم أنني مشغول بعملي وأرفض بوضوح مبينًا أن الدعم غير ممكن.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"لتجنب توتر العلاقة، أقبل الطلب وأنفذه حتى لو أثقل جدولي.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"أشرح بهدوء أولوياتي وقيودي، وأقول بلطف دون إزعاج إن الأمر صعب الآن.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"حتى إن لم أستطع القبول فورًا، أقترح بديلًا قابلًا للتعديل مثل \"سأنجزه بدلًا من ذلك قبل ظهر الغد أو أساعد بطريقة أخرى\".","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"كيف أتعامل مع شخص يقدم ملاحظات سلبية على رأيي؟","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"إذا كان النقد لا يتوافق مع الحقائق الموضوعية أو فيه تحريف، أرد عليه بحزم.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"أتجنب الانجراف وراء المشاعر السلبية والتأذي، وأقبل فقط المعلومات المفيدة من النقد.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"بدلًا من الاستياء من النبرة الحادة، أعتبر الملاحظة فرصة لمراجعة نفسي وأتقبلها.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"أشكر الشخص على نصيحته وأعتبرها فرصة للتعلم والتحسن والتقدم خطوة أخرى.","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"كيف أتعامل عندما تحدث مشكلة في جزء من العمل المشترك ليس من مسؤوليتي؟","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"أركّز على إنجاز مهام نطاقي المحدد بدقة ودون أي خطأ.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"أحدد السبب حتى لا تتفاقم المشكلة، وأجعل كل طرف يضع إجراءات في نطاقه.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"حتى لو لم يكن ذلك من نطاق عملي، أحاول حل المشكلة مع الآخرين لتحقيق الهدف المشترك.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"بدلًا من البحث عن المخطئ، أعمل بروح الملكية وأتحمل مسؤولية نتيجة المهمة المشتركة حتى النهاية.","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"عندما تكون مشاركة المتدربين منخفضة، أرى أن مراقبتهم دون ضغط أفضل من تشجيعهم على المشاركة.","매우 그렇지 않다.":"لا أوافق إطلاقًا","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"عندما أشرح لشخص آخر عملًا كنت أتولاه، ما أسلوبي في الشرح؟","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"أقرأ وثائق العمل ذات الصلة بهدوء من البداية إلى النهاية حتى لا يفوت شيء.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"بدلًا من قراءة الوثيقة كاملة، أنظّم النقاط الأساسية وأشرحها.","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"إلى جانب ملخص النقاط الأساسية، أضرب أمثلة من خبرتي الفعلية لتسهيل الفهم.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"إلى جانب مشاركة الخبرات، أشرح الخلفية المحددة للعمل ونصائح مفيدة يمكن استخدامها فورًا.","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"ما أسلوبي المعتاد في الحديث عند إبداء رأيي أو عرض خطة أمام الزملاء أو الرؤساء؟","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"لنقل كل المحتوى بهدوء، أحافظ على سرعة ونبرة ثابتة دون تغير في المشاعر.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"أراقب وجوه المستمعين لمعرفة ما إذا كانوا يتابعونني وأضبط سرعة كلامي العامة.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"مع ضبط السرعة، أرفع صوتي أو نبرتي في المراحل المهمة للتأكيد بوضوح.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"أضبط السرعة والشدة، وأتوقف لحظة قبل النقطة الأساسية التي أريد إبرازها مباشرة.","T-NPS를 확인할 때 어디까지 살펴보는가?":"إلى أي مدى أتعمق عند متابعة T-NPS؟","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"أقارن أساسًا المناطق الضعيفة أو فئات منتجات الصيانة المحددة ذات الدرجات المنخفضة بشكل لافت.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"أطابق وأقارن واحدًا تلو الآخر الدرجات الفردية لكل SE والفروق الفردية التفصيلية.","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"بدلًا من ترك الشخص يفكر بنفسه، الإشارة سريعًا إلى الخطأ والحل أسلوب ملاحظات أكثر كفاءة.","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"عند تنظيم معلومات نصية معقدة في PPT، كيف أبنيها عادة؟","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"أشرح بهدوء أولوياتي وقيودي، وأعبّر عن الرفض بنبرة لطيفة حتى لا أسيء.","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"ما أسلوبي المعتاد عندما أقدم ملاحظات على عمل زميل أو موظف أحدث مني؟","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"أحدد بوضوح ما يحتاج إلى تعديل وأشرح بصراحة ما يجب تحسينه ليكون مفهومًا.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"أبدأ بمديح خفيف حتى لا يشعر بالحرج، ثم أتحدث عما يجب تصحيحه.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"بعد مديح خفيف، عند الإشارة إلى الأخطاء أقدم أمثلة أو مراجع ليصحح بشكل صحيح.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"بدلًا من إخباره فورًا بما يجب تصحيحه، أطرح أسئلة ليفكر ويدرك أخطاءه بنفسه.","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"كيف أتفاعل عندما لا تظهر نتائج أو تغيير بعد جهد كبير؟","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"أفصل مشاعري كي لا أغرق في الإحباط، وأكرّس نفسي للتدريب والكوتشينج المقرر.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"دون أن أتأذى من الركود أو الإخفاق المؤقت، أحافظ على يقيني بأن الاستمرار في تدريب MOT بإصرار سيرفع في النهاية سلوك SE ودرجات T-NPS.","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"عند شرح العمل أو أمور أخرى لزميل، كيف أتحقق من أنه يفهم؟","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"أركّز على شرح ما أعددته بدلًا من مراقبة تعابيره أو ردود فعله.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"أثناء الشرح، أنتبه إلى ما إذا كان يومئ برأسه.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"عندما يستمع بصمت، أسأله مباشرة: \"هل هناك شيء غير واضح أو تود معرفة المزيد عنه؟\"","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"حتى لو قال إنه فهم، ألاحظ تردده أو تعبيرًا متصلبًا وأبادر بشرح الأمر بطريقة أبسط.","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"ماذا أفعل عندما لا يفهم الطرف الآخر شرحي أو يجده صعبًا؟","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"أعيد شرح ما قلته سابقًا ببطء مع التأكيد.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"أعيد الشرح مع التركيز على الأجزاء الصعبة أو أقدم معلومات إضافية.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"أحدد الأجزاء التي يجدها صعبة وأعيد الشرح بطريقة أو مثال مختلف.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"أكتشف أين ولماذا لم يفهم، وأعدّل طريقة الشرح لتناسب مستواه.","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"عندما تكون درجات T-NPS منخفضة، كيف أصنّف الأسباب؟","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"عند تصنيف الأسباب، أقرأ آراء العملاء أيضًا لأحدد ما إذا كانت الشكوى مشكلة فردية أم ترتبط بعوامل أخرى.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"مع مراعاة القيود البيئية التي لا يستطيع SE التحكم فيها، أفصل وأراجع فقط ما يتعلق بالتعامل الفردي البحت.","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"كيف أتحقق مما إذا كان التدريب أو الكوتشينج الذي نفذته الشركة قد ساهم فعلًا في تحسين مؤشرات مثل T-NPS؟","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"أقارن الفروق الشهرية في درجات T-NPS بين المراكز التي تلقت تدريبًا مكثفًا والمراكز الأخرى.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"بالنسبة لفنيي SE الذين أتموا التدريب، أقارن مباشرة ما إذا كانت درجة T-NPS بعد شهر من التدريب أعلى من قبله.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"أتابع درجات T-NPS للمتدربين على المدى الطويل حتى بعد 2–3 أشهر.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"بسبب ظروف الشركة التابعة، لا أتابع درجات T-NPS للمتدربين ولا أقدم ملاحظات لاحقة (F/UP) بعد التدريب.","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"ما الذي أستخدمه أساسًا لتحسين سهولة قراءة الشرائح وقوة إقناعها البصري؟","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"أقلل عناصر التصميم وأكتب بشكل بسيط يعتمد على النص على خلفية بيضاء.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"أستخدم قوالب PPT أساسية من الشركة أو الإنترنت وأرتّب النص بشكل منظم.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"أضع بشكل مناسب أيقونات أو رسومًا توضيحية أو صورًا مرتبطة بالعمل تتعلق بالكلمات المفتاحية التي أشرحها.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"مع وضع الأيقونات أو الصور بشكل مناسب، أستفيد جيدًا من عناصر بصرية مثل الإطارات العريضة أو التظليل.","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"عند إعداد مواد تدريبية أو مستندات باستخدام PPT، ما الأقرب إلى طريقتي المعتادة؟","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"أضبط حجم الأشكال والمسافات بينها واحدًا تلو الآخر بالفأرة وأعمل خطوة بخطوة بالوظائف الأساسية، لذا يستغرق الأمر بعض الوقت.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"أختصر وقت العمل باستخدام اختصارات أساسية يعرفها الجميع مثل النسخ (Ctrl+C) واللصق (Ctrl+V).","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"أستخدم بإتقان نسخ التنسيق وشريط أدوات الوصول السريع (QAT) واختصارات محاذاة/توزيع الأشكال لاختصار الوقت كثيرًا.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"لتخطيطات الشرائح المتكررة، أنشئ بنفسي قوالب رئيسية أو نماذج للعمل بسرعة مع الحفاظ على اتساق المستند كله.","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"عند الشرح لزميل، تسليم دليل الإرشادات الرسمي كما هو هو أكثر طرق الشرح أمانًا وفعالية.","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"كيف أتعامل عندما يتحدث زميل في أمر لا علاقة له بسياق الحديث؟","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"لا أتفاعل كثيرًا مع الحديث المفاجئ وأعيد الحديث بهدوء إلى الموضوع السابق.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"أنبهه إلى أن سياق الحديث انقطع، ثم أعيد الحديث بسرعة إلى الموضوع الأصلي.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"أجاريه ببضع كلمات حتى لا يشعر بالحرج، ثم أعود بشكل طبيعي إلى الموضوع الأصلي.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"أجد نقطة ربط بين ما طرحه والموضوع الأصلي، فأعود إليه دون انقطاع تسلسل الحديث.","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"كيف أتعامل مع عضو لا يشارك بفعالية ويبقى على الهامش في مشروع فريق أو عمل مشترك؟","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"أركّز على دوري الخاص بدلًا من الانشغال بمشاركة الآخرين.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"بدلًا من التدخل بنفسي، أُطلع قائد الفريق أو المسؤول بهدوء على الوضع وأترك له الحل.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"أقترب منه بودّ كزميل وأسأله بهدوء إن كان يواجه صعوبات في العمل.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"أشارك المستند أو المادة قيد العمل ببساطة وأطلب رأيه بشكل طبيعي: \"هل يمكنك إلقاء نظرة على هذا الجزء؟\"","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"عند تصميم PPT، نقل النص نفسه بوضوح ودون زوائد أكثر فعالية من إضافة عناصر بصرية.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"بدلًا من الاستياء من النبرة الحادة، أعتبر الملاحظة فرصة لمراجعة نفسي وأتقبلها بكل رضا.","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"كيف أتعامل عندما تحدث مشكلة غير متوقعة أثناء العمل المشترك؟","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"بدلًا من البحث عن المخطئ، أعمل بروح الملكية وأتحمل مسؤولية نتيجة المهمة حتى النهاية.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"بسبب ظروف الشركة التابعة، لا أتابع درجات T-NPS للمتدربين ولا أقدم ملاحظات بعد التدريب بشكل منفصل.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"أعيد الشرح مع التركيز على الأجزاء الصعبة.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"أغيّر مزاجي بحديث خفيف أو دعابة، أو أخفف الضغط بالتحدث بصراحة مع الزملاء.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"أهدّئ مشاعري بسرعة بطريقتي الخاصة الفعالة أو بنشاط ترفيهي، وأعتبر هذه المحنة فرصة للتعلم.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"حتى لو قال إنه فهم، ألاحظ تردده أو تعبيرًا متصلبًا وأبادر بشرح الأمر بطريقة أبسط."},"es":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"¿Cómo explico a los participantes el contenido principal de una diapositiva?","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"Leo con atención el texto de la diapositiva para no omitir nada importante.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"Resumo el texto de la diapositiva centrándome en los puntos clave.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"Uso analogías o ejemplos concretos adaptados a la realidad del campo para que sea fácil de entender.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"Mientras uso analogías o ejemplos, cuando es necesario recreo brevemente acciones o frases reales de atención al cliente.","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"Durante una clase, ¿hacia dónde miro y cómo me muevo?","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"Miro principalmente la pantalla o el monitor para no perder el contenido.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"Me resulta algo incómodo mirar a los ojos a los participantes, así que miro sobre todo al fondo del aula y me quedo en un lugar fijo.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"Hago contacto visual con los participantes, pero me centro sobre todo en quienes reaccionan y responden bien.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"Ajusto mis movimientos y reparto la mirada de forma equilibrada para que ningún participante se sienta excluido.","T-NPS를 확인할 때 나의 방식은?":"¿Cómo reviso el T-NPS?","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"Me fijo principalmente en la puntuación media general de la subsidiaria y su tendencia.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"Comparo las puntuaciones medias de los centros y me centro en los de menor rendimiento.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"Analizo el T-NPS de las regiones con puntuación baja o de grupos de productos de reparación concretos para identificar las principales debilidades y fortalezas.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"Comparo y analizo en detalle los factores débiles de cada centro y las puntuaciones y desviaciones individuales de sus SE para definir fortalezas y áreas de mejora concretas.","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"Por las condiciones de mi subsidiaria, no realizo tareas de revisión del T-NPS.","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"¿Cómo identifico factores de mejora concretos para mi subsidiaria a partir de datos?","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"Tomo la propia tendencia general del T-NPS de la subsidiaria como la dirección principal de mejora.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"Reviso las cifras por categoría y selecciono como factor de mejora la categoría de queja clave con menor puntuación.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"Leo con atención las puntuaciones de los SE y los comentarios de queja de los clientes para identificar factores de mejora prácticos.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"Combino T-NPS, comentarios de clientes e indicadores históricos de los SE para averiguar por qué se repiten las quejas.","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"Por las condiciones de mi subsidiaria, no analizo datos para identificar factores de mejora.","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"¿Cómo utilizo en mi subsidiaria el contenido formativo de HQ?","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"Utilizo tal cual el contenido en inglés proporcionado por HQ.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"Mantengo la estructura y el contenido de HQ, traduzco el texto al idioma local y lo aplico rápidamente en la formación.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"Modifico el contenido y la redacción de diapositivas concretas para adaptarlos a la situación y los casos de mi subsidiaria.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"A partir del contenido de HQ, desarrollo mi propio contenido adaptado a la situación de la subsidiaria y a las características de los participantes.","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"Al crear un PPT, ¿cómo organizo el orden y el flujo de las diapositivas?","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"Escribo el contenido en las diapositivas en el orden en que se me ocurre.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"Divido el contenido en temas generales y ordeno las diapositivas según esos temas.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"Conecto las diapositivas con un flujo lógico de causa y efecto, como problema → análisis de causas → solución.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"Con una estructura que presenta primero la conclusión, organizo el PPT para que su mensaje clave fluya como una sola historia.","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"¿Cómo respondo cuando un participante expresa dificultades u opiniones negativas sobre el contenido o enfoque de la formación?","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"Explico con calma, por principio, que el contenido de la formación debe cumplirse para mantener criterios y resultados coherentes.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"Empatizo brevemente con sus dificultades reales y propongo rápidamente un acuerdo sencillo que pueda aplicarse de inmediato.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"Escucho hasta el final su frustración y rechazo, empatizo y luego buscamos y presentamos juntos alternativas prácticas y concretas.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"Empatizo compartiendo mis propias experiencias y le convenzo, desde su perspectiva, de por qué esta formación es necesaria.","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"¿Cómo respondo cuando hago una pregunta en una reunión y mis compañeros guardan silencio?","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"Si el silencio se alarga, paso rápidamente al siguiente punto para no perder tiempo.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"Para romper el silencio, pido directamente a un compañero concreto que responda.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"En lugar de una pregunta abierta difícil de responder, ofrezco algunas opciones para elegir y así estimular la reflexión.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"Doy de forma natural 1–2 minutos a cada uno para ordenar sus ideas y conversar con comodidad.","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"¿Cómo reacciono cuando no hay resultados ni cambios tras haber puesto mucho esfuerzo en algo?","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"Me siento impotente y cansado, y pierdo la motivación para cambiar la situación.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"Controlo mis emociones para no hundirme en la frustración y me centro en impartir fielmente la formación y el coaching previstos en lugar de analizar causas.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"Reviso si se me ha escapado algo y examino con detalle los datos y la situación en campo para encontrar cómo superarlo.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"Sin dejarme afectar, busco con datos posibilidades de cambio y evidencias de mejora, y continúo con la formación y el coaching MOT.","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"¿Cómo afronto el estrés intenso o los conflictos?","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"Intento contener mis emociones para que no exploten, pero se nota un poco en mi cara.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"Bloqueo mis emociones para no prestar más atención al factor de estrés y me concentro en lo que debo hacer ahora.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"Cambio de ánimo con una charla ligera o con humor, o me desahogo hablando abiertamente con compañeros.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"Calmo rápidamente mis emociones con mi propia forma eficaz de desconectar o con actividades de ocio, y tomo la dificultad como una oportunidad de aprender.","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"Al impartir una clase, creo que transmitir el contenido tal como está escrito genera más confianza que añadir ejemplos del campo o analogías.","매우 그렇다":"Muy de acuerdo","그렇다":"De acuerdo","그렇지 않다":"En desacuerdo","전혀 그렇지 않다":"Totalmente en desacuerdo","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"¿Cómo son en general mi ritmo y tono al hablar durante una clase?","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"Explico con un tono constante para transmitir la información de forma fiable.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"Ajusto mi ritmo general para que los SE puedan entender el contenido.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Mientras ajusto el ritmo, en los pasos clave subo el volumen o el tono para enfatizar claramente.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"Ajusto el ritmo y la intensidad según la situación y hago una breve pausa en los puntos clave.","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"¿Cómo doy feedback después de un RP o de un coaching 1:1 en campo?","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"Hablo de forma relajada, centrándome en elogios y ánimo para que el SE no se sienta intimidado ni estresado.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"Si detecto algo que se aparta del estándar del manual MOT, intervengo y lo corrijo de inmediato.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"Repaso de forma sistemática todo, tanto lo que se hizo bien como todos los puntos a mejorar.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"En un feedback general, menciono la mayor fortaleza y transmito con claridad un comportamiento prioritario a mejorar en el trabajo.","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"En la formación, es más importante que los participantes lean el manual en voz alta repetidamente para aprender rápido que compartir ideas mediante el debate.","매우 그렇지 않다":"Totalmente en desacuerdo","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"Cuando las puntuaciones T-NPS son bajas, ¿cómo analizo las causas?","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"Básicamente considero que la falta de amabilidad o de actitud de servicio del SE es la causa principal.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"Identifico la causa comparando la tasa de pasos del manual omitidos o no ejecutados en campo.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"Revisando también los comentarios de los clientes, clasifico las causas de queja en atención individual, problemas del producto, entorno de servicio, etc.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"Excluyendo los factores del entorno que el SE no puede controlar, identifico concretamente lo que se puede mejorar en la atención individual.","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"Por las condiciones de mi subsidiaria, no clasifico las causas de las quejas.","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"¿Cómo verifico si la formación o el coaching contribuyeron realmente a mejorar indicadores como el T-NPS?","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"Compruebo si, tras la formación, la puntuación T-NPS general de la subsidiaria subió respecto al mes anterior.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"Comparo la variación del T-NPS general de la subsidiaria antes y después de la formación para estimar el nivel de mejora.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"Comparo las puntuaciones T-NPS de los SE formados un mes antes y un mes después de la formación.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"Sigo las puntuaciones T-NPS de los participantes durante 2–3 meses para ver si la mejora se mantiene.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"Por las condiciones de mi subsidiaria, no hago un seguimiento aparte del T-NPS de los participantes tras la formación.","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"¿Cómo diseño las diapositivas para apoyar la comprensión y la participación?","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"Construyo el material principalmente en torno a que los participantes lean en voz alta juntos.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"Inserto ejercicios para rellenar huecos o pruebas cortas a mitad para comprobar si recuerdan los puntos clave.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"Creo diapositivas participativas en las que los participantes corrigen comportamientos o frases erróneas y comprueban la respuesta con el feedback del instructor.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"Creo diapositivas en las que se llega a soluciones mediante debate y el feedback del instructor resume la dirección correcta.","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"¿Cómo visualizo directrices o información de texto compleja en las diapositivas?","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"Lleno la diapositiva principalmente con viñetas ordenadas y texto corrido.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"Para mejorar la legibilidad, pongo textos largos o datos numéricos en tablas o gráficos básicos.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"Para mostrar el orden o la relación entre conceptos, estructuro el contenido con flechas o formas de diagrama.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"Dentro del contenido esquematizado con formas o tablas, cambio el tamaño y el color de frases o palabras que deben destacarse.","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"Cuando surge algo inesperado en una colaboración, si mi parte no tiene problemas, tiendo a centrarme en otras tareas para aprovechar el tiempo.","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"¿Cómo respondo cuando un participante plantea quejas ajenas al tema y enrarece el ambiente?","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"Digo que no corresponde al tema actual y continúo con la formación preparada.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"Reconozco que es una opinión importante, pero cierro el tema acordando hablarlo individualmente en el descanso o al final.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"Sin interrumpir el ritmo de la clase, escucho y empatizo con la frustración y el sentimiento de injusticia del participante.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"Reconozco la causa de la queja, pero ofrezco consejos realistas de atención aplicables a esa situación.","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"¿Cómo me comunico con alguien poco motivado que se mantiene al margen o queda excluido?","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"Me centro en seguir el calendario y el avance del material preparado más que en la participación individual.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"Para que no se quede totalmente atrás, lo emparejo con un compañero competente a su lado para que siga la práctica de forma natural.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"Recorro el área de práctica, me acerco de forma informal 1:1, pregunto si hay algo difícil de entender y doy un feedback ligero.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"Le guío hacia un rol o una respuesta sencilla en la que pueda tener éxito, respondo positivamente y refuerzo su confianza para participar.","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"¿Cómo respondo cuando otro departamento o un compañero pide un apoyo urgente o poco razonable difícil de atender en ese momento?","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"Explico con firmeza que estoy ocupado con mi trabajo y rechazo claramente, indicando que no puedo ayudar.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"Para evitar tensiones, acepto la petición y la atiendo aunque sobrecargue mi agenda.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"Explico con calma mis prioridades y limitaciones y digo, sin ofender, que ahora mismo es difícil.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"Aunque no pueda aceptarlo de inmediato, ofrezco una alternativa ajustable como \"puedo tenerlo mañana por la tarde o ayudar de otra forma\".","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"¿Cómo respondo ante alguien que da feedback negativo sobre mi opinión?","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"Si la crítica no se ajusta a los hechos objetivos o está distorsionada, la rebato con firmeza.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"Evito que las emociones negativas me hieran y acepto solo la información útil de la crítica.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"En lugar de molestarme por el tono duro, tomo la observación como ocasión para reflexionar y la acepto.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"Agradezco el consejo y lo aprovecho como oportunidad de aprendizaje y mejora para dar un paso más.","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"¿Cómo respondo cuando surge un problema en una parte de la colaboración que no es responsabilidad mía?","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"Me centro en realizar con diligencia y sin un solo error las tareas de mi área claramente asignada.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"Identifico la causa para que el problema no crezca y hago que cada uno defina medidas en su propia área.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"Aunque no sea mi área, intento resolver el problema juntos para lograr el objetivo común.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"En lugar de buscar culpables, asumo con sentido de responsabilidad el resultado de la tarea conjunta hasta el final.","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"Cuando la participación es baja, creo que es mejor observar sin presionar que animar a participar.","매우 그렇지 않다.":"Totalmente en desacuerdo","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"Cuando tengo que explicar a otra persona un trabajo que antes llevaba yo, ¿cuál es mi estilo?","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"Leo con calma los documentos de trabajo de principio a fin para que no se omita nada.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"En lugar de leer todo el documento, organizo y explico los puntos clave.","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"Junto con un resumen clave, pongo ejemplos de mi experiencia real para que sea fácil de entender.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"Además de compartir experiencias, explico el contexto concreto del trabajo y consejos útiles aplicables de inmediato.","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"¿Cuál es mi estilo habitual al dar mi opinión o presentar un plan ante compañeros o superiores?","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"Para transmitir todo con calma, mantengo un ritmo y tono constantes sin cambios emocionales.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"Observo las caras de los oyentes para ver si me siguen y ajusto mi ritmo general.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"Mientras ajusto el ritmo, en los pasos clave subo el volumen o el tono para enfatizar claramente.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"Ajusto el ritmo y la intensidad, y hago una breve pausa justo antes del punto clave que quiero destacar.","T-NPS를 확인할 때 어디까지 살펴보는가?":"¿Hasta dónde reviso al consultar el T-NPS?","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"Comparo principalmente las regiones débiles o los grupos de productos de reparación con puntuaciones especialmente bajas.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"Cotejo una por una las puntuaciones individuales de cada SE y sus desviaciones detalladas.","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"En lugar de dejar que la persona lo piense por sí misma, señalar rápido el error y la solución es una forma de feedback más eficiente.","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"Al organizar información de texto compleja en un PPT, ¿cómo la estructuro normalmente?","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"Explico con calma mis prioridades y limitaciones y rechazo con un tono amable para no ofender.","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"¿Cuál es mi estilo habitual cuando debo dar feedback sobre el trabajo de un compañero o subordinado?","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"Señalo claramente lo que hay que corregir y explico de forma directa lo que debe mejorar para que se entienda.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"Primero hago un elogio ligero para que no se sienta incómodo y luego hablo de lo que hay que corregir.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"Tras un elogio ligero, al señalar errores doy ejemplos o referencias para que pueda corregir bien.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"En lugar de decir enseguida qué corregir, hago preguntas para que piense y se dé cuenta del error por sí mismo.","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"¿Cómo reacciono cuando no hay resultados ni cambios tras haber puesto mucho esfuerzo en algo?","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"Separo mis emociones para no hundirme en la frustración y me dedico a la formación y el coaching previstos.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"Sin desanimarme por estancamientos o fracasos temporales, mantengo la convicción de que, con formación MOT constante, el comportamiento de los SE y el T-NPS acabarán mejorando.","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"Al explicar trabajo u otros asuntos a un compañero, ¿cómo compruebo si me entiende?","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"Me centro en explicar lo que he preparado más que en observar sus gestos o reacciones.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"Mientras explico, observo si la otra persona asiente.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"Cuando la otra persona solo escucha en silencio, pregunto directamente: \"¿Hay algo que no quede claro o quieras saber?\"","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"Aunque diga que lo entiende, noto su vacilación o un gesto tenso y me adelanto a explicarlo de forma más sencilla.","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"¿Qué hago cuando la otra persona no entiende mi explicación o le resulta difícil?","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"Repito despacio lo que expliqué antes y lo enfatizo.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"Vuelvo a explicar centrándome en lo que le cuesta entender o doy información adicional.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"Identifico qué le resulta difícil y lo explico de nuevo con otro enfoque o ejemplo.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"Averiguo dónde y por qué no lo entendió y adapto mi explicación a su nivel.","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"Cuando las puntuaciones T-NPS son bajas, ¿cómo clasifico las causas?","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"Al clasificar causas, leo también los comentarios de los clientes para ver si la queja es un problema individual o intervienen otros factores.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"Teniendo en cuenta las limitaciones del entorno que el SE no puede controlar, separo y reviso solo lo relacionado puramente con la atención individual.","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"¿Cómo verifico si la formación o el coaching de la subsidiaria contribuyó realmente a mejorar indicadores como el T-NPS?","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"Comparo las diferencias mensuales de T-NPS entre centros con formación intensiva y centros sin ella.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"Para los SE formados, compruebo directamente si su T-NPS un mes después de la formación es mayor que antes.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"Sigo a largo plazo las puntuaciones T-NPS de los participantes, incluso 2–3 meses después.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"Por las condiciones de mi subsidiaria, no hago un seguimiento aparte del T-NPS ni feedback posterior (F/UP) tras la formación.","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"¿Qué uso principalmente para mejorar la legibilidad y la persuasión visual de las diapositivas?","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"Minimizo los elementos de diseño y escribo de forma sencilla, centrada en texto, sobre fondo blanco.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"Uso plantillas básicas de PPT de la empresa o de internet y coloco el texto de forma ordenada.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"Coloco adecuadamente iconos, ilustraciones o fotos de trabajo relacionadas con las palabras clave que quiero explicar.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"Además de colocar iconos o fotos, aprovecho bien elementos visuales como recuadros gruesos o resaltados.","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"Al crear materiales o documentos en PPT, ¿qué se acerca más a mi forma habitual de trabajar?","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"Ajusto con el ratón el tamaño y el espaciado de las formas uno a uno y trabajo paso a paso con funciones básicas, por lo que suelo tardar.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"Reduzco el tiempo de trabajo con atajos básicos que todos conocen, como copiar (Ctrl+C) y pegar (Ctrl+V).","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"Uso con soltura Copiar formato, la barra de herramientas de acceso rápido (QAT) y atajos de alinear/distribuir formas para reducir mucho el tiempo.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"Para diseños de diapositivas recurrentes, creo mis propios patrones o plantillas para trabajar rápido manteniendo la coherencia del documento.","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"Al explicar algo a un compañero, entregar tal cual la guía oficial es la forma más segura y eficaz de explicar.","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"¿Cómo respondo cuando un compañero habla de algo ajeno al hilo de la conversación?","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"No reacciono mucho al comentario inesperado y vuelvo discretamente al tema anterior.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"Señalo que se ha perdido el hilo para que lo note y vuelvo rápidamente al tema original.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"Respondo con unas palabras para que no resulte incómodo y vuelvo con naturalidad al tema original.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"Busco un punto de conexión entre lo que dijo y el tema original para retomarlo sin cortar el hilo de la conversación.","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"¿Cómo respondo cuando, en un proyecto o colaboración, un miembro no participa activamente y se queda al margen?","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"Me centro en mi propio rol más que en si los demás participan.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"En lugar de intervenir yo, comparto discretamente la situación con el jefe de equipo o líder y le dejo resolverlo.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"Me acerco con naturalidad como compañero y le pregunto discretamente si tiene alguna dificultad en el trabajo.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"Comparto de forma informal el material o documento en curso y le pido su opinión con naturalidad: \"¿Podrías echarle un vistazo a esta parte?\"","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"Al diseñar un PPT, es más eficaz transmitir solo el texto con claridad, sin adornos, que añadir elementos visuales.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"En lugar de molestarme por el tono duro, tomo la observación como ocasión para reflexionar y la acepto de buen grado.","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"¿Cómo respondo cuando surge un problema inesperado durante una colaboración?","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"En lugar de buscar culpables, asumo con sentido de responsabilidad el resultado de la tarea hasta el final.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"Por las condiciones de mi subsidiaria, no hago un seguimiento aparte del T-NPS ni feedback de los participantes tras la formación.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"Vuelvo a explicar centrándome en lo que le cuesta entender.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"Cambio de ánimo con una charla ligera o con humor, o me desahogo hablando abiertamente con compañeros.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"Calmo rápidamente mis emociones con mi propia forma eficaz de desconectar o con actividades de ocio, y tomo la dificultad como una oportunidad de aprender.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"Aunque diga que lo entiende, noto su vacilación o un gesto tenso y me adelanto a explicarlo de forma más sencilla."},"fr":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"Comment j'explique aux apprenants le contenu principal d'une diapositive ?","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"Je lis attentivement le texte de la diapositive pour ne rien oublier d'important.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"Je résume le texte de la diapositive en me concentrant sur les points clés.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"J'utilise des analogies ou des exemples concrets adaptés au terrain pour faciliter la compréhension.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"Tout en utilisant analogies ou exemples, je reproduis brièvement, si besoin, des gestes ou phrases réels d'accueil client.","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"Pendant une formation, où se porte mon regard et comment je bouge ?","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"Je regarde surtout l'écran ou le moniteur pour ne pas perdre le fil du support.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"Croiser le regard des apprenants me gêne un peu ; je regarde surtout le fond de la salle et reste à une place fixe.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"Je regarde les apprenants, mais surtout ceux qui réagissent et participent bien.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"J'ajuste mes déplacements et répartis mon regard de façon égale pour qu'aucun apprenant ne se sente exclu.","T-NPS를 확인할 때 나의 방식은?":"Comment je consulte le T-NPS ?","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"Je regarde surtout la moyenne globale de la filiale et son évolution.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"Je compare les moyennes des centres et me concentre sur les centres les plus faibles.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"J'analyse le T-NPS des régions faibles ou de groupes de produits de réparation spécifiques pour identifier les principales faiblesses et forces.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"Je compare et analyse en détail les facteurs faibles de chaque centre et les scores et écarts individuels de ses SE pour dégager forces et axes d'amélioration concrets.","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"En raison des conditions de ma filiale, je ne consulte pas le T-NPS.","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"Comment j'identifie des facteurs d'amélioration concrets pour ma filiale à partir des données ?","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"Je prends l'évolution globale du T-NPS de la filiale elle-même comme axe principal d'amélioration.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"J'examine les chiffres par rubrique et retiens comme facteur d'amélioration la catégorie de réclamation la plus mal notée.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"Je lis attentivement les scores des SE et les commentaires de réclamation des clients pour dégager des facteurs d'amélioration concrets.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"Je croise T-NPS, commentaires clients et indicateurs passés des SE pour comprendre pourquoi les réclamations se répètent.","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"En raison des conditions de ma filiale, je n'ana
