<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOT 강사 역량 스타일 진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--red:#A50034;--red2:#D6164F;--pink:#FDF0F4;--gray:#6B6B6B;--line:#ECE3E6;--fs:clamp(14px,0.55vw + 10px,20px)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:radial-gradient(circle at 10% 0%,#FCE4EC 0,transparent 40%),radial-gradient(circle at 100% 100%,#F8E1E8 0,transparent 45%),#F8F5F6;color:#222;min-height:100vh;letter-spacing:-.01em}
header{background:linear-gradient(110deg,#6E0020 0%,#8B0029 25%,var(--red) 60%,#C81048 100%);color:#fff;padding:.85rem 2rem;display:flex;align-items:center;gap:.85rem;box-shadow:0 4px 20px rgba(165,0,52,.22);border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:20}
header .logo{width:2.35rem;height:2.35rem;border-radius:12px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.32);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:all .2s ease;flex-shrink:0}
header .logo:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
header .logo svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
header .t{font-weight:750;font-size:1.05rem;flex:1;letter-spacing:-.015em;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.lang{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:flex-end}
.lang button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:2rem;padding:.3rem .75rem;font:inherit;font-size:.72rem;cursor:pointer;transition:.15s}
.lang button:hover{background:rgba(255,255,255,.18)}
.lang button.on{background:#fff;color:var(--red);font-weight:700}
.wrap{width:min(92vw,1280px);margin:2rem auto;padding:0}
.card{background:#fff;border-radius:1.4rem;box-shadow:0 10px 40px rgba(165,0,52,.10);padding:clamp(22px,3.2vw,64px);position:relative;overflow:hidden;animation:fade .35s ease}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--red),var(--red2),#F08AA6)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.badge{display:inline-flex;align-items:center;gap:6px;width:max-content;margin:0 auto .9rem;background:linear-gradient(135deg,#FFF2F6 0%,#FFE4EC 100%);color:var(--red);font-weight:800;font-size:.78rem;padding:.42rem 1.15rem;border-radius:2rem;letter-spacing:.08em;border:1px solid rgba(165,0,52,.18);box-shadow:0 3px 12px rgba(165,0,52,.08)}
.badge-star{color:var(--red)}
.start-header{position:relative;z-index:1;text-align:center;margin-bottom:.4rem}
#start h1{color:#1a1a1a;background:linear-gradient(135deg,#212529 20%,#A50034 85%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:clamp(26px,2.9vw,44px);text-align:center;margin:.3rem 0 .9rem;font-weight:800;letter-spacing:-.03em;line-height:1.35;position:relative;z-index:1}
.title-divider{width:48px;height:4px;background:linear-gradient(90deg,var(--red),#FF6B8B);border-radius:4px;margin:0 auto 1.5rem;box-shadow:0 2px 8px rgba(165,0,52,.28);position:relative;z-index:1}
.start-deco{position:absolute;border-radius:50%;pointer-events:none;filter:blur(45px);opacity:.35;z-index:0}
.start-deco.d1{width:220px;height:220px;background:radial-gradient(circle,rgba(255,182,193,.7),transparent 70%);top:-60px;right:-40px}
.start-deco.d2{width:180px;height:180px;background:radial-gradient(circle,rgba(255,225,235,.8),transparent 70%);bottom:-40px;left:-30px}
h1{color:var(--red);font-size:clamp(24px,2.4vw,46px);text-align:center;margin-bottom:1.2rem;font-weight:800;letter-spacing:-.02em}
.desc{background:var(--pink);border-left:5px solid var(--red);border-radius:.8rem;padding:1.1rem 1.4rem;line-height:1.8;font-size:.95rem;color:#333;word-break:keep-all}
.desc{display:flex;flex-direction:column;gap:.55rem;background:linear-gradient(135deg,#FFF5F8,#FDEBF1);border:1px solid #F6D3DE;border-left:5px solid var(--red)}
.desc .dl{display:flex;gap:.6rem;align-items:flex-start;justify-content:center;text-align:center}
.desc .em{flex:none;font-size:1.15rem;line-height:1.55}
.desc .hl span:last-child{color:var(--red);font-weight:700;background:linear-gradient(transparent 62%,#FFD6E2 62%);padding:0 .1rem}
.desc .sm{color:var(--gray);font-size:.85rem;background:rgba(255,255,255,.7);border-radius:.6rem;padding:.55rem .75rem;margin-top:.15rem}
.desc .sm .em{font-size:1rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin:1.8rem 0}
.form label{font-weight:700;font-size:.95rem;color:var(--red);display:block;margin-bottom:.4rem}
.form input{width:100%;padding:.95rem 1.05rem;border:1.5px solid var(--line);border-radius:.7rem;font:inherit;font-size:1.02rem;outline:none;background:#FCFBFB;transition:.15s}
.form input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(165,0,52,.08)}
.q0{text-align:center;margin-top:.5rem}
.q0 h3{font-size:1.15rem;margin-bottom:1.1rem;font-weight:700}
.yn{display:flex;gap:1rem;justify-content:center}
.btn{border:none;cursor:pointer;border-radius:.8rem;font:inherit;font-size:1rem;font-weight:700;padding:.85rem 2.4rem;transition:.18s}
.yn .btn{background:#fff;border:2px solid var(--red);color:var(--red);min-width:9rem}
.yn .btn:hover{background:var(--red);color:#fff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(165,0,52,.25)}
.err{color:var(--red2);text-align:center;font-size:.85rem;margin-top:.8rem;min-height:1.1rem}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.85rem;color:var(--gray)}
.top b{color:var(--red)}
.bar{height:.5rem;background:#F3E4E9;border-radius:1rem;overflow:hidden;margin-bottom:2rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#F05A7E);transition:width .35s;border-radius:1rem}
.qno{text-align:center;color:#fff;background:var(--red);width:max-content;margin:0 auto .8rem;padding:.25rem .9rem;border-radius:2rem;font-weight:800;font-size:.85rem}
.qtext{text-align:center;font-size:clamp(18px,1.6vw,32px);font-weight:700;line-height:1.5;margin:0 auto 2rem;max-width:52rem;word-break:keep-all}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.opt{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:1.2rem 1rem;font-size:.9rem;line-height:1.65;cursor:pointer;min-height:9.5rem;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;transition:.18s;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.opt:hover{border-color:var(--red);background:#FFF7F9;transform:translateY(-3px);box-shadow:0 10px 22px rgba(165,0,52,.12)}
.opt.sel{border-color:var(--red);background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.opts.rel .opt{min-height:4.5rem;font-size:1rem;font-weight:700}
.opts.dis .opt{opacity:.35;pointer-events:none}
.extra{margin-top:1.3rem;display:flex;align-items:center;gap:.6rem;justify-content:center;background:#FAFAFA;border:1.5px dashed #CFCFCF;border-radius:.8rem;padding:.85rem 1.1rem;cursor:pointer;font-size:.88rem;color:#444;word-break:keep-all}
.extra input{width:1.1rem;height:1.1rem;accent-color:var(--red);cursor:pointer;flex:none}
.nav{display:flex;justify-content:space-between;margin-top:2rem;gap:1rem}
.back{background:#fff;border:1.5px solid #CBCBCB;color:#555}
.back:hover{border-color:var(--red);color:var(--red)}
.next{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 16px rgba(165,0,52,.25)}
.next:hover:not(:disabled){transform:translateY(-2px)}
.next:disabled{background:#DADADA;box-shadow:none;cursor:not-allowed}
.rhead{text-align:center;margin-bottom:1.5rem}
.rhead .who{color:var(--gray);font-size:.95rem}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:center}
.radar{width:100%;max-width:34rem;display:block;margin:auto}
.best{text-align:center;background:var(--pink);border-radius:1.2rem;padding:1.2rem}
.best img{width:100%;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.best .tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;border-radius:2rem;padding:.4rem 1.1rem;margin:.9rem 0 .3rem;font-size:.95rem}
.best .sc{color:var(--gray);font-size:.88rem}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:2rem;font-size:.92rem;border-radius:.8rem;overflow:hidden;border:1px solid var(--line)}
th{background:var(--red);color:#fff;padding:.75rem;font-weight:700}
td{padding:.75rem;border-top:1px solid var(--line);text-align:center}
tr.top1 td{background:var(--pink);font-weight:700;color:var(--red)}
.note{font-size:.8rem;color:var(--gray);margin-top:.7rem}
footer{text-align:center;color:#999;font-size:.72rem;padding:1.5rem}
[dir=rtl] .desc{border-left:none;border-right:5px solid var(--red)}
@media(max-width:900px){.opts{grid-template-columns:1fr 1fr}.rgrid,.form{grid-template-columns:1fr}header{flex-wrap:wrap;padding:.8rem 1rem}.lang{width:100%;justify-content:center}}
@media(max-width:480px){.opts{grid-template-columns:1fr}.opt{min-height:auto}.yn .btn{min-width:7rem;padding:.8rem 1.4rem}}
.modal{position:fixed;inset:0;background:rgba(30,0,10,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:1rem;animation:fade .2s}
.mbox{background:#fff;border-radius:1.2rem;max-width:30rem;width:100%;padding:2rem 1.8rem;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);border-top:6px solid var(--red)}
.mic{font-size:2.6rem;margin-bottom:.4rem}
.mbox h3{color:var(--red);font-size:1.2rem;margin-bottom:.7rem}
.mbox p{font-size:.92rem;line-height:1.7;color:#444;word-break:keep-all;white-space:pre-line}
.mbtns{display:flex;gap:.7rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.mbtns .btn{padding:.75rem 1.4rem;font-size:.92rem}
#qnav.last{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#qnav.last .back{justify-self:start}
#qnav.last .next{grid-column:2;font-size:1.15rem;padding:1rem 3.6rem;border-radius:2.5rem;box-shadow:0 10px 26px rgba(165,0,52,.35)}
#qnav.last .next:not(:disabled){animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(165,0,52,.35)}50%{box-shadow:0 10px 26px rgba(165,0,52,.35),0 0 0 10px rgba(165,0,52,.12)}}
@media(max-width:480px){#qnav.last{grid-template-columns:1fr}#qnav.last .next{grid-column:1;grid-row:1;justify-self:center}#qnav.last .back{justify-self:center}}
.lastTag{display:none}
#qnav.last .lastTag{display:inline-block;grid-column:3;justify-self:end;background:var(--pink);color:var(--red);font-weight:700;font-size:.85rem;padding:.45rem 1rem;border-radius:2rem}
@media(max-width:480px){#qnav.last .lastTag{grid-column:1;justify-self:center}}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:2rem}
.fbc{border-radius:1rem;padding:1.3rem 1.4rem;line-height:1.75;font-size:.93rem;word-break:keep-all}
.fbc h4{font-size:1.05rem;margin-bottom:.6rem}
.fbc p+p{margin-top:.5rem}
.fbc.s{background:linear-gradient(135deg,#FFF1F5,#FCE3EB);border:1px solid #F4C9D6}
.fbc.s h4,.fbc.s b{color:var(--red)}
.fbc.w{background:linear-gradient(135deg,#F3FAF5,#E6F4EA);border:1px solid #CBE6D3}
.fbc.w h4,.fbc.w b{color:#2E7D4F}
@media(max-width:900px){.fb{grid-template-columns:1fr}}
.rhero{position:relative;overflow:hidden;margin:calc(-1*clamp(22px,3.2vw,64px)) calc(-1*clamp(22px,3.2vw,64px)) 0;padding:clamp(28px,3.5vw,60px) 1.5rem clamp(30px,3.5vw,56px);text-align:center;color:#fff;background:linear-gradient(120deg,#6E0022,var(--red) 45%,#E0335F)}
.rhero i{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.rhero .c1{width:22rem;height:22rem;top:-11rem;left:-6rem}
.rhero .c2{width:14rem;height:14rem;bottom:-7rem;right:-3rem;background:rgba(255,255,255,.12)}
.rhero .c3{width:6rem;height:6rem;top:1.2rem;right:18%;border:2px solid rgba(255,255,255,.25);background:none}
.rhero h1{color:#fff;margin:.3rem 0 1rem;text-shadow:0 4px 16px rgba(0,0,0,.18);position:relative}
.rbadge{position:relative;display:inline-block;font-size:.72rem;letter-spacing:.2em;font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:2rem;padding:.25rem .9rem}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);border-radius:2rem;padding:.3rem .9rem;font-size:.82rem;font-weight:600}
.reveal{text-align:center;font-size:clamp(17px,1.5vw,28px);font-weight:700;color:#333;margin:1.6rem auto 1.4rem;word-break:keep-all}
.reveal:empty{display:none}
.reveal b{color:var(--red);background:linear-gradient(transparent 60%,#FFD6E2 60%);padding:0 .15rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
#result.anim .rhero{animation:drop .7s cubic-bezier(.2,.8,.3,1) both}
#result.anim .reveal{animation:fade .6s .45s both}
#result.anim .radar{animation:grow .9s .55s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 51%}
#result.anim .best img{animation:pop .7s .9s cubic-bezier(.3,1.5,.5,1) both}
#result.anim .fb{animation:fade .6s 1.1s both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#result.anim *{animation:none!important}}
.rhero h1{margin-bottom:.5rem}
.rsub{position:relative;font-size:clamp(14px,1vw,19px);opacity:.92;margin:0 auto 1.1rem;max-width:40rem;word-break:keep-all;line-height:1.6}
.abox{max-width:70rem;width:96%;text-align:left}
.ahead{display:flex;justify-content:space-between;align-items:center}
.ahead h3{margin:0}
.aclose{border:none;background:none;font-size:1.3rem;cursor:pointer;color:#888}
.acnt{margin:.6rem 0 1rem;color:#444;font-weight:600}
.abtns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.abtns .btn{padding:.6rem 1rem;font-size:.85rem;display:inline-flex;align-items:center}
.adanger{color:#B00020!important;border-color:#E5A0AE!important}
.alist{margin-top:1rem;max-height:55vh;overflow:auto;border:1px solid #e9ecef;border-radius:.6rem}
.alist table{margin-top:0;font-size:.82rem;width:100%;border-collapse:collapse}
.alist th{position:sticky;top:0;background:#f8f9fa;z-index:2;border-bottom:2px solid #dee2e6;padding:.6rem .45rem}
.alist td{padding:.5rem .45rem;border-bottom:1px solid #f1f3f5;vertical-align:middle}
.chkCell{text-align:center;width:34px;padding:.45rem .2rem!important}
.admBtn{border:1px solid #ddd;background:#fff;border-radius:.35rem;padding:.26rem .55rem;cursor:pointer;font:inherit;font-size:.76rem;font-weight:600;display:inline-flex;align-items:center;gap:3px;transition:all .15s}
.admBtn:hover{opacity:.85}
.admBtn.dl{background:#A50034;color:#fff;border-color:#A50034}
.admBtn.view{background:#f1f3f5;color:#333;border-color:#ced4da}
.admBtn.view:hover{background:#e9ecef}
.admDel{border:1px solid #ddd;background:#fff;border-radius:.35rem;padding:.26rem .5rem;cursor:pointer;font:inherit;font-size:.76rem;color:#B00020;transition:all .15s}
.admDel:hover{background:#fff5f5;border-color:#ffa8a8}
.admEmpty{color:#888;text-align:center;padding:2rem}
</style>
</head>
<body>
<header>
  <div class="logo" title="MOT Competency Style Diagnosis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>
  <div class="t" data-i="title"></div>
  <div class="lang" id="lang"></div>
</header>
<div class="wrap">
<div class="card" id="start">
  <div class="start-deco d1"></div>
  <div class="start-deco d2"></div>
  <div class="start-header">
    <span class="badge"><svg class="badge-star" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7L12 16.5 5.7 21l2.3-7-6-4.6h7.6z"/></svg> MOT INSTRUCTOR STYLE DIAGNOSIS</span>
    <h1 data-i="title"></h1>
    <div class="title-divider"></div>
  </div>
  <div class="desc">
    <div class="dl hl"><span class="em">💡</span><span data-i="descA"></span></div>
    <div class="dl"><span data-i="descB"></span></div>
    <div class="dl sm"><span class="em">📌</span><span data-i="desc2"></span></div>
  </div>
  <div class="form">
    <div><label data-i="corp"></label><input id="corp" data-ph="corpPh"></div>
    <div><label data-i="name"></label><input id="uname" data-ph="namePh"></div>
  </div>
  <div class="q0">
    <h3 data-i="q0"></h3>
    <div class="yn"><button class="btn" onclick="begin('yes')" data-i="yes"></button><button class="btn" onclick="begin('no')" data-i="no"></button></div>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="card hide" id="quiz">
  <div class="top"><span id="who"></span><b id="cnt"></b></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="qno" id="qno"></div>
  <div class="qtext" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <label class="extra hide" id="extra"><input type="checkbox" id="exchk"><span id="extxt"></span></label>
  <div class="nav" id="qnav">
    <button class="btn back" onclick="prev()" data-i="back"></button>
    <button class="btn next" id="nextBtn" onclick="next()"></button>
    <span class="lastTag" id="lastTag"></span>
  </div>
</div>
<div class="card hide" id="result">
  <div class="rhero"><i class="c1"></i><i class="c2"></i><i class="c3"></i>
    <span class="rbadge">RESULT</span><h1 data-i="rtitle"></h1>
    <p class="rsub" data-i="rsub"></p>
    <div class="chips" id="rwho"></div>
  </div>
  <div class="reveal" id="reveal"></div>
  
  <div class="rgrid">
    <div><svg class="radar" id="radar" viewBox="0 0 440 440"></svg></div>
    <div class="best" id="best"></div>
  </div>
  <div class="fb" id="fb"></div>
  
  <div class="nav" style="justify-content:center;gap:14px;flex-wrap:wrap;margin-top:25px">
    <button class="btn back" onclick="location.reload()" style="min-width:130px;" data-i="home">처음으로</button>
    <button class="btn next" onclick="downloadResultPng()" style="background:#A50034;color:#fff;border-color:#A50034;min-width:180px;" data-i="dlPng">🖼️ 결과 페이지 다운로드</button>
    <button class="btn back" onclick="openAdminWithPw()" style="min-width:150px;" data-i="adminMode">⚙️ 관리자 모드 실행</button>
  </div>
</div>
</div>
<canvas id="confetti"></canvas>
<div class="modal hide" id="modal"><div class="mbox">
  <div class="mic">🧐</div><h3 id="mTitle"></h3><p id="mBody"></p>
  <div class="mbtns"><button class="btn back" id="mGo" onclick="submitAnyway()"></button><button class="btn next" id="mRe" onclick="reviewAgain()"></button></div>
</div></div>
<div class="modal hide" id="admin"><div class="mbox abox">
  <div class="ahead"><h3>📁 관리자 · 응답 누적 관리</h3><button class="aclose" onclick="closeAdmin()">✕</button></div>
  <p class="acnt" id="admCnt"></p>
  <div class="abtns">
    <button class="btn next" onclick="exportSelectedXlsx()" id="btnDlSelected" style="background:#2b8a3e;border-color:#2b8a3e;" title="체크박스로 선택한 응답자들의 누적 엑셀을 다운로드합니다">📥 선택 엑셀 다운로드 (<span id="selCnt">0</span>명)</button>

const DATA={"yes":[{"cat":"강의 역량 1","area":"강의 역량","q":"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?","opts":["중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다."],"ex":"","rel":false},{"cat":"강의 역량 2","area":"강의 역량","q":"강의를 진행하는 동안, 나의 시선과 몸의 움직임은?","opts":["교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다."],"ex":"","rel":false},{"cat":"데이터 분석 역량 1","area":"데이터 분석 역량","q":"T-NPS를 확인할 때 나의 방식은?","opts":["법인 전체의 평균 점수와 증감 추이 위주로 파악한다.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다."],"ex":"법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.","rel":false},{"cat":"데이터 분석 역량 2","area":"데이터 분석 역량","q":"데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?","opts":["법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다."],"ex":"법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.","rel":false},{"cat":"콘텐츠 제작 역량 1","area":"콘텐츠 제작 역량","q":"HQ의 교육 콘텐츠를 법인에 활용하는 방식은?","opts":["HQ가 제공한 영어 콘텐츠를 그대로 활용한다.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다."],"ex":"","rel":false},{"cat":"콘텐츠 제작 역량 2","area":"콘텐츠 제작 역량","q":"PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?","opts":["전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 1","area":"커뮤니케이션 역량","q":"내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?","opts":["일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 2","area":"커뮤니케이션 역량","q":"회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?","opts":["침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다."],"ex":"","rel":false},{"cat":"마인드셋 역량 1","area":"마인드셋 역량","q":"많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?","opts":["무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다."],"ex":"","rel":false},{"cat":"마인드셋 역량 2","area":"마인드셋 역량","q":"강한 스트레스나 갈등 상황에서 나의 대처 방식은?","opts":["감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다."],"ex":"","rel":false},{"cat":"강의 역량 신뢰성 검증","area":"강의 역량","q":"강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.","opts":["매우 그렇다","그렇다","그렇지 않다","전혀 그렇지 않다"],"ex":"","rel":true},{"cat":"강의 역량 3","area":"강의 역량","q":"강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?","opts":["정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다."],"ex":"","rel":false},{"cat":"강의 역량 4","area":"강의 역량","q":"RP or 1:1 동행코칭 이후 나의 피드백 방식은?","opts":["SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다."],"ex":"","rel":false},{"cat":"콘텐츠 제작 역량 신뢰성 검증","area":"콘텐츠 제작 역량","q":"교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"데이터 분석 역량 3","area":"데이터 분석 역량","q":"T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?","opts":["기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다."],"ex":"법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.","rel":false},{"cat":"데이터 분석 역량 4","area":"데이터 분석 역량","q":"교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?","opts":["교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다."],"ex":"법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.","rel":false},{"cat":"콘텐츠 제작 역량 3","area":"콘텐츠 제작 역량","q":"교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?","opts":["교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다."],"ex":"","rel":false},{"cat":"콘텐츠 제작 역량 4","area":"콘텐츠 제작 역량","q":"슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?","opts":["슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다."],"ex":"","rel":false},{"cat":"마인드셋 역량 신뢰성 검증","area":"마인드셋 역량","q":"협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"커뮤니케이션 역량 3","area":"커뮤니케이션 역량","q":"교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?","opts":["현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 4","area":"커뮤니케이션 역량","q":"참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?","opts":["개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 5","area":"커뮤니케이션 역량","q":"유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?","opts":["현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다."],"ex":"","rel":false},{"cat":"마인드셋 역량 3","area":"마인드셋 역량","q":"나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?","opts":["상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다."],"ex":"","rel":false},{"cat":"마인드셋 역량 4","area":"마인드셋 역량","q":"협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?","opts":["내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 신뢰성 검증","area":"커뮤니케이션 역량","q":"교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true}],"no":[{"cat":"설명 역량 1","area":"설명 역량","q":"내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?","opts":["누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.","상대방이 이해하기 쉽도록 핵심 요약과 함께  실제 업무 경험담을 예시로 들어 설명한다.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다."],"ex":"","rel":false},{"cat":"설명 역량 2","area":"설명 역량","q":"동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?","opts":["차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다."],"ex":"","rel":false},{"cat":"데이터 분석 역량 1","area":"데이터 분석 역량","q":"T-NPS를 확인할 때 어디까지 살펴보는가?","opts":["법인 전체의 평균 점수와 증감 추이 위주로 파악한다.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다."],"ex":"법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.","rel":false},{"cat":"데이터 분석 역량 2","area":"데이터 분석 역량","q":"데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?","opts":["법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다."],"ex":"법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.","rel":false},{"cat":"커뮤니케이션 역량 신뢰성 검증","area":"커뮤니케이션 역량","q":"스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"시각적 구조화 역량 1","area":"시각적 구조화 역량","q":"복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?","opts":["슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다."],"ex":"","rel":false},{"cat":"시각적 구조화 역량 2","area":"시각적 구조화 역량","q":"PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?","opts":["전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 1","area":"커뮤니케이션 역량","q":"유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?","opts":["관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 2","area":"커뮤니케이션 역량","q":"동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?","opts":["수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다."],"ex":"","rel":false},{"cat":"마인드셋 역량 1","area":"마인드셋 역량","q":"많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?","opts":["무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다."],"ex":"","rel":false},{"cat":"마인드셋 역량 2","area":"마인드셋 역량","q":"강한 스트레스나 갈등 상황에서 나의 대처 방식은?","opts":["감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다."],"ex":"","rel":false},{"cat":"설명 역량 3","area":"설명 역량","q":"동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?","opts":["상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다."],"ex":"","rel":false},{"cat":"설명 역량 4","area":"설명 역량","q":"상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?","opts":["앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다."],"ex":"","rel":false},{"cat":"마인드셋 역량 신뢰성 검증","area":"마인드셋 역량","q":"협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"데이터 분석 역량 3","area":"데이터 분석 역량","q":"T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?","opts":["기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다."],"ex":"법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.","rel":false},{"cat":"데이터 분석 역량 4","area":"데이터 분석 역량","q":"법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?","opts":["교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후  T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다."],"ex":"법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.","rel":false},{"cat":"시각적 구조화 역량 3","area":"시각적 구조화 역량","q":"슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?","opts":["디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다."],"ex":"","rel":false},{"cat":"시각적 구조화 역량 4","area":"시각적 구조화 역량","q":"PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?","opts":["도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다."],"ex":"","rel":false},{"cat":"설명 역량 신뢰성 검증","area":"설명 역량","q":"동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"커뮤니케이션 역량 3","area":"커뮤니케이션 역량","q":"회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?","opts":["침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 4","area":"커뮤니케이션 역량","q":"대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?","opts":["뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다."],"ex":"","rel":false},{"cat":"커뮤니케이션 역량 5","area":"커뮤니케이션 역량","q":"팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?","opts":["다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다."],"ex":"","rel":false},{"cat":"시각적 구조화 역량 신뢰성 검증","area":"시각적 구조화 역량","q":"PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.","opts":["매우 그렇다","그렇다","그렇지 않다","매우 그렇지 않다"],"ex":"","rel":true},{"cat":"마인드셋 역량 3","area":"마인드셋 역량","q":"나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?","opts":["상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다."],"ex":"","rel":false},{"cat":"마인드셋 역량 4","area":"마인드셋 역량","q":"협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?","opts":["내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다."],"ex":"","rel":false}]};

ko:{rtitleN:"나는 어떤 스타일의 MOT 강사가 될까요?",rvN:"당신은 {x}형 강사로 성장할 수 있어요!",rsub:"응답을 바탕으로 분석한 나만의 강점과 성장 포인트예요.",rv:"당신은 {x}형 강사입니다!",sH:"💪 나의 강점",wH:"🌱 조금만 더 보완하면 더 좋아져요",bal:"모든 역량이 고르게 균형 잡혀 있어요! 지금의 강점을 유지하면서 한 단계씩 더 성장해 보세요.",S:{"강의 역량": "교육생의 눈높이에서 사례와 비유를 곁들여 쉽게 풀어내는 강사예요. 강의장의 분위기를 자연스럽게 이끄는 힘이 큰 장점이에요.", "설명 역량": "핵심을 짚어 누구나 이해하기 쉽게 설명하는 분이에요. 상대의 반응을 살피며 속도를 맞추는 배려가 돋보여요.", "데이터 분석 역량": "숫자 뒤에 숨은 이야기를 읽어내는 눈을 가졌어요. 데이터를 근거로 개선 방향을 제시하는 힘이 큰 강점이에요.", "콘텐츠 제작 역량": "법인과 교육생에게 꼭 맞는 콘텐츠를 만들어내는 분이에요. 흐름이 살아 있는 교안 구성이 특히 돋보여요.", "시각적 구조화 역량": "복잡한 정보도 한눈에 들어오도록 정리하는 감각이 뛰어나요. 도식과 구조로 메시지를 또렷하게 전달하는 분이에요.", "커뮤니케이션 역량": "상대의 마음에 귀 기울이고 공감하는 따뜻한 소통가예요. 어려운 상황에서도 사람들의 참여를 자연스럽게 이끌어내요.", "마인드셋 역량": "어떤 상황에서도 중심을 잃지 않는 단단한 마음을 가졌어요. 피드백을 성장의 발판으로 삼는 태도가 정말 멋져요."},W:{"강의 역량": "교육생 한 명 한 명과 눈을 맞추고 말의 속도와 강약에 변화를 더해 보세요. 지금의 강의가 훨씬 더 생동감 있게 전달될 거예요.", "설명 역량": "설명을 마친 뒤 가벼운 질문으로 이해도를 확인하고, 직접 겪은 사례를 곁들여 보세요. 설명이 한층 더 쏙쏙 전달될 거예요.", "데이터 분석 역량": "전체 평균에서 한 걸음 더 나아가 센터·SE별 점수와 고객 코멘트도 함께 살펴보세요. 개선의 실마리가 더 선명하게 보일 거예요.", "콘텐츠 제작 역량": "HQ 콘텐츠에 우리 법인의 사례를 더하고, 결론부터 보여주는 흐름을 시도해 보세요. 교안의 설득력이 한층 더 높아질 거예요.", "시각적 구조화 역량": "글머리 기호 대신 도형·표·아이콘으로 관계를 표현해 보세요. 슬라이드가 훨씬 더 명확하고 보기 좋아질 거예요.", "커뮤니케이션 역량": "상대의 이야기를 끝까지 들어주고, 참여가 어려운 분께 먼저 손 내밀어 보세요. 소통의 깊이가 한층 더 깊어질 거예요.", "마인드셋 역량": "실패나 쓴소리도 배움의 기회로 바라보고, 나만의 회복 루틴을 만들어 보세요. 마음의 근육이 더 단단해질 거예요."},lastQ:"마지막 문항입니다",mT:"다시 한번 살펴볼까요?",mB:"응답이 한쪽 위치에 많이 몰려 있어요.\n각 문항을 다시 읽고, 실제 본인의 행동과 가장 가까운 답을 골랐는지 확인해 주세요.",mRe:"다시 살펴보기",mGo:"그대로 제출하기",title:'MOT 강사 역량 스타일 진단',descA:"본 문항들은 본인의 평소 스타일을 확인하기 위함으로, 맞고 틀린 정답은 존재하지 않습니다.",descB:"각 문항을 읽고 실제 본인이 행동하는 방식과 가장 가까운 것을 골라주세요.",desc2:'만약 제시된 상황을 직접 경험해 본 적이 없다면, 해당 상황을 가정하여 본인이 취할 행동과 가장 가까운 것을 선택해주세요',corp:'법인',name:'이름',corpPh:"소속/법인(예: LGEKR)",namePh:"이름(예: 홍길동)",q0:'누군가를 가르치거나 코칭을 진행해 본 적이 있으신가요?',yes:'네',no:'아니요',err:'법인과 이름을 입력해 주세요.',back:'← 뒤로 가기',next:'다음 →',submit:'제출하기',rtitle:"나는 어떤 스타일의 MOT 강사일까요?",expY:"강의·코칭 경험 있음",expN:"강의·코칭 경험 없음",thA:'역량',thS:'평균 점수 (4점 만점)',thC:'반영 문항 수',note:'※ 신뢰 en:{rtitleN:"What kind of MOT trainer will I become?",rvN:"You can grow into a {x}-type trainer!",rsub:"Your unique strengths and growth points, based on your responses.",rv:"You are a {x}-type trainer!",sH:"💪 My strength",wH:"🌱 A little more work here will make you even better",bal:"All your competencies are well balanced! Keep your strengths and keep growing step by step.",S:{"강의 역량": "You explain at the learners’ level with examples and analogies, and you lead the room well.", "설명 역량": "You get to the point clearly and adjust your explanation based on the listener’s reaction.", "데이터 분석 역량": "You find the causes behind the numbers and propose improvements based on data.", "콘텐츠 제작 역량": "You adapt content to your subsidiary and learners and build materials with a clear flow.", "시각적 구조화 역량": "You organize complex information into diagrams and structures that are easy to grasp.", "커뮤니케이션 역량": "You empathize, listen well, and draw out participation even in difficult situations.", "마인드셋 역량": "You manage emotions well under pressure and turn feedback into a chance to grow."},W:{"강의 역량": "Make even eye contact and vary your pace and emphasis to make your delivery stronger.", "설명 역량": "Check understanding with questions and add real examples to make your explanations land better.", "데이터 분석 역량": "Look beyond overall averages at center/SE scores and customer comments to see causes more clearly.", "콘텐츠 제작 역량": "Localize HQ content with your own cases and try a conclusion-first flow.", "시각적 구조화 역량": "Use shapes, tables and icons instead of bullet text to show relationships more clearly.", "커뮤니케이션 역량": "Listen to the end and reach out first to those who struggle to participate.", "마인드셋 역량": "See setbacks and criticism as learning, and build your own recovery routine."},lastQ:"This is the last question",mT:"Would you like to review once more?",mB:"Most of your answers are in the same position.\nPlease re-read each question and check that you chose the option closest to how you a es:{rtitleN:"¿Qué tipo de instructor MOT llegaré a ser?",rvN:"¡Puedes crecer como instructor de tipo {x}!",rsub:"Tus fortalezas y puntos de crecimiento, analizados a partir de tus respuestas.",rv:"¡Eres un instructor de tipo {x}!",sH:"💪 Mi fortaleza",wH:"🌱 Un poco más de trabajo aquí te hará aún mejor",bal:"¡Tus competencias están muy equilibradas! Mantén tus fortalezas y sigue creciendo paso a paso.",S:{"강의 역량": "Explicas al nivel de los participantes con ejemplos y analogías, y diriges bien el aula.", "설명 역량": "Vas al grano con claridad y ajustas tu explicación según la reacción del oyente.", "데이터 분석 역량": "Encuentras las causas detrás de los números y propones mejoras basadas en datos.", "콘텐츠 제작 역량": "Adaptas el contenido a tu subsidiaria y participantes con una estructura clara.", "시각적 구조화 역량": "Organizas información compleja en esquemas y estructuras fáciles de entender.", "커뮤니케이션 역량": "Empatizas, escuchas bien y fomentas la participación incluso en situaciones difíciles.", "마인드셋 역량": "Gestionas bien tus emociones bajo presión y conviertes la retroalimentación en crecimiento."},W:{"강의 역량": "Reparte el contacto visual y varía ritmo y énfasis para reforzar tu exposición.", "설명 역량": "Comprueba la comprensión con preguntas y añade ejemplos reales.", "데이터 분석 역량": "Mira más allá del promedio: puntuaciones por centro/SE y comentarios de clientes.", "콘텐츠 제작 역량": "Localiza el contenido de HQ con casos propios y prueba una estructura que empiece por la conclusión.", "시각적 구조화 역량": "Usa formas, tablas e iconos en lugar de viñetas para mostrar relaciones.", "커뮤니케이션 역량": "Escucha hasta el final y acércate primero a quienes participan poco.", "마인드셋 역량": "Ve los tropiezos y críticas como aprendizaje y crea tu propia rutina de recuperación."},lastQ:"Esta es la última pregunta",mT:"¿Desea revisar una vez más?",mB:"La mayoría de sus respuestas están en la misma posición.\nVuelva a leer cada pregunta y confirme que eligió la opción más cercana a su forma real de actuar.",mRe:"Revis ja:{rtitleN:"私はどんなスタイルのMOT講師になるでしょうか？",rvN:"あなたは{x}タイプの講師に成長できます！",rsub:"回答をもとに分析した、あなただけの強みと成長ポイントです。",rv:"あなたは{x}タイプの講師です！",sH:"💪 私の強み",wH:"🌱 もう少し補うともっと良くなります",bal:"すべての力量がバランスよく整っています！今の強みを保ちながら、一歩ずつ成長していきましょう。",S:{"강의 역량": "受講者の目線に合わせ、事例や比喩でわかりやすく伝え、場をリードする力が優れています。", "설명 역량": "要点を押さえてわかりやすく説明し、相手の反応を見ながら伝える力が際立っています。", "데이터 분석 역량": "数字の裏にある原因を見つけ、データに基づいて改善方向を示す力が優れています。", "콘텐츠 제작 역량": "法人の状況や受講者に合わせてコンテンツを再構成し、流れのある教材を作る力が際立っています。", "시각적 구조화 역량": "複雑な情報を図や構造で整理し、ひと目でわかるようにする力が優れています。", "커뮤니케이션 역량": "相手に共感して傾聴し、難しい場面でも参加を引き出す力があります。", "마인드셋 역량": "困難の中でも感情をうまく整え、フィードバックを成長の機会にできる強い心を持っています。"},W:{"강의 역량": "受講者と均等に視線を合わせ、話す速さや強弱に変化をつけると伝達力が高まります。", "설명 역량": "説明後に質問で理解度を確認し、実体験の事例を添えるとより伝わります。", "데이터 분석 역량": "全体平均だけでなく、センター・SE別の点数や顧客コメントも見ると原因が明確になります。", "콘텐츠 제작 역량": "HQコンテンツを法人の事例に合わせ、結論から示す構成にするとより良くなります。", "시각적 구조화 역량": "箇条書きの代わりに図形・表・アイコンで関係を表すとスライドが明確になります。", "커뮤니케이션 역량": "相手の話を最後まで聞き、参加しにくい人に先に声をかけると対話が深まります。", "마인드셋 역량": "失敗や否定的なフィードバックを学びの機会と捉え、自分なりの回復ルーティンを作りましょう。"},lastQ:"最後の設問です",mT:"もう一度見直しますか？",mB:"回答が同じ位置に偏っています。\n各設問をもう一度読み、実際の行動に最も近いものを選んだか確認してください。",mRe:"もう一度見直す",mGo:"このまま提出する",title:'MOT講師力量スタイル診断',descA:"本設問は普段のご自身のスタイルを確認するためのもので、正解・不正解はありません。",descB:"各設問を読み、実際のご自身の行動に最も近いものを選んでください。",desc2:'提示された状況を直接経験したことがない場合は、その状況を想定し、ご自身がとる行動に最も近いものを選んでください',corp:'法人',name:'氏名',corpPh:"所属/法人（例：LGEKR）",namePh:"氏名（例：洪吉童）",q0:'誰かに教えたり、コーチングを行ったりしたことがありますか？',yes:'はい',no:'いいえ',err:'法人と氏名を入力してください。',back:'← 戻る',next:'次へ →',submit:'提出する',rtitle:"私はどんなスタイルのMOT講師でしょうか？",expY:"講義・コーチング経験あり",expN:"講義・コーチング経験なし",thA:'力量',thS:'平均点（4点満点）',thC:'反映設問数',note:'※信頼性検証設問および番外チェック設問は点数に含まれません。',home:'最初に戻る',dlPng:'🖼️ 結果ページをダウンロード',adminMode:'⚙️ 管理者モード',dlGen:'🖼️ 高画質の結果画像を生成しています...',dlSuccess:'✅ 鮮明な高画質の結果画像が保存されました。',dlErr:'画像の保存中にエラーが発生しました: ',best:"私の強み",avg:'平均',pt:'点',

zh:{rtitleN:"我会成为哪种风格的MOT讲师？",rvN:"您可以成长为{x}型讲师！",rsub:"根据您的回答分析出的专属优势与成长要点。",rv:"您是{x}型讲师！",sH:"💪 我的优势",wH:"🌱 稍加补强会更好",bal:"您的各项能力非常均衡！保持现有优势，一步步继续成长吧。",S:{"강의 역량": "能结合学员水平，用案例和比喻通俗讲解，并很好地带动课堂氛围。", "설명 역량": "能抓住重点清晰说明，并根据对方反应调整表达。", "데이터 분석 역량": "善于发现数字背后的原因，并基于数据提出改进方向。", "콘텐츠 제작 역량": "能根据法人情况和学员重构内容，制作逻辑清晰的教材。", "시각적 구조화 역량": "善于将复杂信息整理成图示和结构，让人一目了然。", "커뮤니케이션 역량": "善于共情和倾听，即使在困难情况下也能带动参与。", "마인드셋 역량": "能在困境中调节情绪，把反馈当作成长的机会。"},W:{"강의 역량": "与学员均匀进行眼神交流，并调整语速和轻重，表达力会更好。", "설명 역량": "讲解后用提问确认对方是否理解，并加入实际案例会更有效。", "데이터 분석 역량": "不仅看整体平均，也看各中心/SE得分及客户评论，原因会更清晰。", "콘텐츠 제작 역량": "将HQ内容结合法人案例本地化，并尝试结论先行的结构。", "시각적 구조화 역량": "用图形、表格、图标代替项目符号来表现关系，幻灯片会更清晰。", "커뮤니케이션 역량": "耐心听完对方的话，并主动接近难以参与的人。", "마인드셋 역량": "把失败和负面反馈看作学习机会，建立自己的恢复习惯。"},lastQ:"这是最后一题",mT:"要再检查一遍吗？",mB:"您的回答大多集中在同一位置。\n请重新阅读每道题，确认是否选择了最接近您实际行为的选项。",mRe:"重新检查",mGo:"直接提交",title:'MOT讲师能力风格诊断',descA:"本问卷旨在了解您平时的风格，答案没有对错之分。",descB:"请阅读每道题目，选择最接近您实际行为方式的选项。",desc2:'如果您从未亲身经历过题目中的情境，请假设处于该情境，选择最接近您会采取的行动',corp:'法人',name:'姓名',corpPh:"所属/法人（例：LGEKR）",namePh:"姓名（例：洪吉童）",q0:'您是否曾经教过或辅导过他人？',yes:'是',no:'否',err:'请输入法人和姓名。',back:'← 返回',next:'下一题 →',submit:'提交',rtitle:"我是哪种风格的MOT讲师？",expY:"有授课/辅导经验",expN:"无授课/辅导经验",thA:'能力',thS:'平均分（满分4分）',thC:'计分题数',note:'※ 信度检验题及勾选为例外的题目不计入得分。',home:'返回首页',dlPng:'🖼️ 下载结果页面',adminMode:'⚙️ 管理员模式',dlGen:'🖼️ 正在生成高清结果图片...',dlSuccess:'✅ 已成功保存清晰的高清结果图片。',dlErr:'保存图片时发生错误：',best:"我的优势",avg:'平均',pt:'分',

const QT={"en":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"How do I explain the main lecture content on a slide to learners?","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"I read the slide text carefully so that nothing important is missed.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"I summarize the slide text, focusing on the key points.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"I use concrete analogies or examples that fit the field situation so it is easy to understand.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"While using analogies or examples, I briefly re-enact real customer-handling actions or lines when needed.","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"During a lecture, where do I look and how do I move?","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"I mainly look at the screen or monitor so I don't miss the material.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"Eye contact with learners feels a bit awkward, so I mostly look toward the back of the room and stay in one spot.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"I make eye contact with learners, focusing mainly on those who react and respond well.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"I move appropriately and distribute my gaze evenly so that no learner feels left out.","T-NPS를 확인할 때 나의 방식은?":"How do I check T-NPS?","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"I mainly look at the subsidiary's overall average score and its trend.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"I compare average scores across centers and focus on low-performing centers.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"I analyze T-NPS for low-scoring regions or specific repair product groups to identify key weaknesses and strengths.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"I compare and analyze each center's weak factors and its SEs' individual scores and variances in detail to identify specific strengths and areas for improvement.","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"Due to my subsidiary's conditions, I do not perform tasks that involve checking T-NPS.","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"How do I identify specific improvement factors for my subsidiary based on data?","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"I treat the overall T-NPS trend of the subsidiary itself as the key direction for improvement.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"I review the scores by item and select the lowest-scoring key complaint category as the improvement factor.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"I read SE scores and customer complaint comments carefully to identify practical improvement factors.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"I combine T-NPS, customer comments and SEs' past metrics to find out why complaints keep recurring.","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"Due to my subsidiary's conditions, I do not analyze data to identify improvement factors.","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"How do I use HQ training content in my subsidiary?","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"I use the English content provided by HQ as is.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"I keep the structure and content of the HQ material, translate the text into the local language and quickly apply it to my training.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"I modify the content and wording of individual slides to fit my subsidiary's situation and cases.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"Based on HQ content, I develop my own content tailored to my subsidiary's situation and learners' characteristics.","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"How do I organize the order and flow of slides when creating a PPT?","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"I write the content on the slides in the order it comes to mind.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"I roughly divide the content by topic and arrange the slides accordingly.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"I connect the slides with a logical cause-and-effect flow, such as problem → cause analysis → solution.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"Using a conclusion-first structure, I organize the PPT so that its key message flows as one storyline.","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"How do I respond when a learner expresses difficulties or negative opinions about the training content or direction I deliver?","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"I calmly explain, as a matter of principle, that the training content must be followed for consistent standards and results.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"I briefly empathize with the learner's practical difficulties and quickly suggest a simple compromise that can be applied immediately.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수 있는 구체적인 실무 대안을 함께 찾아 제시한다.":"I listen fully to the learner's frustration and resistance, empathize, and then find and present concrete practical alternatives together.","나의 실제 경험담을 나누며 공감하고, 이 교육이 왜 필요한지 교육생의 눈높이에 맞추어 설득한다.":"I empathize by sharing my own real experiences and persuade the learner at their level about why this training is necessary.","회의 중 질문을 던져도 동료들이 아무 의견 없이 침묵할 때, 나의 대처 방식은?":"How do I respond when colleagues stay silent after I ask a question in a meeting?","침묵이 길어질 경우, 불필요한 시간 지체를 줄이기 위해 빠르게 다음 안건으로 넘어간다.":"If the silence lasts, I quickly move on to the next agenda item to avoid wasting time.","침묵을 깨기 위해 특정 동료를 직접 지목하여 답변을 요청한다.":"To break the silence, I directly call on a specific colleague to answer.","의견을 내기 어려운 주관식 질문 대신, 몇가지 의견을 제시해서 선택하게 하는 등 생각을 유도한다.":"Instead of an open-ended question that is hard to answer, I offer a few options to choose from to stimulate thinking.","각자 1~2분간 생각을 정리할 시간을 자연스럽게 제공하여 편안하게 대화를 나눌 수 있도록 이끈다.":"I naturally give everyone 1–2 minutes to organize their thoughts so they can talk comfortably.","많은 노력을 쏟은 일에서 성과가 없거나 아무런 변화가 없을 때 내가 느끼는 반응은?":"How do I react when there are no results or no change after putting a lot of effort into something?","무력감과 피로감을 느끼며, 상황을 바꿀 의욕을 잃게 된다.":"I feel helpless and tired, and lose the motivation to change the situation.","좌절감에 깊이 빠지지 않도록 감정을 조절하며, 별도의 원인 분석보다는 정해진 교육과 코칭을 충실히 수행하는데 집중한다.":"I control my emotions so I don't sink into frustration, and focus on faithfully delivering the planned training and coaching rather than analyzing causes.","내가 놓치는 부분이 있는지 되짚어보고, 데이터와 현장 상황을 꼼꼼히 살피며 극복할 방법을 찾는다.":"I look back for anything I may have missed and carefully examine data and field conditions to find a way to overcome it.","상황에 흔들리지 않고, 데이터 기반으로 변화 가능성과 개선의 근거를 찾아 MOT 교육과 코칭을 지속적으로 이어나간다.":"Without being shaken, I look for data-based evidence of possible change and improvement and continue MOT training and coaching.","강한 스트레스나 갈등 상황에서 나의 대처 방식은?":"How do I cope with strong stress or conflict?","감정이 폭발하지 않도록 꾹 누르고 진정시키려 애쓰지만, 표정에서 은근히 티가 난다.":"I try hard to hold my emotions in so they don't explode, but it subtly shows on my face.","스트레스를 주는 요인에 더는 신경 쓰지 않으려 감정을 차단하고, 내가 당장 집중해야할 일에 몰두한다.":"I shut off my emotions so I no longer pay attention to the stressor, and immerse myself in what I need to focus on right now.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다":"I refresh my mood with light conversation or humor, or relieve stress by talking openly with colleagues.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다":"I quickly settle my emotions with my own reliable outlet or leisure activity, and treat the hardship as a chance to learn.","강의를 진행할 때 현장 사례나 비유를 덧붙이기보다는, 교안에 적힌 내용을 그대로 전달하는 것이 가장 신뢰감을 준다고 생각한다.":"When lecturing, I think delivering the material exactly as written builds the most trust, rather than adding field examples or analogies.","매우 그렇다":"Strongly agree","그렇다":"Agree","그렇지 않다":"Disagree","전혀 그렇지 않다":"Strongly disagree","강의를 진행하는 동안 나의 전반적인 스피치 속도와 어조는?":"What is my overall speaking pace and tone during a lecture?","정보 전달의 신뢰감을 주기 위해, 일정한 톤으로 설명한다.":"I explain in a steady tone to convey information reliably.","SE가 내용을 이해할 수 있도록, 전반적인 말의 빠르기를 조절하며 설명한다.":"I adjust my overall speaking pace so that SEs can understand the content.","말의 빠르기를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"While adjusting my pace, I clearly emphasize key steps by raising my volume or tone.","상황에 따라 말의 빠르기와 강약을 조절하다가, 핵심 포인트에서는 말을 잠시 멈춘다.":"I adjust my pace and emphasis depending on the situation, and pause briefly at key points.","RP or 1:1 동행코칭 이후 나의 피드백 방식은?":"How do I give feedback after an RP or 1:1 field coaching?","SE가 위축되거나 스트레스 받지 않도록 칭찬과 정서적 격려 위주로 편안하게 이야기한다.":"I speak comfortably, focusing on praise and emotional encouragement so the SE doesn't feel discouraged or stressed.","MOT 매뉴얼 표준과 어긋난 부분이 발견되면 즉각 개입하여 교정한다.":"When I find something that deviates from the MOT manual standard, I step in immediately and correct it.","잘한 점과 보완이 필요한 모든 요소들을 체계적으로 나누어 모든 것을 이야기해준다.":"I systematically go over everything, both what was done well and all the points that need improvement.","종합피드백을 통해 가장 뛰어난 강점을 말하고, 현업에서 우선적으로 개선할 행동 1가지를 선정해 명확하게 전달한다.":"In overall feedback, I mention the greatest strength and clearly convey one priority behavior to improve on the job.","교육을 할 때 토론을 통해 서로의 이야기를 나누게 하는 것보다 빠른 습득을 위해 매뉴얼을 반복해서 따라 읽게 하는 것이 더 중요하다.":"In training, having learners repeatedly read the manual aloud for quick learning is more important than having them share ideas through discussion.","매우 그렇지 않다":"Strongly disagree","T-NPS 점수가 낮을 때, 원인을 분석하는 나의 방식은?":"When T-NPS scores are low, how do I analyze the causes?","기본적으로 점수가 낮은 것은 SE 개인의 친절도나 서비스 마인드 부족이 가장 큰 원인이라고 파악한다.":"I basically regard a lack of individual SE friendliness or service mindset as the main cause of low scores.","현장에서 정해진 매뉴얼을 빠뜨리고 이행하지 않은 비율을 대조하여 문제 원인을 파악한다.":"I identify the cause by comparing the rate at which prescribed manual steps were skipped in the field.","고객 의견을 함께 살펴보며, 불만 원인을 개인 응대, 제품 문제, 서비스 환경 등으로 구분한다.":"Reviewing customer feedback as well, I classify complaint causes into individual handling, product issues, service environment, etc.","SE가 통제하기 어려운 환경적 요인을 제외하고, 개인 응대에서 개선할 수 있는 요인을 구체적으로 도출한다.":"Excluding environmental factors the SE cannot control, I specifically identify what can be improved in individual handling.","법인 여건 및 상황 상, 불만의 원인을 분류하는 업무를 하지 않는다.":"Due to my subsidiary's conditions, I do not classify the causes of complaints.","교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"How do I check whether training or coaching actually contributed to improving metrics such as T-NPS?","교육 이후 법인 전체의 T-NPS 점수가 전월 대비 올랐는지 확인한다.":"I check whether the subsidiary's overall T-NPS score rose compared to the previous month after the training.","교육 전후 법인 전체의 T-NPS 증감 폭을 비교해 개선 수준을 파악한다.":"I compare the change in the subsidiary's overall T-NPS before and after training to gauge the level of improvement.","교육 이수 SE의 교육 1개월 전후 T-NPS 점수를 비교한다.":"I compare the T-NPS scores of trained SEs one month before and after the training.","교육생들의 T-NPS 점수를 2~3달간 추적해 개선 효과의 지속 여부를 확인한다.":"I track learners' T-NPS scores for 2–3 months to see whether the improvement is sustained.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 팔로업은 따로 진행하지 않는다.":"Due to my subsidiary's conditions, I do not separately follow up on learners' T-NPS scores after training.","교육생들의 이해와 참여를 돕기 위한 나의 슬라이드 구성 방식은?":"How do I design slides to support learners' understanding and participation?","교육생들이 다 함께 큰 소리로 따라 읽는 것을 위주로 교안을 구성한다.":"I build the material mainly around learners reading aloud together.","핵심 포인트를 잘 기억하고 있는지 확인하기 위해, 빈칸 채우기나 퀴즈를 중간에 삽입한다.":"I insert fill-in-the-blank exercises or quizzes midway to check whether learners remember the key points.","교육생이 잘못된 행동이나 멘트를 직접 수정하고, 강사 피드백으로 정답을 확인하는 참여형 슬라이드를 구성한다.":"I create participatory slides where learners correct wrong behaviors or phrases themselves and check the answer through instructor feedback.","토론을 통해 해결 방안을 도출하고, 강사 피드백으로 올바른 방향을 정리하는 슬라이드를 구성한다.":"I create slides where learners derive solutions through discussion and the instructor's feedback sums up the right direction.","슬라이드 내 가이드라인이나 복잡한 텍스트 정보를 시각화하는 방식은?":"How do I visualize guidelines or complex text information on slides?","슬라이드 화면에 깔끔한 글머리 기호와 줄글 텍스트 위주로 채워 넣는다.":"I fill the slide mainly with neat bullet points and plain text.","가독성을 높이기 위해, 긴 줄글이나 숫자 데이터를 기본 표나 그래프에 넣는다.":"To improve readability, I put long text or numerical data into basic tables or graphs.","개념 간의 순서나 관계를 보여주기 위해, 화살표나 다이어그램 도형을 활용하여 내용을 구조화한다.":"To show the order or relationships between concepts, I structure the content using arrows or diagram shapes.","도형이나 표로 도식화된 내용 중, 강조해야 할 특정 문구나 단어는 크기와 색상을 다르게 한다.":"Within content laid out in shapes or tables, I vary the size and color of specific phrases or words that need emphasis.","협업 중 돌발 상황이 발생했을 때, 내 역할에 문제가 없다면 다른 업무에 집중하여 시간을 효율적으로 쓰는 편이다.":"When something unexpected happens during collaboration, if there is no problem with my role, I tend to focus on other tasks to use my time efficiently.","교육생이 주제와 무관한 불만을 제기하며 분위기를 흐릴 때 나의 대처 방식은?":"How do I respond when a learner raises complaints unrelated to the topic and spoils the atmosphere?","현재 교육 주제와 맞지 않음을 이야기하고, 준비된 교육을 진행한다.":"I say that it does not fit the current training topic and continue with the prepared training.","중요한 의견임을 인정하되, 쉬는 시간이나 교육 종료 후 개별적으로 소통하기로 하여 상황을 일단락 짓는다.":"I acknowledge it is an important opinion, but wrap things up by agreeing to talk individually during a break or after the training.","강의의 흐름을 방해하지 않는 선에서, 교육생이 겪은 답답함과 억울함을 들어주고 공감해준다.":"Without disrupting the flow of the lecture, I listen to and empathize with the learner's frustration and sense of unfairness.","불만의 원인을 인정하되, 이러한 상황 속에서 적용 가능한 현실적인 응대 요령을 제시한다.":"I acknowledge the cause of the complaint, but present realistic handling tips that can be applied in that situation.","참여 의지가 부족하여 은근슬쩍 겉돌거나 소외되어 있는 인원을 만났을 때 나의 소통 방식은?":"How do I communicate with someone who lacks motivation and quietly drifts or is left out?","개별 인원의 참여도보다는 정해진 교육 일정과 준비된 교안 진도를 진행하는 것에 집중한다.":"I focus on following the training schedule and the prepared material rather than on individual participation.","교육생이 학습에서 완전히 낙오되지 않도록, 옆자리의 우수한 동료와 짝을 지어주어 자연스럽게 실습에 묻어갈 수 있게 돕는다.":"So the learner doesn't fall completely behind, I pair them with a capable colleague next to them so they can naturally follow along in the practice.","실습 공간을 돌며 가볍게 1:1로 다가가, 이해하기 어려운 부분이 있는지 묻고 가벼운 피드백을 건넨다.":"I walk around the practice area, approach them casually 1:1, ask if anything is hard to understand and give light feedback.","교육생의 눈높이에 맞춰 쉽게 성공할 수 있는 간단한 역할이나 답변을 유도하고, 이에 긍정적으로 호응하여 참여 자신감을 높여준다.":"I guide them to a simple role or answer they can easily succeed at, respond positively, and build their confidence to participate.","유관 부서나 동료가 당장 처리하기 어려운 촉박하거나 무리한 업무 지원을 요청할 때, 나의 대처 방식은?":"How do I respond when another department or a colleague asks for urgent or unreasonable support that is hard to handle right away?","현재 내 업무가 바쁘다는 상황을 단호하게 설명하고, 지원이 불가능함을 명확히 밝히며 거절한다.":"I firmly explain that I am busy with my own work and clearly refuse, stating that support is not possible.","관계가 껄끄러워지는 것을 피하기 위해, 내 업무 일정에 무리가 가더라도 일단 요청을 받아들여 처리한다.":"To avoid an awkward relationship, I accept the request and handle it even if it overloads my schedule.","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 지금 당장은 어렵다는 말을 전한다.":"I calmly explain my priorities and constraints and say, without causing offense, that it is difficult right now.","당장 수용은 어렵더라도, \"대신 내일 오후까지 처리해 드리거나 다른 방식으로 돕겠다\"며 조정 가능한 대안을 제시한다.":"Even if I can't accept it right away, I offer an adjustable alternative such as \"I can do it by tomorrow afternoon instead, or help in another way.\"","나의 의견에 대해 부정적인 피드백을 하는 사람을 마주했을 때 나의 대처 방식은?":"How do I respond when someone gives negative feedback on my opinion?","상대의 비판이 객관적인 사실에 부합하지 않거나 왜곡된 부분이 있다면 단호하게 반박한다.":"If the criticism does not match the objective facts or is distorted, I firmly refute it.","부정적인 감정에 깊이 휩쓸려 상처받지 않도록 하고, 상대가 비판하는 내용 중 나에게 쓸모 있는 정보만 걸러 수용한다.":"I avoid getting deeply hurt by negative emotions and accept only the useful information from the criticism.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고 받아들인다.":"Rather than feeling hurt by the sharp tone, I take the point as an opportunity to reflect on myself and accept it.","상대의 조언에 고마움을 표현하며, 나를 한 단계 더 도약시키는 배움과 개선의 기회로 삼는다.":"I thank the person for the advice and use it as an opportunity to learn, improve and take a step forward.","협업 중 내가 맡은 부분이 아닌 곳에서 문제가 발생했을 때 나의 대처 방식은?":"How do I respond when a problem arises in a part of a collaboration that is not my responsibility?","내가 명확히 맡은 영역의 일들을 한 치의 실수 없이 성실하게 처리하는 것에 집중한다.":"I focus on diligently handling the tasks in my clearly assigned area without a single mistake.","문제가 더 커지지 않도록 원인을 파악하고, 각자의 영역에서 대책을 수립하도록 한다.":"I identify the cause so the problem doesn't grow, and have each person set countermeasures in their own area.","나의 업무 영역이 아니더라도 공동의 목표 달성을 위해 함께 문제를 해결하려 노력한다.":"Even if it is not my area, I try to solve the problem together to achieve the common goal.","과정의 잘잘못을 따지기보다 공동 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Rather than assigning blame for the process, I take ownership and see the joint task through to the end.","교육생의 참여가 저조할 때는 참여를 유도하는 것보다 부담을 주지 않고 지켜보는 것이 좋다고 생각한다.":"When learner participation is low, I think it is better to watch without putting pressure on them than to encourage participation.","매우 그렇지 않다.":"Strongly disagree","내가 기존에 맡던 일을 누군가에게 설명해주어야할 때, 나의 설명 스타일은?":"When I have to explain work I used to handle to someone else, what is my explanation style?","누락되는 내용이 없도록, 관련 업무 문서를 처음부터 끝까지 차분히 읽어주며 설명한다.":"I calmly read through the related work documents from beginning to end so that nothing is missed.","문서를 처음부터 끝까지 읽기보다 핵심이 되는 주요 사항을 위주로 정리하여 설명한다.":"Rather than reading the whole document, I organize and explain the key points.","상대방이 이해하기 쉽도록 핵심 요약과 함께 실제 업무 경험담을 예시로 들어 설명한다.":"Along with a key summary, I give examples from my actual work experience so it is easy to understand.","실제 경험담을 들려주는 것에 그치지 않고, 업무의 구체적인 처리 배경과 실전에서 바로 쓸 수 있는 유용한 팁을 함께 설명한다.":"Beyond sharing experiences, I also explain the specific background of the work and useful tips that can be used right away in practice.","동료나 상사 앞에서 나의 의견을 이야기하거나 기획안을 보고할 때 나의 평소 말하는 스타일은?":"What is my usual speaking style when giving my opinion or reporting a plan in front of colleagues or superiors?","차분하게 내용을 모두 전달하기 위해, 감정의 변화 없이 일정한 빠르기와 톤을 유지하며 설명한다.":"To deliver all the content calmly, I keep a steady pace and tone without emotional change.","듣는 이가 나의 말을 잘 따라오고 있는지 표정을 살피며, 전반적인 말의 속도를 조절한다.":"I watch the listeners' faces to see if they are following me and adjust my overall speaking pace.","말의 속도를 조절하면서 중요 핵심 단계에서는 목소리의 크기나 톤을 높여 확실히 강조한다.":"While adjusting my pace, I clearly emphasize key steps by raising my volume or tone.","말의빠르기와 강약을 조절하다가, 강조하고 싶은 핵심 직전에 말을 잠시 멈춘다.":"I adjust my pace and emphasis, and pause briefly right before the key point I want to emphasize.","T-NPS를 확인할 때 어디까지 살펴보는가?":"How far do I look when checking T-NPS?","유독 점수가 떨어지는 취약 지역이나 특정 수리 제품군 위주로 대조해 본다.":"I compare mainly the weak regions or specific repair product groups where scores are particularly low.","각 SE들의 개별 점수와 세부적인 개인별 편차까지 일일이 매칭하여 대조한다.":"I match and compare each SE's individual score and detailed individual variances one by one.","스스로 고민하게 두기보다, 잘못된 부분과 해결책을 빠르게 알려주는 것이 더 효율적인 피드백 방식이다.":"Rather than letting people think it through themselves, quickly pointing out what is wrong and the solution is a more efficient way to give feedback.","복잡한 텍스트 정보를 PPT로 정리할 때, 내가 주로 PPT를 구성하는 방식은?":"When organizing complex text information in a PPT, how do I usually structure it?","내 우선순위와 제약 사항을 차분히 설명하며, 기분 상하지 않게 완곡한 어조로 거절의 뜻을 전한다.":"I calmly explain my priorities and constraints and decline in a gentle tone so as not to offend.","동료/후배의 업무 결과물에 대해 내가 피드백을 주어야 할 때, 나의 평소 스타일은?":"What is my usual style when I have to give feedback on a colleague's or junior's work?","수정이 필요한 부분을 명확히 짚고, 보완해야 할 점을 알아들을 수 있게 직설적으로 설명한다.":"I clearly point out what needs to be fixed and explain directly what should be improved so it is understood.","상대방이 무안하지 않도록 가벼운 칭찬을 먼저 건넨 뒤 고쳐야할 점을 이야기한다.":"I first give light praise so the person isn't embarrassed, then talk about what needs to be fixed.","가벼운 칭찬 후 잘못된 부분을 이야기할 때 올바르게 수정할 수 있도록 예시나 참고 사항을 제공해준다.":"After light praise, when pointing out mistakes, I provide examples or references so they can correct them properly.","바로 고칠점에 대해 이야기하기보다, 상대가 잘못된 부분을 스스로 생각하고 깨닫도록 질문을 던진다.":"Rather than telling them right away what to fix, I ask questions so they can think and realize the mistakes themselves.","많은 노력을 쏟은 일에서 성과가 없어나 아무런 변화가 없을 때 내가 느끼는 반응은?":"How do I react when there are no results or no change after putting a lot of effort into something?","좌절감에 깊이 빠지지 않도록 감정을 분리하고, 정해진 교육과 코칭에 전념한다.":"I detach my emotions so I don't sink into frustration, and devote myself to the planned training and coaching.","일시적인 정체와 실패에 마음 다치지 않고 MOT 교육을 끈기 있게 지속하면 SE들의 행동과 T-NPS는 결국 상승한다는 확신을 유지한다.":"Without being hurt by temporary stagnation or failure, I stay confident that if MOT training continues persistently, SEs' behavior and T-NPS will eventually rise.","동료에게 업무 및 기타 사항 설명 시, 말을 잘 이애하고 있는지 확인하는 방식은?":"When explaining work or other matters to a colleague, how do I check whether they understand?","상대의 표정이나 반응을 살피기보다 내가 준비한 것을 설명하는 것에 집중한다.":"I focus on explaining what I prepared rather than watching their expressions or reactions.","설명하면서 상대방이 고개를 끄덕이는지 등을 눈여겨본다.":"While explaining, I watch whether the other person is nodding.","상대방이 가만히 듣고 있을 때, \"혹시 이해 안 가거나 더 궁금한 부분이 있나요?\"라고 직접 물어본다.":"When the other person is just listening quietly, I ask directly, \"Is there anything unclear or anything else you'd like to know?\"","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다":"Even if they say they understand, I notice subtle hesitation or a stiff expression and proactively explain it more simply.","상대방이 내 설명을 이해하지 못하거나 어려워할 때 나의 방식은?":"How do I respond when the other person doesn't understand my explanation or finds it difficult?","앞서 설명했던 내용을 다시 천천히 이야기하며 강조한다.":"I repeat what I explained earlier slowly and with emphasis.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명하거나 추가적인 정보를 제공한다.":"I explain again focusing on the parts they find difficult, or provide additional information.","상대방이 어려움을 느끼는 부분을 파악해 설명 방식이나 예시를 바꾸어 다시 설명한다.":"I identify the parts they find difficult and explain again with a different approach or example.","상대방이 어느 지점에서 왜 이해하지 못했는지 원인을 파악하여 상대방의 눈높이에 맞춰 설명 방식을 수정한다.":"I find out where and why they didn't understand and adjust my explanation to their level.","T-NPS 점수가 낮을 때, 원인을 분류하는 나의 방식은?":"When T-NPS scores are low, how do I classify the causes?","원인을 분류할 때 고객 의견도 읽으며 불만이 개인의 문제인지, 다른 요인이 엮여 있는지 분류한다.":"When classifying causes, I also read customer feedback to determine whether a complaint is an individual issue or involves other factors.","SE 개인이 통제할 수 없는 환경적 제약 요인을 감안하여, 순수 개인 응대와 관련된 것만 따로 분리하여 확인한다.":"Considering environmental constraints the SE cannot control, I separate and review only what relates purely to individual handling.","법인에서 진행한 교육이나 코칭이 실제 T-NPS 등 지표 개선에 기여했는지 확인하는 방식은?":"How do I check whether training or coaching conducted by the subsidiary actually contributed to improving metrics such as T-NPS?","교육을 집중적으로 진행한 센터와 그렇지 않은 센터 간의 월별 T-NPS 점수 차이를 비교한다.":"I compare monthly T-NPS score differences between centers that received intensive training and those that did not.","교육 이수 SE를 바탕으로, 해당 SE의 교육 1개월 이후 T-NPS 점수가 교육 전보다 올랐는지 직접 대조해 본다.":"For SEs who completed training, I directly compare whether their T-NPS score one month after training rose compared with before.","교육생들의 T-NPS 점수를 2~3달 뒤에도 장기적으로 트랙킹한다.":"I track learners' T-NPS scores over the long term, even 2–3 months later.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 사후 피드백(F/UP)은 따로 진행하지 않는다.":"Due to my subsidiary's conditions, I do not separately track learners' T-NPS scores or provide follow-up feedback (F/UP) after training.","슬라이드의 가독성과 시각적 설득력을 높이기 위해, 내가 주로 사용하는 방식은?":"What do I mainly use to improve slide readability and visual persuasiveness?","디자인 요소를 최소화하여, 기본 흰색 배경에 텍스트 위주의 단순한 형태로 작성한다.":"I minimize design elements and write in a simple, text-focused form on a plain white background.","회사나 인터넷에서 제공하는 기본적인 PPT 레이아웃 서식을 가져와 단정하게 텍스트를 배치한다.":"I use basic PPT layout templates from the company or the internet and arrange the text neatly.","설명하고자 하는 키워드와 연관된 아이콘, 일러스트, 또는 실무 관련 사진 자료를 적절히 배치한다.":"I appropriately place icons, illustrations or work-related photos associated with the keywords I want to explain.","아이콘이나 사진을 적절히 배치하면서, 굵은 상자나 하이라이트 등의 시각적 요소를 적절히 활용한다.":"While placing icons or photos appropriately, I also make good use of visual elements such as bold boxes or highlights.","PPT로 교안 및 문서를 만들 때, 나의 평소 제작 방식에 가장 가까운 것은?":"When creating training materials or documents in PPT, which is closest to my usual way of working?","도형의 크기나 간격을 하나씩 마우스로 맞추고, 기본적인 기능 위주로 차근차근 작업하여 시간이 다소 걸리는 편이다.":"I adjust the size and spacing of shapes one by one with the mouse and work step by step with basic functions, so it tends to take some time.","복사(Ctrl+C), 붙여넣기(Ctrl+V) 등 누구나 아는 기초적인 단축키를 활용하여 작업 시간을 줄여나간다.":"I reduce working time using basic shortcuts everyone knows, such as copy (Ctrl+C) and paste (Ctrl+V).","서식 복사, 빠른 실행 도구 모음(QAT), 도형 맞춤/정렬 단축키 등을 능숙하게 사용하여 작업 시간을 대폭 단축한다.":"I skillfully use Format Painter, the Quick Access Toolbar (QAT) and shape align/distribute shortcuts to greatly cut working time.","반복되는 슬라이드 레이아웃은 마스터나 서식 파일을 직접 만들어, 전체 문서의 통일성을 유지하면서도 빠르게 작업한다.":"For recurring slide layouts, I create my own masters or templates to work quickly while keeping the whole document consistent.","동료에게 설명 시, 공식 가이드 문서를 그대로 전달하는 것이 가장 안전하고 효과적인 설명 방식이다.":"When explaining to a colleague, passing on the official guide document as is, is the safest and most effective way to explain.","대화 중 동료가 대화 흐름과 무관한 이야기를 할 때 나의 대처 방식은?":"How do I respond when a colleague brings up something unrelated to the flow of the conversation?","뜬금없는 이야기에 크게 반응하지 않고, 원래 이전 대화 주제로 조용히 화제를 바꾼다.":"I don't react much to the random remark and quietly steer the conversation back to the previous topic.","대화의 흐름이 깨졌음을 상대가 알 수 있게 짚어준 뒤, 원래 하던 화제로 빠르게 분위기를 돌린다.":"I point out that the flow of the conversation was broken and quickly bring it back to the original topic.","상대방이 갑자기 꺼낸 이야기를 어색하지 않게 몇 마디 맞장구친 뒤, 자연스럽게 본래 이야기로 돌아온다.":"I respond with a few words so the other person doesn't feel awkward, then naturally return to the original topic.","상대방이 꺼낸 이야기에서 원래 주제와 이어질 만한 접점을 찾아내어, 대화 흐름이 끊기지 않게 본래 이야기로 연결한다.":"I find a link between what they brought up and the original topic, and connect back so the flow of the conversation isn't broken.","팀 프로젝트나 협업 중, 적극적으로 참여하지 않고 은근슬쩍 겉도는 팀원이 있을 때 나의 대처 방식은?":"How do I respond when a team member doesn't participate actively and quietly drifts during a team project or collaboration?","다른 팀원의 참여 여부에 신경 쓰기보다, 나에게 주어진 역할에 집중한다.":"Rather than worrying about whether other members participate, I focus on my own role.","내가 직접 개입하기보다, 팀장이나 리더에게 조용히 상황을 공유하여 해결을 맡긴다.":"Rather than stepping in myself, I quietly share the situation with the team leader and leave it to them to resolve.","동료로서 편하게 다가가, 혹시 업무에 어려운 부분이나 고충이 있는지 조용히 물어본다.":"I approach them comfortably as a colleague and quietly ask if they are having any difficulties with the work.","진행 중인 자료나 문서를 가볍게 공유해 주며, \"이 부분 한 번만 훑어봐 주실 수 있나요?\"라고 자연스럽게 상대의 의견을 묻는다.":"I casually share the material or document in progress and naturally ask for their opinion: \"Could you take a quick look at this part?\"","PPT 디자인을 할 때는 시각적 요소를 넣기보다, 군더더기 없이 텍스트 자체만 명확히 전달하는 편이 효과적이다.":"When designing a PPT, it is more effective to convey the text itself clearly without extra visual elements.","상대의 날카로운 말투에 서운해하기보다 그 지적을 나를 돌아보는 계기로 삼고, 기꺼이 받아들인다.":"Rather than feeling hurt by the sharp tone, I take the point as an opportunity to reflect on myself and gladly accept it.","협업 중, 예상치 못한 문제가 발생했을 때 나의 대처 방식은?":"How do I respond when an unexpected problem occurs during collaboration?","과정의 잘잘못을 따지기보다 과제 달성의 결과를 내가 끝까지 책임진다는 오너십을 갖고 임한다.":"Rather than assigning blame for the process, I take ownership and see the task through to the end.","법인 여건 및 상황 상, 교육 이후 교육생들의 T-NPS 점수 추적이나 피드백은 따로 진행하지 않는다.":"Due to my subsidiary's conditions, I do not separately track learners' T-NPS scores or provide feedback after training.","상대방이 이해하기 어려워하는 부분 위주로 다시 설명한다.":"I explain again focusing on the parts they find difficult.","가벼운 대화나 유머로 기분을 환기하거나, 동료들과 솔직하게 털어놓으며 스트레스를 해소한다.":"I refresh my mood with light conversation or humor, or relieve stress by talking openly with colleagues.","나만의 확실한 해소법이나 여가 활동으로 감정을 빠르게 정돈하며, 이 시련을 배움의 기회로 삼는다.":"I quickly settle my emotions with my own reliable outlet or leisure activity, and treat the hardship as a chance to learn.","상대방이 말로는 이해했다고 해도 머뭇거리거나 굳어 있는 미묘한 표정을 눈치채고, 먼저 더 쉽게 바꾸어 설명한다.":"Even if they say they understand, I notice subtle hesitation or a stiff expression and proactively explain it more simply."},"vi":{"슬라이드의 주요 강의 내용을 교육생에게 설명할 때 나의 방식은?":"Khi giải thích nội dung chính trên slide cho học viên, cách làm của tôi là?","중요한 부분이 누락되지 않도록 슬라이드의 텍스트를 정독한다.":"Tôi đọc kỹ chữ trên slide để không bỏ sót phần quan trọng.","슬라이드의 글을 핵심 위주로 요약하며 설명한다.":"Tôi tóm tắt nội dung slide theo các ý chính để giải thích.","쉽게 이해할 수 있도록 현장 상황에 맞는 구체적인 비유나 사례를 들어 설명한다.":"Tôi đưa ra ví dụ hoặc so sánh cụ thể phù hợp với thực tế hiện trường để dễ hiểu.","비유나 사례를 들어 설명하면서, 필요한 경우 실제 현장의 응대 행동이나 대사를 가볍게 재현하여 보여준다.":"Vừa dùng ví dụ, so sánh, khi cần tôi còn tái hiện nhẹ hành động hoặc câu nói khi tiếp khách thực tế.","강의를 진행하는 동안, 나의 시선과 몸의 움직임은?":"Trong khi giảng dạy, ánh mắt và cử động cơ thể của tôi như thế nào?","교안 내용을 놓치지 않기 위해 주로 스크린이나 모니터 화면을 바라본다.":"Tôi chủ yếu nhìn màn chiếu hoặc màn hình để không bỏ sót nội dung bài giảng.","교육생과 눈이 마주치는 것이 다소 어색하여 주로 강의실 뒤쪽 등을 바라보며 정해진 자리에 있는다.":"Tôi hơi ngại khi nhìn vào mắt học viên nên chủ yếu nhìn về phía cuối lớp và đứng một chỗ cố định.","교육생들과 눈을 고루 맞추며, 주로 리액션이나 호응이 좋은 이들을 중심으로 시선을 둔다.":"Tôi giao tiếp bằng mắt với học viên, nhưng chủ yếu tập trung vào những người phản ứng và hưởng ứng tốt.","몸의 움직임을 적당히 조절하며, 소외되는 교육생이 없도록 시선을 고르게 분배한다.":"Tôi điều chỉnh cử động hợp lý và phân bổ ánh nhìn đều để không học viên nào bị bỏ rơi.","T-NPS를 확인할 때 나의 방식은?":"Khi xem T-NPS, cách làm của tôi là?","법인 전체의 평균 점수와 증감 추이 위주로 파악한다.":"Tôi chủ yếu nắm điểm trung bình toàn pháp nhân và xu hướng tăng giảm.","법인 내 센터별 평균 점수를 서로 비교해 보며, 저조 센터를 위주로 확인한다.":"Tôi so sánh điểm trung bình giữa các trung tâm trong pháp nhân và tập trung vào các trung tâm điểm thấp.","점수가 저조한 지역이나 특정 수리 제품군의 T-NPS를 분석해 주요 취약점과 강점을 파악한다.":"Tôi phân tích T-NPS của khu vực điểm thấp hoặc nhóm sản phẩm sửa chữa cụ thể để nắm điểm yếu và điểm mạnh chính.","센터별 취약 요인과 소속 SE들의 개별 점수 및 편차를 세부적으로 비교.분석해, 구체적인 강점과 개선 필요 영역을 도출한다.":"Tôi so sánh, phân tích chi tiết yếu tố yếu của từng trung tâm cùng điểm cá nhân và độ chênh lệch của các SE để rút ra điểm mạnh và lĩnh vực cần cải thiện cụ thể.","법인 여건 및 상황 상, T-NPS를 확인하는 업무를 수행하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không thực hiện công việc xem T-NPS.","데이터를 바탕으로 법인의 구체적인 개선 요인을 도출하는 나의 방식은?":"Cách tôi rút ra các yếu tố cải thiện cụ thể cho pháp nhân dựa trên dữ liệu là?","법인 전체 T-NPS 점수의 증감 추이와 전반적인 동향 자체를 법인의 핵심 개선 방향으로 삼는다.":"Tôi lấy chính xu hướng tăng giảm và diễn biến chung của điểm T-NPS toàn pháp nhân làm hướng cải thiện chính.","제공되는 항목별 수치를 확인하여 가장 점수가 낮은 핵심 불만 카테고리를 개선 요인으로 선별한다.":"Tôi xem số liệu theo từng hạng mục và chọn nhóm khiếu nại chính có điểm thấp nhất làm yếu tố cải thiện.","SE의 점수와 고객이 남긴 불만 코멘트를 정독하며 실질적인 개선 요인을 도출한다.":"Tôi đọc kỹ điểm của SE và bình luận khiếu nại của khách hàng để rút ra yếu tố cải thiện thực chất.","T-NPS 및 고객 코멘트 & SE의 과거 지표를 엮어 불만이 반복적으로 일어나는 이유를 확인한다.":"Tôi kết hợp T-NPS, bình luận khách hàng và các chỉ số trước đây của SE để tìm ra lý do khiếu nại lặp lại.","법인 여건 및 상황 상, 데이터를 분석하여 법인의 개선 요인을 도출하는 업무를 하지 않는다.":"Do điều kiện và tình hình của pháp nhân, tôi không thực hiện việc phân tích dữ liệu để tìm yếu tố cải thiện.","HQ의 교육 콘텐츠를 법인에 활용하는 방식은?":"Cách tôi sử dụng nội dung đào tạo của HQ tại pháp nhân là?","HQ가 제공한 영어 콘텐츠를 그대로 활용한다.":"Tôi dùng nguyên nội dung tiếng Anh do HQ cung cấp.","HQ 콘텐츠의 구성과 내용을 유지하며 텍스트를 현지 언어로 바꾸어 빠르게 강의에 적용한다.":"Tôi giữ nguyên cấu trúc và nội dung của HQ, dịch chữ sang tiếng địa phương và nhanh chóng áp dụng vào bài giảng.","법인의 상황과 사례에 맞게 세부 슬라이드의 내용과 표현을 수정한다.":"Tôi chỉnh sửa nội dung và cách diễn đạt của từng slide cho phù hợp với tình hình và ví dụ của pháp nhân.","HQ의 콘텐츠를 기반으로 법인 상황과 교육생 특성에 맞는 콘텐츠 내용을 자체 개발한다.":"Dựa trên nội dung của HQ, tôi tự phát triển nội dung phù hợp với tình hình pháp nhân và đặc điểm học viên.","PPT를 제작할 때 전체 슬라이드의 순서와 흐름을 구성하는 방식은?":"Khi làm PPT, cách tôi sắp xếp thứ tự và mạch của toàn bộ slide là?","전달할 내용을 머릿속에 떠오르는 순서대로 슬라이드 화면에 적어 넣는다.":"Tôi viết nội dung lên slide theo thứ tự nghĩ ra trong đầu.","대략적인 주제별로 영역을 구분하고, 그 주제에 맞춰 슬라이드를 배치한다.":"Tôi chia nội dung theo các chủ đề lớn và sắp xếp slide theo chủ đề đó.","문제 제기 → 원인 분석 → 해결 방향처럼, 슬라이드 간의 논리적인 인과 흐름이 있도록 연결한다.":"Tôi kết nối các slide theo mạch nhân quả logic như: nêu vấn đề → phân tích nguyên nhân → hướng giải quyết.","결론을 먼저 제시하는 두괄식 구조를 바탕으로, PPT의 핵심 메시지가 하나의 흐름으로 이어질 수 있도록 구성한다.":"Dựa trên cấu trúc nêu kết luận trước, tôi sắp xếp để thông điệp chính của PPT xuyên suốt một mạch.","내가 전달하는 교육 내용이나 방향에 대해 고충과 부정적인 의견을 말하는 교육생을 만났을 때 나의 대처 방식은?":"Khi gặp học viên than phiền hoặc có ý kiến tiêu cực về nội dung hay định hướng đào tạo tôi truyền đạt, tôi xử lý thế nào?","일관된 기준 준수와 성과를 위해 교육 내용을 반드시 준수해야 함을 원칙적으로 차분히 타이른다.":"Tôi bình tĩnh nhắc nhở theo nguyên tắc rằng cần tuân thủ nội dung đào tạo để đảm bảo tiêu chuẩn và kết quả nhất quán.","교육생이 처한 현실적 어려움에 가볍게 공감한 뒤, 즉시 실행할 수 있는 단순한 타협점이나 절충안을 빠르게 제시한다.":"Tôi đồng cảm nhẹ với khó khăn thực tế của học viên rồi nhanh chóng đưa ra phương án thỏa hiệp đơn giản có thể làm ngay.","교육생의 답답함과 거부감을 끝까지 경청하고 공감한 뒤, 이를 해소할 수
